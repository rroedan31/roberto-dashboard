    // ----------------------------------------------------

    function TaskForm({ item, onSave, onCancel }) {
      const [title, setTitle] = useState(item ? item.title : '');
      const [category, setCategory] = useState(item ? item.category : 'Preparación');
      const [priority, setPriority] = useState(item ? item.priority : 'Media');
      const [status, setStatus] = useState(item ? item.status : 'pendiente');
      const [dueDate, setDueDate] = useState(item ? item.dueDate : new Date().toISOString().slice(0, 10));
      const [time, setTime] = useState(item?.time || '');
      const [notes, setNotes] = useState(item ? item.notes : '');

      const handleSubmit = (e) => {
        e.preventDefault();
        if (!title.trim()) return alert("Por favor, introduce el título de la tarea");
        onSave({ id: item?.id, title, category, priority, status, dueDate, time, notes });
      };

      return (
        <form onSubmit={handleSubmit} className="space-y-4 text-xs">
          <div>
            <label className="font-semibold block mb-1">Título de la Tarea *</label>
            <input
              type="text"
              value={title}
              onChange={(e) => setTitle(e.target.value)}
              placeholder="p. ej., Preparar ejercicios de gramática"
              className="w-full px-3 py-2 rounded-lg bg-slate-50 dark:bg-slate-800 border border-slate-200 dark:border-slate-700 outline-none focus:ring-2 focus:ring-accent"
              required
            />
          </div>

          <div className="grid grid-cols-2 gap-3">
            <div>
              <label className="font-semibold block mb-1">Categoría</label>
              <select
                value={category}
                onChange={(e) => setCategory(e.target.value)}
                className="w-full px-3 py-2 rounded-lg bg-slate-50 dark:bg-slate-800 border border-slate-200 dark:border-slate-700 outline-none"
              >
                {['Preparación', 'Calificaciones', 'Administración', 'Seguimiento', 'Currículo', 'Personal'].map(c => <option key={c} value={c}>{c}</option>)}
              </select>
            </div>
            <div>
              <label className="font-semibold block mb-1">Prioridad</label>
              <select
                value={priority}
                onChange={(e) => setPriority(e.target.value)}
                className="w-full px-3 py-2 rounded-lg bg-slate-50 dark:bg-slate-800 border border-slate-200 dark:border-slate-700 outline-none"
              >
                {['Urgente', 'Alta', 'Media', 'Baja'].map(p => <option key={p} value={p}>{p}</option>)}
              </select>
            </div>
          </div>

          <div className="grid grid-cols-3 gap-3">
            <div>
              <label className="font-semibold block mb-1">Fecha Límite</label>
              <input
                type="date"
                value={dueDate}
                onChange={(e) => setDueDate(e.target.value)}
                className="w-full px-3 py-2 rounded-lg bg-slate-50 dark:bg-slate-800 border border-slate-200 dark:border-slate-700 outline-none"
              />
            </div>
            <div>
              <label className="font-semibold block mb-1">Hora (Opcional)</label>
              <input
                type="time"
                value={time}
                onChange={(e) => setTime(e.target.value)}
                className="w-full px-3 py-2 rounded-lg bg-slate-50 dark:bg-slate-800 border border-slate-200 dark:border-slate-700 outline-none"
              />
            </div>
            <div>
              <label className="font-semibold block mb-1">Estado</label>
              <select
                value={status}
                onChange={(e) => setStatus(e.target.value)}
                className="w-full px-3 py-2 rounded-lg bg-slate-50 dark:bg-slate-800 border border-slate-200 dark:border-slate-700 outline-none"
              >
                <option value="pendiente">Pendiente</option>
                <option value="en_progreso">En Progreso</option>
                <option value="completada">Completada</option>
              </select>
            </div>
          </div>

          <div>
            <label className="font-semibold block mb-1">Notas y Detalles</label>
            <textarea
              rows="3"
              value={notes}
              onChange={(e) => setNotes(e.target.value)}
              placeholder="Puntos clave, enlaces a materiales o recordatorios..."
              className="w-full px-3 py-2 rounded-lg bg-slate-50 dark:bg-slate-800 border border-slate-200 dark:border-slate-700 outline-none"
            ></textarea>
          </div>

          <div className="flex justify-end gap-2 pt-2">
            <button type="button" onClick={onCancel} className="px-4 py-2 rounded-lg bg-slate-100 dark:bg-slate-800 font-semibold">Cancelar</button>
            <button type="submit" className="px-4 py-2 rounded-lg bg-accent hover:bg-accent-dark text-white font-bold">Guardar Tarea</button>
          </div>
        </form>
      );
    }

    function ClassForm({ item, defaultDate, students, onSave, onCancel }) {
      const studentList = (students && Array.isArray(students)) ? students : [];
      
      const initialStudentIds = (item && Array.isArray(item.enrolledStudentIds) && item.enrolledStudentIds.length > 0)
        ? item.enrolledStudentIds
        : (studentList.length > 0 ? [studentList[0].id] : []);

      const [selectedStudentIds, setSelectedStudentIds] = useState(initialStudentIds);
      const [subject, setSubject] = useState(item ? (item.subject || 'Tutoría') : 'Tutoría');
      const [dayOfWeek, setDayOfWeek] = useState(item ? (item.dayOfWeek || 'Lunes') : 'Lunes');
      const [date, setDate] = useState((item && item.date) ? item.date : (defaultDate || new Date().toISOString().slice(0, 10)));
      const [time, setTime] = useState((item && item.time) ? item.time : '18:00');
      const [durationMinutes, setDurationMinutes] = useState((item && item.durationMinutes) ? item.durationMinutes : 60);
      const [location, setLocation] = useState((item && item.location) ? item.location : '');
      const [billingType, setBillingType] = useState(item ? (item.billingType || 'Regular') : 'Regular');
      const [description, setDescription] = useState((item && item.description) ? item.description : '');
      const [autoInvoice, setAutoInvoice] = useState(!item && (!item || (item.billingType || 'Regular') === 'Regular'));

      const toggleStudent = (id) => {
        setSelectedStudentIds(prev => {
          if (prev.includes(id)) {
            // No permitir vaciar si es el único, o permitir al menos 1
            if (prev.length <= 1) return prev;
            return prev.filter(sid => sid !== id);
          } else {
            return [...prev, id];
          }
        });
      };

      // Nombres de los alumnos seleccionados
      const selectedStudents = useMemo(() => {
        return studentList.filter(s => selectedStudentIds.includes(s.id));
      }, [studentList, selectedStudentIds]);

      const studentNames = selectedStudents.map(s => s.name);
      let generatedClassName = 'Clase';
      if (studentNames.length === 1) {
        generatedClassName = 'Clase con ' + studentNames[0];
      } else if (studentNames.length > 1) {
        generatedClassName = 'Clase con ' + studentNames.join(', ');
      }

      const isNonBillable = billingType !== 'Regular';

      const handleFormSubmit = (e) => {
        e.preventDefault();
        onSave({
          id: item ? item.id : undefined,
          name: generatedClassName,
          subject: subject || 'Tutoría',
          dayOfWeek: dayOfWeek || 'Lunes',
          date: date || new Date().toISOString().slice(0, 10),
          time: time || '18:00',
          durationMinutes: Number(durationMinutes) || 60,
          location: location || '',
          capacity: Math.max(selectedStudentIds.length, 1),
          billingType: billingType || 'Regular',
          description: description || ('Sesión de ' + (durationMinutes || 60) + ' min'),
          enrolledStudentIds: selectedStudentIds,
          status: (item && item.status) ? item.status : 'Programada',
          autoInvoice: isNonBillable ? false : Boolean(autoInvoice)
        });
      };

      return (
        <form onSubmit={handleFormSubmit} className="space-y-4 text-xs">
          <div>
            <div className="flex items-center justify-between mb-1.5">
              <label className="font-bold text-slate-700 dark:text-slate-200">
                Estudiantes de la Clase * ({selectedStudentIds.length} seleccionado{selectedStudentIds.length === 1 ? '' : 's'})
              </label>
              <span className="text-[11px] text-slate-400">Puedes seleccionar uno o varios</span>
            </div>

            {studentList.length === 0 ? (
              <p className="text-xs text-rose-500 p-2 bg-rose-50 dark:bg-rose-950/40 rounded-lg">
                No tienes alumnos registrados aún. Regístralos en la pestaña "Estudiantes y Reservas".
              </p>
            ) : (
              <div className="border border-slate-200 dark:border-slate-700 rounded-xl p-2.5 max-h-48 overflow-y-auto space-y-1.5 bg-slate-50/50 dark:bg-slate-800/50">
                {studentList.map(s => {
                  const isChecked = selectedStudentIds.includes(s.id);
                  return (
                    <label
                      key={s.id}
                      onClick={() => toggleStudent(s.id)}
                      className={`flex items-center justify-between p-2 rounded-lg cursor-pointer transition select-none ${
                        isChecked
                          ? 'bg-accent/10 border border-accent/30 text-accent-dark dark:text-accent-light'
                          : 'bg-white dark:bg-slate-800 border border-transparent text-slate-700 dark:text-slate-300 hover:bg-slate-100 dark:hover:bg-slate-750'
                      }`}
                    >
                      <div className="flex items-center gap-2.5">
                        <input
                          type="checkbox"
                          checked={isChecked}
                          onChange={() => {}} // Manejado por onClick en label
                          className="w-4 h-4 rounded text-accent focus:ring-accent accent-accent cursor-pointer"
                        />
                        <span className="font-bold text-xs">{s.name}</span>
                      </div>
                      {s.hourlyRate ? (
                        <span className="text-[11px] font-semibold text-slate-500 dark:text-slate-400">
                          ${s.hourlyRate}/h
                        </span>
                      ) : null}
                    </label>
                  );
                })}
              </div>
            )}

            <div className="mt-2 p-2 rounded-lg bg-slate-100 dark:bg-slate-800 text-[11px] flex items-start gap-1.5">
              <span className="text-slate-400 font-semibold shrink-0">Nombre automático:</span>
              <span className="font-bold text-accent dark:text-accent-light break-words">{generatedClassName}</span>
            </div>
          </div>

          {/* TIPO DE FACTURACIÓN: REGULAR, CORTESÍA, GRATIS, REPOSICIÓN */}
          <div className="p-3 rounded-xl border border-slate-200 dark:border-slate-700 bg-slate-50/70 dark:bg-slate-800/60 space-y-1.5">
            <label className="font-bold block text-slate-800 dark:text-slate-100">
              Modalidad de Cobro de la Clase
            </label>
            <select
              value={billingType}
              onChange={(e) => {
                const val = e.target.value;
                setBillingType(val);
                if (val !== 'Regular') setAutoInvoice(false);
              }}
              style={{ color: '#000000', backgroundColor: '#ffffff' }}
              className="w-full px-3 py-2.5 rounded-lg bg-white border border-slate-300 font-bold text-black outline-none focus:ring-2 focus:ring-accent text-xs sm:text-sm"
            >
              <option value="Regular" style={{ color: '#000000', backgroundColor: '#ffffff' }}>Clase Regular (Con cobro habitual)</option>
              <option value="Cortesía" style={{ color: '#000000', backgroundColor: '#ffffff' }}>🎁 Clase de Cortesía (Sin cobro / $0)</option>
              <option value="Gratis" style={{ color: '#000000', backgroundColor: '#ffffff' }}>⭐ Clase Gratis (Sin cobro / $0)</option>
              <option value="Reposición" style={{ color: '#000000', backgroundColor: '#ffffff' }}>🔄 Clase de Reposición (Sin cobro / $0)</option>
            </select>
            {isNonBillable && (
              <p className="text-[11px] font-semibold text-emerald-600 dark:text-emerald-400 flex items-center gap-1 mt-1">
                <span>✓ Esta clase no generará cobro ni contará como saldo pendiente.</span>
              </p>
            )}
          </div>

          <div className="grid grid-cols-3 gap-3">
            <div>
              <label className="font-semibold block mb-1">Materia / Asignatura</label>
              <input
                type="text"
                value={subject}
                onChange={(e) => setSubject(e.target.value)}
                placeholder="p. ej., Idiomas"
                className="w-full px-3 py-2 rounded-lg bg-slate-50 dark:bg-slate-800 border border-slate-200 dark:border-slate-700 outline-none"
              />
            </div>
            <div>
              <label className="font-semibold block mb-1">Fecha</label>
              <input
                type="date"
                value={date}
                onChange={(e) => {
                  setDate(e.target.value);
                  const d = new Date(e.target.value);
                  const days = ['Domingo', 'Lunes', 'Martes', 'Miércoles', 'Jueves', 'Viernes', 'Sábado'];
                  setDayOfWeek(days[d.getUTCDay()]);
                }}
                className="w-full px-3 py-2 rounded-lg bg-slate-50 dark:bg-slate-800 border border-slate-200 dark:border-slate-700 outline-none"
              />
            </div>
            <div>
              <label className="font-semibold block mb-1">Día de la Semana</label>
              <select
                value={dayOfWeek}
                onChange={(e) => setDayOfWeek(e.target.value)}
                className="w-full px-3 py-2 rounded-lg bg-slate-50 dark:bg-slate-800 border border-slate-200 dark:border-slate-700 outline-none"
              >
                {['Lunes', 'Martes', 'Miércoles', 'Jueves', 'Viernes', 'Sábado', 'Domingo'].map(d => <option key={d} value={d}>{d}</option>)}
              </select>
            </div>
          </div>

          <div className="grid grid-cols-2 gap-3">
            <div>
              <label className="font-semibold block mb-1">Hora de inicio</label>
              <input
                type="time"
                value={time}
                onChange={(e) => setTime(e.target.value)}
                className="w-full px-3 py-2 rounded-lg bg-slate-50 dark:bg-slate-800 border border-slate-200 dark:border-slate-700 outline-none"
              />
            </div>
            <div>
              <label className="font-semibold block mb-1">Duración (min)</label>
              <input
                type="number"
                value={durationMinutes}
                onChange={(e) => setDurationMinutes(e.target.value)}
                className="w-full px-3 py-2 rounded-lg bg-slate-50 dark:bg-slate-800 border border-slate-200 dark:border-slate-700 outline-none"
              />
            </div>
          </div>

          <div>
            <label className="font-semibold block mb-1">Enlace de Videollamada (Zoom / Meet opcional)</label>
            <input
              type="text"
              value={location}
              onChange={(e) => setLocation(e.target.value)}
              placeholder="https://zoom.us/..."
              className="w-full px-3 py-2 rounded-lg bg-slate-50 dark:bg-slate-800 border border-slate-200 dark:border-slate-700 outline-none"
            />
          </div>

          <div>
            <label className="font-semibold block mb-1">Descripción y Contenidos</label>
            <textarea
              rows="2"
              value={description}
              onChange={(e) => setDescription(e.target.value)}
              placeholder="Objetivos de la clase, materiales necesarios..."
              className="w-full px-3 py-2 rounded-lg bg-slate-50 dark:bg-slate-800 border border-slate-200 dark:border-slate-700 outline-none"
            ></textarea>
          </div>

          {!item && !isNonBillable && (
            <div className="flex items-center gap-2 p-3 bg-emerald-50 dark:bg-emerald-950/30 rounded-lg border border-emerald-100 dark:border-emerald-900/50">
              <input 
                type="checkbox" 
                id="autoInvoiceCheck"
                checked={autoInvoice} 
                onChange={(e) => setAutoInvoice(e.target.checked)} 
                className="w-4 h-4 accent-emerald-600"
              />
              <label htmlFor="autoInvoiceCheck" className="text-xs font-semibold text-emerald-800 dark:text-emerald-300 cursor-pointer">
                Generar factura pendiente automáticamente para este alumno
              </label>
            </div>
          )}

          <div className="flex justify-end gap-2 pt-2">
            <button type="button" onClick={onCancel} className="px-4 py-2 rounded-lg bg-slate-100 dark:bg-slate-800 font-semibold">Cancelar</button>
            <button type="submit" className="px-4 py-2 rounded-lg bg-accent hover:bg-accent-dark text-white font-bold">Guardar Clase</button>
          </div>
        </form>
      );
    }

    function StudentForm({ item, onSave, onCancel }) {
      const [name, setName] = useState(item ? item.name : '');
      const [email, setEmail] = useState(item ? item.email : '');
      const [phone, setPhone] = useState(item ? item.phone : '');
      const [hourlyRate, setHourlyRate] = useState(item ? item.hourlyRate : 1500);
      const [status, setStatus] = useState(item ? item.status : 'Activo');
      const [balanceDue, setBalanceDue] = useState(item ? item.balanceDue : 0);
      const [notes, setNotes] = useState(item ? item.notes : '');

      const handleSubmit = (e) => {
        e.preventDefault();
        if (!name.trim()) return alert("El nombre del alumno es obligatorio");
        onSave({
          id: item?.id,
          name,
          email,
          phone,
          hourlyRate: Number(hourlyRate),
          status,
          balanceDue: Number(balanceDue),
          notes
        });
      };

      return (
        <form onSubmit={handleSubmit} className="space-y-4 text-xs">
          <div>
            <label className="font-semibold block mb-1">Nombre Completo del Alumno *</label>
            <input
              type="text"
              value={name}
              onChange={(e) => setName(e.target.value)}
              placeholder="p. ej., Carlos Mendoza"
              className="w-full px-3 py-2 rounded-lg bg-slate-50 dark:bg-slate-800 border border-slate-200 dark:border-slate-700 outline-none"
              required
            />
          </div>

          <div className="grid grid-cols-2 gap-3">
            <div>
              <label className="font-semibold block mb-1">Correo Electrónico</label>
              <input
                type="email"
                value={email}
                onChange={(e) => setEmail(e.target.value)}
                placeholder="alumno@ejemplo.com"
                className="w-full px-3 py-2 rounded-lg bg-slate-50 dark:bg-slate-800 border border-slate-200 dark:border-slate-700 outline-none"
              />
            </div>
            <div>
              <label className="font-semibold block mb-1">Teléfono de Contacto</label>
              <input
                type="text"
                value={phone}
                onChange={(e) => setPhone(e.target.value)}
                placeholder="+34 600 000 000"
                className="w-full px-3 py-2 rounded-lg bg-slate-50 dark:bg-slate-800 border border-slate-200 dark:border-slate-700 outline-none"
              />
            </div>
          </div>

          <div className="grid grid-cols-3 gap-3">
            <div>
              <label className="font-semibold block mb-1">Tarifa por Hora ($)</label>
              <input
                type="number"
                value={hourlyRate}
                onChange={(e) => setHourlyRate(e.target.value)}
                className="w-full px-3 py-2 rounded-lg bg-slate-50 dark:bg-slate-800 border border-slate-200 dark:border-slate-700 outline-none"
              />
            </div>
            <div>
              <label className="font-semibold block mb-1">Estado</label>
              <select
                value={status}
                onChange={(e) => setStatus(e.target.value)}
                className="w-full px-3 py-2 rounded-lg bg-slate-50 dark:bg-slate-800 border border-slate-200 dark:border-slate-700 outline-none"
              >
                <option value="Activo">Activo</option>
                <option value="Inactivo">Inactivo</option>
              </select>
            </div>
            <div>
              <label className="font-semibold block mb-1">Saldo Pendiente ($)</label>
              <input
                type="number"
                value={balanceDue}
                onChange={(e) => setBalanceDue(e.target.value)}
                className="w-full px-3 py-2 rounded-lg bg-slate-50 dark:bg-slate-800 border border-slate-200 dark:border-slate-700 outline-none"
              />
            </div>
          </div>

          <div>
            <label className="font-semibold block mb-1">Notas Pedagógicas y Observaciones</label>
            <textarea
              rows="3"
              value={notes}
              onChange={(e) => setNotes(e.target.value)}
              placeholder="Puntos fuertes, áreas de mejora, preferencias de horario..."
              className="w-full px-3 py-2 rounded-lg bg-slate-50 dark:bg-slate-800 border border-slate-200 dark:border-slate-700 outline-none"
            ></textarea>
          </div>

          <div className="flex justify-end gap-2 pt-2">
            <button type="button" onClick={onCancel} className="px-4 py-2 rounded-lg bg-slate-100 dark:bg-slate-800 font-semibold">Cancelar</button>
            <button type="submit" className="px-4 py-2 rounded-lg bg-accent hover:bg-accent-dark text-white font-bold">Guardar Alumno</button>
          </div>
        </form>
      );
    }

    function BookingForm({ item, students, classes, onSave, onCancel }) {
      const [studentId, setStudentId] = useState(item ? item.studentId : (students[0]?.id || ''));
      const [studentName, setStudentName] = useState(item ? item.studentName : (students[0]?.name || ''));
      const [classId, setClassId] = useState(item ? item.classId : (classes[0]?.id || 'custom'));
      const [className, setClassName] = useState(item ? item.className : (classes[0]?.name || 'Sesión Privada 1 a 1'));
      const [date, setDate] = useState(item ? item.date : new Date().toISOString().slice(0, 10));
      const [time, setTime] = useState(item ? item.time : '10:00');
      const [duration, setDuration] = useState(item ? item.duration : 60);
      const [rate, setRate] = useState(item ? item.rate : (students[0]?.hourlyRate || 1500));
      const [status, setStatus] = useState(item ? item.status : 'Confirmada');
      const [paymentStatus, setPaymentStatus] = useState(item ? item.paymentStatus : 'Pendiente');

      const handleStudentSelect = (e) => {
        const sid = e.target.value;
        setStudentId(sid);
        const s = students.find(x => x.id === sid);
        if (s) {
          setStudentName(s.name);
          setRate(s.hourlyRate);
        }
      };

      const handleClassChange = (e) => {
        const cid = e.target.value;
        setClassId(cid);
        const sel = classes.find(c => c.id === cid);
        if (sel) {
          setClassName(sel.name);
          setDuration(sel.durationMinutes);
        } else {
          setClassName('Sesión Privada 1 a 1');
        }
      };

      const handleSubmit = (e) => {
        e.preventDefault();
        const finalName = studentName.trim() || (students.find(s => s.id === studentId)?.name) || 'Alumno';
        onSave({
          id: item?.id,
          studentId: studentId || ('s-' + Date.now()),
          studentName: finalName,
          classId,
          className,
          date,
          time,
          duration: Number(duration),
          rate: Number(rate),
          status,
          paymentStatus
        });
      };

      return (
        <form onSubmit={handleSubmit} className="space-y-4 text-xs">
          <div className="grid grid-cols-2 gap-3">
            <div>
              <label className="font-semibold block mb-1">Alumno</label>
              {students.length > 0 ? (
                <select
                  value={studentId}
                  onChange={handleStudentSelect}
                  className="w-full px-3 py-2 rounded-lg bg-slate-50 dark:bg-slate-800 border border-slate-200 dark:border-slate-700 outline-none"
                >
                  {students.map(s => <option key={s.id} value={s.id}>{s.name}</option>)}
                </select>
              ) : (
                <input
                  type="text"
                  value={studentName}
                  onChange={(e) => setStudentName(e.target.value)}
                  placeholder="Escribe el nombre del alumno"
                  className="w-full px-3 py-2 rounded-lg bg-slate-50 dark:bg-slate-800 border border-slate-200 dark:border-slate-700 outline-none"
                  required
                />
              )}
            </div>
            <div>
              <label className="font-semibold block mb-1">Clase o Sesión Vinculada</label>
              <select
                value={classId}
                onChange={handleClassChange}
                className="w-full px-3 py-2 rounded-lg bg-slate-50 dark:bg-slate-800 border border-slate-200 dark:border-slate-700 outline-none"
              >
                <option value="custom">Sesión Privada 1 a 1</option>
                {classes.map(c => <option key={c.id} value={c.id}>{c.name}</option>)}
              </select>
            </div>
          </div>

          <div className="grid grid-cols-3 gap-3">
            <div>
              <label className="font-semibold block mb-1">Fecha</label>
              <input
                type="date"
                value={date}
                onChange={(e) => setDate(e.target.value)}
                className="w-full px-3 py-2 rounded-lg bg-slate-50 dark:bg-slate-800 border border-slate-200 dark:border-slate-700 outline-none"
              />
            </div>
            <div>
              <label className="font-semibold block mb-1">Hora de Inicio</label>
              <input
                type="time"
                value={time}
                onChange={(e) => setTime(e.target.value)}
                className="w-full px-3 py-2 rounded-lg bg-slate-50 dark:bg-slate-800 border border-slate-200 dark:border-slate-700 outline-none"
              />
            </div>
            <div>
              <label className="font-semibold block mb-1">Duración (min)</label>
              <input
                type="number"
                value={duration}
                onChange={(e) => setDuration(e.target.value)}
                className="w-full px-3 py-2 rounded-lg bg-slate-50 dark:bg-slate-800 border border-slate-200 dark:border-slate-700 outline-none"
              />
            </div>
          </div>

          <div className="grid grid-cols-3 gap-3">
            <div>
              <label className="font-semibold block mb-1">Precio de Sesión ($)</label>
              <input
                type="number"
                value={rate}
                onChange={(e) => setRate(e.target.value)}
                className="w-full px-3 py-2 rounded-lg bg-slate-50 dark:bg-slate-800 border border-slate-200 dark:border-slate-700 outline-none"
              />
            </div>
            <div>
              <label className="font-semibold block mb-1">Estado de la Reserva</label>
              <select
                value={status}
                onChange={(e) => setStatus(e.target.value)}
                className="w-full px-3 py-2 rounded-lg bg-slate-50 dark:bg-slate-800 border border-slate-200 dark:border-slate-700 outline-none"
              >
                <option value="Confirmada">Confirmada</option>
                <option value="Pendiente">Pendiente</option>
                <option value="Completada">Completada</option>
                <option value="Reprogramada">Reprogramada</option>
              </select>
            </div>
            <div>
              <label className="font-semibold block mb-1">Estado del Cobro / Modalidad</label>
              <select
                value={paymentStatus}
                onChange={(e) => {
                  const val = e.target.value;
                  setPaymentStatus(val);
                  if (val === 'Cortesía' || val === 'Gratis' || val === 'Reposición') {
                    setRate(0);
                  }
                }}
                style={{ color: '#000000', backgroundColor: '#ffffff' }}
                className="w-full px-3 py-2 rounded-lg bg-white border border-slate-300 outline-none font-bold text-black"
              >
                <option value="Pendiente" style={{ color: '#000000', backgroundColor: '#ffffff' }}>Pendiente (Por cobrar)</option>
                <option value="Pagado" style={{ color: '#000000', backgroundColor: '#ffffff' }}>Pagado</option>
                <option value="Vencido" style={{ color: '#000000', backgroundColor: '#ffffff' }}>Vencido</option>
                <option value="Cortesía" style={{ color: '#000000', backgroundColor: '#ffffff' }}>🎁 Clase de Cortesía ($0)</option>
                <option value="Gratis" style={{ color: '#000000', backgroundColor: '#ffffff' }}>⭐ Clase Gratis ($0)</option>
                <option value="Reposición" style={{ color: '#000000', backgroundColor: '#ffffff' }}>🔄 Clase de Reposición ($0)</option>
              </select>
            </div>
          </div>

          <div className="flex justify-end gap-2 pt-2">
            <button type="button" onClick={onCancel} className="px-4 py-2 rounded-lg bg-slate-100 dark:bg-slate-800 font-semibold">Cancelar</button>
            <button type="submit" className="px-4 py-2 rounded-lg bg-accent hover:bg-accent-dark text-white font-bold">Guardar Reserva</button>
          </div>
        </form>
      );
    }

    function PaymentForm({ item, students, onSave, onCancel }) {
      const [studentId, setStudentId] = useState(item ? item.studentId : (students[0]?.id || ''));
      const [studentName, setStudentName] = useState(item ? item.studentName : (students[0]?.name || ''));
      const [amount, setAmount] = useState(item ? item.amount : 75);
      const [date, setDate] = useState(item ? item.date : new Date().toISOString().slice(0, 10));
      const [dueDate, setDueDate] = useState(item ? item.dueDate : new Date(Date.now() + 5*86400000).toISOString().slice(0, 10));
      const [method, setMethod] = useState(item ? item.method : 'Bizum');
      const [status, setStatus] = useState(item ? item.status : 'Pendiente');
      const [notes, setNotes] = useState(item ? item.notes : '');

      const handleStudentSelect = (e) => {
        const sid = e.target.value;
        setStudentId(sid);
        const s = students.find(x => x.id === sid);
        if (s) setStudentName(s.name);
      };

      const handleSubmit = (e) => {
        e.preventDefault();
        const finalName = studentName.trim() || (students.find(s => s.id === studentId)?.name) || 'Alumno';
        onSave({
          id: item?.id,
          invoiceNum: item?.invoiceNum,
          studentId: studentId || ('s-' + Date.now()),
          studentName: finalName,
          amount: Number(amount),
          date,
          dueDate,
          method,
          status,
          notes
        });
      };

      return (
        <form onSubmit={handleSubmit} className="space-y-4 text-xs">
          <div className="grid grid-cols-2 gap-3">
            <div>
              <label className="font-semibold block mb-1">Alumno *</label>
              {students.length > 0 ? (
                <select
                  value={studentId}
                  onChange={handleStudentSelect}
                  className="w-full px-3 py-2 rounded-lg bg-slate-50 dark:bg-slate-800 border border-slate-200 dark:border-slate-700 outline-none"
                >
                  {students.map(s => <option key={s.id} value={s.id}>{s.name}</option>)}
                </select>
              ) : (
                <input
                  type="text"
                  value={studentName}
                  onChange={(e) => setStudentName(e.target.value)}
                  placeholder="Nombre del alumno"
                  className="w-full px-3 py-2 rounded-lg bg-slate-50 dark:bg-slate-800 border border-slate-200 dark:border-slate-700 outline-none"
                  required
                />
              )}
            </div>
            <div>
              <label className="font-semibold block mb-1">Importe ($) *</label>
              <input
                type="number"
                value={amount}
                onChange={(e) => setAmount(e.target.value)}
                className="w-full px-3 py-2 rounded-lg bg-slate-50 dark:bg-slate-800 border border-slate-200 dark:border-slate-700 outline-none"
                required
              />
            </div>
          </div>

          <div className="grid grid-cols-2 gap-3">
            <div>
              <label className="font-semibold block mb-1">Fecha de Emisión</label>
              <input
                type="date"
                value={date}
                onChange={(e) => setDate(e.target.value)}
                className="w-full px-3 py-2 rounded-lg bg-slate-50 dark:bg-slate-800 border border-slate-200 dark:border-slate-700 outline-none"
              />
            </div>
            <div>
              <label className="font-semibold block mb-1">Fecha Límite de Pago</label>
              <input
                type="date"
                value={dueDate}
                onChange={(e) => setDueDate(e.target.value)}
                className="w-full px-3 py-2 rounded-lg bg-slate-50 dark:bg-slate-800 border border-slate-200 dark:border-slate-700 outline-none"
              />
            </div>
          </div>

          <div className="grid grid-cols-2 gap-3">
            <div>
              <label className="font-semibold block mb-1">Método de Pago</label>
              <select
                value={method}
                onChange={(e) => setMethod(e.target.value)}
                className="w-full px-3 py-2 rounded-lg bg-slate-50 dark:bg-slate-800 border border-slate-200 dark:border-slate-700 outline-none"
              >
                {['Bizum', 'Transferencia', 'Tarjeta / Stripe', 'Efectivo', 'PayPal'].map(m => <option key={m} value={m}>{m}</option>)}
              </select>
            </div>
            <div>
              <label className="font-semibold block mb-1">Estado de la Factura</label>
              <select
                value={status}
                onChange={(e) => setStatus(e.target.value)}
                className="w-full px-3 py-2 rounded-lg bg-slate-50 dark:bg-slate-800 border border-slate-200 dark:border-slate-700 outline-none"
              >
                <option value="Pendiente">Pendiente</option>
                <option value="Pagado">Pagado</option>
                <option value="Vencido">Vencido</option>
              </select>
            </div>
          </div>

          <div>
            <label className="font-semibold block mb-1">Concepto / Notas</label>
            <input
              type="text"
              value={notes}
              onChange={(e) => setNotes(e.target.value)}
              placeholder="p. ej., Clases particulares del mes"
              className="w-full px-3 py-2 rounded-lg bg-slate-50 dark:bg-slate-800 border border-slate-200 dark:border-slate-700 outline-none"
            />
          </div>

          <div className="flex justify-end gap-2 pt-2">
            <button type="button" onClick={onCancel} className="px-4 py-2 rounded-lg bg-slate-100 dark:bg-slate-800 font-semibold">Cancelar</button>
            <button type="submit" className="px-4 py-2 rounded-lg bg-accent hover:bg-accent-dark text-white font-bold">Guardar Factura</button>
          </div>
        </form>
      );
    }

    // Renderizar la aplicación React
    const root = ReactDOM.createRoot(document.getElementById('root'));
    root.render(
      <ErrorBoundary>
        <App />
      </ErrorBoundary>
    );
  </script>
</body>
</html>
