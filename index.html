    // PESTAÑA 2: TAREAS Y PREPARACIÓN
    // ----------------------------------------------------
    function TasksView({ tasks, searchQuery, onOpenModal, onToggleTask, onDeleteTask }) {
      const [filterCategory, setFilterCategory] = useState('Todas');
      const [filterPriority, setFilterPriority] = useState('Todas');
      const [filterStatus, setFilterStatus] = useState('Todas');

      const categories = ['Todas', 'Preparación', 'Calificaciones', 'Administración', 'Seguimiento', 'Currículo', 'Personal'];
      const priorities = ['Todas', 'Urgente', 'Alta', 'Media', 'Baja'];
      const statuses = [
        { id: 'Todas', label: 'Todas' },
        { id: 'pendiente', label: 'Pendientes' },
        { id: 'en_progreso', label: 'En Progreso' },
        { id: 'completada', label: 'Completadas' }
      ];

      const filteredTasks = useMemo(() => {
        return tasks.filter(t => {
          if (filterCategory !== 'Todas' && t.category !== filterCategory) return false;
          if (filterPriority !== 'Todas' && t.priority !== filterPriority) return false;
          if (filterStatus !== 'Todas' && t.status !== filterStatus) return false;
          if (searchQuery) {
            const q = searchQuery.toLowerCase();
            return t.title.toLowerCase().includes(q) || (t.notes && t.notes.toLowerCase().includes(q));
          }
          return true;
        });
      }, [tasks, filterCategory, filterPriority, filterStatus, searchQuery]);

      const completedCount = tasks.filter(t => t.status === 'completada').length;
      const progressPercent = tasks.length > 0 ? Math.round((completedCount / tasks.length) * 100) : 0;

      return (
        <div className="space-y-6">
          {/* Cabecera */}
          <div className="flex flex-col sm:flex-row sm:items-center justify-between gap-4">
            <div>
              <h2 className="text-xl sm:text-2xl font-bold text-slate-900 dark:text-white">
                Gestión de Tareas y Preparación de Clases
              </h2>
              <p className="text-xs sm:text-sm text-slate-500 dark:text-slate-400">
                Organiza la preparación de lecciones, correcciones, notas y tareas administrativas.
              </p>
            </div>
            <button
              onClick={() => onOpenModal({ type: 'task' })}
              className="inline-flex items-center justify-center gap-2 px-4 py-2.5 rounded-xl bg-accent hover:bg-accent-dark text-white text-xs font-bold shadow-md shadow-accent/20 transition"
            >
              <Icons.Plus /> Nueva Tarea
            </button>
          </div>

          {/* Barra de Progreso */}
          {tasks.length > 0 && (
            <div className="bg-white dark:bg-slate-900 p-4 rounded-xl border border-slate-200/80 dark:border-slate-800 shadow-sm flex flex-col sm:flex-row sm:items-center justify-between gap-4">
              <div className="flex-1">
                <div className="flex items-center justify-between text-xs font-semibold mb-1.5">
                  <span>Progreso de Tareas Completadas</span>
                  <span>{completedCount} de {tasks.length} Completadas ({progressPercent}%)</span>
                </div>
                <div className="w-full h-2.5 bg-slate-100 dark:bg-slate-800 rounded-full overflow-hidden">
                  <div
                    className="h-full bg-gradient-to-r from-accent to-emerald-500 transition-all duration-500"
                    style={{ width: `${progressPercent}%` }}
                  ></div>
                </div>
              </div>
            </div>
          )}

          {/* Filtros */}
          <div className="flex flex-wrap items-center gap-3 bg-white dark:bg-slate-900 p-3 rounded-xl border border-slate-200/80 dark:border-slate-800 text-xs">
            <div className="flex items-center gap-1.5">
              <span className="text-slate-400 font-medium">Categoría:</span>
              <select
                value={filterCategory}
                onChange={(e) => setFilterCategory(e.target.value)}
                className="px-2.5 py-1 rounded-lg bg-slate-100 dark:bg-slate-800 border-none font-medium focus:ring-2 focus:ring-accent outline-none"
              >
                {categories.map(c => <option key={c} value={c}>{c}</option>)}
              </select>
            </div>

            <div className="flex items-center gap-1.5">
              <span className="text-slate-400 font-medium">Prioridad:</span>
              <select
                value={filterPriority}
                onChange={(e) => setFilterPriority(e.target.value)}
                className="px-2.5 py-1 rounded-lg bg-slate-100 dark:bg-slate-800 border-none font-medium focus:ring-2 focus:ring-accent outline-none"
              >
                {priorities.map(p => <option key={p} value={p}>{p}</option>)}
              </select>
            </div>

            <div className="flex items-center gap-1.5">
              <span className="text-slate-400 font-medium">Estado:</span>
              <select
                value={filterStatus}
                onChange={(e) => setFilterStatus(e.target.value)}
                className="px-2.5 py-1 rounded-lg bg-slate-100 dark:bg-slate-800 border-none font-medium focus:ring-2 focus:ring-accent outline-none"
              >
                {statuses.map(s => <option key={s.id} value={s.id}>{s.label}</option>)}
              </select>
            </div>
          </div>

          {/* Lista de Tareas */}
          <div className="bg-white dark:bg-slate-900 rounded-xl border border-slate-200/80 dark:border-slate-800 shadow-sm overflow-hidden">
            {filteredTasks.length === 0 ? (
              <div className="p-12 text-center">
                <Icons.EmptyBox />
                <p className="text-sm font-semibold text-slate-700 dark:text-slate-300">No hay tareas pendientes</p>
                <p className="text-xs text-slate-500 mt-1 mb-4">Empieza organizando tu semana y planificando tus próximas lecciones.</p>
                <button
                  onClick={() => onOpenModal({ type: 'task' })}
                  className="inline-flex items-center gap-1.5 px-4 py-2 rounded-xl bg-accent hover:bg-accent-dark text-white text-xs font-bold transition shadow-sm"
                >
                  <Icons.Plus /> Crear mi primera tarea
                </button>
              </div>
            ) : (
              <div className="divide-y divide-slate-100 dark:divide-slate-800">
                {filteredTasks.map(task => {
                  const isCompleted = task.status === 'completada';
                  return (
                    <div
                      key={task.id}
                      className={`p-4 flex items-start justify-between gap-4 transition ${
                        isCompleted ? 'bg-slate-50/50 dark:bg-slate-900/40 opacity-70' : 'hover:bg-slate-50/70 dark:hover:bg-slate-800/40'
                      }`}
                    >
                      <div className="flex items-start gap-3.5 flex-1 min-w-0">
                        <button
                          onClick={() => onToggleTask(task.id)}
                          className={`mt-1 w-5 h-5 rounded-md border flex items-center justify-center transition shrink-0 ${
                            isCompleted
                              ? 'bg-emerald-500 border-emerald-500 text-white'
                              : 'border-slate-300 dark:border-slate-600 hover:border-accent'
                          }`}
                        >
                          {isCompleted && <Icons.Check />}
                        </button>
                        <div className="flex-1 min-w-0">
                          <div className="flex items-center gap-2 flex-wrap">
                            <h4 className={`text-sm font-semibold text-slate-900 dark:text-white ${isCompleted ? 'line-through text-slate-400 dark:text-slate-500' : ''}`}>
                              {task.title}
                            </h4>
                            <span className="text-[10px] font-bold px-2 py-0.5 rounded-full bg-slate-100 dark:bg-slate-800 text-slate-600 dark:text-slate-300">
                              {task.category}
                            </span>
                            <span className={`text-[10px] font-bold px-2 py-0.5 rounded-full ${
                              task.priority === 'Urgente'
                                ? 'bg-rose-100 text-rose-700 dark:bg-rose-950 dark:text-rose-300'
                                : task.priority === 'Alta'
                                ? 'bg-amber-100 text-amber-700 dark:bg-amber-950 dark:text-amber-300'
                                : task.priority === 'Media'
                                ? 'bg-blue-100 text-blue-700 dark:bg-blue-950 dark:text-blue-300'
                                : 'bg-slate-100 text-slate-600 dark:bg-slate-800 dark:text-slate-400'
                            }`}>
                              {task.priority}
                            </span>
                          </div>
                          {task.notes && (
                            <p className="text-xs text-slate-500 dark:text-slate-400 mt-1">
                              {task.notes}
                            </p>
                          )}
                          <div className="flex flex-wrap items-center gap-4 text-[11px] text-slate-400 mt-2">
                            <span className="flex items-center gap-1">
                              <Icons.Calendar /> Fecha: {task.dueDate || 'Sin fecha'}
                            </span>
                            {task.time && (
                              <span className="flex items-center gap-1 font-bold text-accent dark:text-accent-light">
                                <Icons.Clock /> Hora: {task.time}
                              </span>
                            )}
                            <span>Estado: <strong className="capitalize text-slate-600 dark:text-slate-300">{task.status.replace('_', ' ')}</strong></span>
                          </div>
                        </div>
                      </div>

                      <div className="flex items-center gap-2 shrink-0">
                        <button
                          onClick={() => onOpenModal({ type: 'task', item: task })}
                          className="px-2.5 py-1 text-xs font-semibold rounded-lg bg-slate-100 dark:bg-slate-800 hover:bg-slate-200 dark:hover:bg-slate-700 text-slate-700 dark:text-slate-200 transition"
                        >
                          Editar
                        </button>
                        <button
                          onClick={() => onDeleteTask(task.id)}
                          className="p-1.5 text-slate-400 hover:text-rose-600 transition"
                          title="Eliminar tarea"
                        >
                          <Icons.Trash />
                        </button>
                      </div>
                    </div>
                  );
                })}
              </div>
            )}
          </div>
        </div>
      );
    }

    // ----------------------------------------------------
    // PESTAÑA 3: CLASES Y HORARIOS
    // ----------------------------------------------------
    function ClassesView({ classes, students, searchQuery, onOpenModal, onDeleteClass }) {
      const studentMap = useMemo(() => {
        return new Map(students.map(s => [s.id, s.name]));
      }, [students]);

      const filteredClasses = useMemo(() => {
        return classes.filter(c => {
          if (!searchQuery) return true;
          const q = searchQuery.toLowerCase();
          return c.name.toLowerCase().includes(q) || c.subject.toLowerCase().includes(q) || (c.description && c.description.toLowerCase().includes(q));
        });
      }, [classes, searchQuery]);

      return (
        <div className="space-y-6">
          <div className="flex flex-col sm:flex-row sm:items-center justify-between gap-4">
            <div>
              <h2 className="text-xl sm:text-2xl font-bold text-slate-900 dark:text-white">
                Horario de Clases y Oferta Académica
              </h2>
              <p className="text-xs sm:text-sm text-slate-500 dark:text-slate-400">
                Administra talleres en grupo, clases regulares, alumnos inscritos y enlaces de reunión.
              </p>
            </div>
            <button
              onClick={() => onOpenModal({ type: 'class' })}
              className="inline-flex items-center justify-center gap-2 px-4 py-2.5 rounded-xl bg-accent hover:bg-accent-dark text-white text-xs font-bold shadow-md shadow-accent/20 transition"
            >
              <Icons.Plus /> Programar Nueva Clase
            </button>
          </div>

          {filteredClasses.length === 0 ? (
            <div className="bg-white dark:bg-slate-900 rounded-xl p-12 text-center border border-slate-200/80 dark:border-slate-800 shadow-sm">
              <Icons.EmptyBox />
              <h3 className="text-sm font-semibold text-slate-700 dark:text-slate-300">No hay clases programadas</h3>
              <p className="text-xs text-slate-500 mt-1 mb-4">Configura tus asignaturas, días y horarios de clase habituales.</p>
              <button
                onClick={() => onOpenModal({ type: 'class' })}
                className="inline-flex items-center gap-1.5 px-4 py-2 rounded-xl bg-accent hover:bg-accent-dark text-white text-xs font-bold transition shadow-sm"
              >
                <Icons.Plus /> Añadir mi primera clase
              </button>
            </div>
          ) : (
            <div className="grid grid-cols-1 md:grid-cols-2 gap-5">
              {filteredClasses.map(cls => {
                const enrolledCount = (cls.enrolledStudentIds || []).length;
                return (
                  <div
                    key={cls.id}
                    className="bg-white dark:bg-slate-900 rounded-xl p-5 border border-slate-200/80 dark:border-slate-800 shadow-sm flex flex-col justify-between"
                  >
                    <div className="space-y-3">
                      <div className="flex items-start justify-between gap-2">
                        <span className="text-xs font-bold px-2.5 py-0.5 rounded-md bg-accent/10 text-accent-dark dark:bg-accent/20 dark:text-accent-light border border-accent/20 dark:border-accent/30">
                          {cls.subject}
                        </span>
                        <div className="flex items-center gap-1.5">
                          <span className="text-xs font-semibold px-2 py-0.5 rounded bg-slate-100 dark:bg-slate-800 text-slate-600 dark:text-slate-300">
                            {cls.status}
                          </span>
                          <button
                            onClick={() => onOpenModal({ type: 'class', item: cls })}
                            className="text-xs text-slate-400 hover:text-slate-700 dark:hover:text-slate-200 p-1"
                            title="Editar"
                          >
                            ✎
                          </button>
                          <button
                            onClick={() => onDeleteClass(cls.id)}
                            className="text-xs text-slate-400 hover:text-rose-500 p-1"
                            title="Eliminar"
                          >
                            <Icons.Trash />
                          </button>
                        </div>
                      </div>

                      <div>
                        <h3 className="text-base font-bold text-slate-900 dark:text-white">
                          {cls.name}
                        </h3>
                        <p className="text-xs text-slate-500 dark:text-slate-400 mt-1">
                          {cls.description}
                        </p>
                      </div>

                      <div className="grid grid-cols-2 gap-2 text-xs text-slate-600 dark:text-slate-300 pt-2 border-t border-slate-100 dark:border-slate-800">
                        <div className="flex items-center gap-1.5">
                          <Icons.Calendar />
                          <span>{cls.dayOfWeek}</span>
                        </div>
                        <div className="flex items-center gap-1.5">
                          <Icons.Clock />
                          <span>{cls.time} ({cls.durationMinutes} min)</span>
                        </div>
                      </div>

                      <div className="pt-2">
                        <div className="text-[11px] font-semibold text-slate-400 mb-1.5 flex justify-between">
                          <span>Alumnos Inscritos</span>
                          <span>{enrolledCount} / {cls.capacity} cupos</span>
                        </div>
                        <div className="flex flex-wrap gap-1.5">
                          {enrolledCount === 0 ? (
                            <span className="text-[11px] text-slate-400 italic">Sin alumnos inscritos</span>
                          ) : (
                            (cls.enrolledStudentIds || []).map(sid => (
                              <span key={sid} className="text-[11px] px-2 py-0.5 rounded-full bg-slate-100 dark:bg-slate-800 text-slate-700 dark:text-slate-300 font-medium">
                                {studentMap.get(sid) || sid}
                              </span>
                            ))
                          )}
                        </div>
                      </div>
                    </div>

                    <div className="mt-5 pt-3 border-t border-slate-100 dark:border-slate-800 flex items-center justify-between">
                      <span className="text-xs text-slate-400">Modalidad: Regular</span>
                      {cls.location && (
                        <a
                          href={cls.location}
                          target="_blank"
                          rel="noreferrer"
                          className="inline-flex items-center gap-1 px-3 py-1.5 rounded-lg text-xs font-semibold bg-accent hover:bg-accent-dark text-white transition shadow-sm"
                        >
                          Unirse a Clase <Icons.ExternalLink />
                        </a>
                      )}
                    </div>
                  </div>
                );
              })}
            </div>
          )}
        </div>
      );
    }

    // ----------------------------------------------------
    // PESTAÑA 4: ESTUDIANTES Y RESERVAS
    // ----------------------------------------------------
    function StudentsView({ students, bookings, classes, searchQuery, onOpenModal, onDeleteStudent, onDeleteBooking, onExportCsv }) {
      const [activeSubTab, setActiveSubTab] = useState('roster');

      const filteredStudents = useMemo(() => {
        return students.filter(s => {
          if (!searchQuery) return true;
          const q = searchQuery.toLowerCase();
          return s.name.toLowerCase().includes(q) || (s.email && s.email.toLowerCase().includes(q)) || (s.notes && s.notes.toLowerCase().includes(q));
        });
      }, [students, searchQuery]);

      const filteredBookings = useMemo(() => {
        return bookings.filter(b => {
          if (!searchQuery) return true;
          const q = searchQuery.toLowerCase();
          return b.studentName.toLowerCase().includes(q) || (b.className && b.className.toLowerCase().includes(q));
        });
      }, [bookings, searchQuery]);

      return (
        <div className="space-y-6">
          <div className="flex flex-col sm:flex-row sm:items-center justify-between gap-4">
            <div>
              <h2 className="text-xl sm:text-2xl font-bold text-slate-900 dark:text-white">
                Estudiantes y Sesiones de Clase
              </h2>
              <p className="text-xs sm:text-sm text-slate-500 dark:text-slate-400">
                Directorio de alumnos, tarifas por hora, registro de sesiones individuales y asistencia.
              </p>
            </div>
            <div className="flex items-center gap-2">
              <button
                onClick={() => onExportCsv(activeSubTab === 'roster' ? 'alumnos' : 'reservas')}
                className="inline-flex items-center gap-1.5 px-3 py-2 rounded-xl bg-slate-100 dark:bg-slate-800 hover:bg-slate-200 dark:hover:bg-slate-700 text-xs font-semibold text-slate-700 dark:text-slate-200 transition"
              >
                <Icons.Download /> Exportar CSV
              </button>
              {activeSubTab === 'roster' ? (
                <button
                  onClick={() => onOpenModal({ type: 'student' })}
                  className="inline-flex items-center gap-2 px-4 py-2 rounded-xl bg-accent hover:bg-accent-dark text-white text-xs font-bold shadow-md shadow-accent/20 transition"
                >
                  <Icons.Plus /> Nuevo Alumno
                </button>
              ) : (
                <button
                  onClick={() => onOpenModal({ type: 'booking' })}
                  className="inline-flex items-center gap-2 px-4 py-2 rounded-xl bg-accent hover:bg-accent-dark text-white text-xs font-bold shadow-md shadow-accent/20 transition"
                >
                  <Icons.Plus /> Reservar Sesión
                </button>
              )}
            </div>
          </div>

          {/* Subpestañas */}
          <div className="flex border-b border-slate-200 dark:border-slate-800 space-x-6">
            <button
              onClick={() => setActiveSubTab('roster')}
              className={`pb-3 text-sm font-bold border-b-2 transition ${
                activeSubTab === 'roster'
                  ? 'border-accent text-accent dark:border-accent-light dark:text-accent-light'
                  : 'border-transparent text-slate-400 hover:text-slate-700 dark:hover:text-slate-200'
              }`}
            >
              Directorio de Alumnos ({students.length})
            </button>
            <button
              onClick={() => setActiveSubTab('bookings')}
              className={`pb-3 text-sm font-bold border-b-2 transition ${
                activeSubTab === 'bookings'
                  ? 'border-accent text-accent dark:border-accent-light dark:text-accent-light'
                  : 'border-transparent text-slate-400 hover:text-slate-700 dark:hover:text-slate-200'
              }`}
            >
              Registro de Sesiones ({bookings.length})
            </button>
          </div>

          {/* Subpestaña 1: Directorio */}
          {activeSubTab === 'roster' && (
            <div>
              {filteredStudents.length === 0 ? (
                <div className="bg-white dark:bg-slate-900 rounded-xl p-12 text-center border border-slate-200/80 dark:border-slate-800 shadow-sm">
                  <Icons.EmptyBox />
                  <h3 className="text-sm font-semibold text-slate-700 dark:text-slate-300">No hay alumnos registrados</h3>
                  <p className="text-xs text-slate-500 mt-1 mb-4">Añade a tus alumnos para registrar sus tarifas, datos de contacto y progreso.</p>
                  <button
                    onClick={() => onOpenModal({ type: 'student' })}
                    className="inline-flex items-center gap-1.5 px-4 py-2 rounded-xl bg-accent hover:bg-accent-dark text-white text-xs font-bold transition shadow-sm"
                  >
                    <Icons.Plus /> Registrar mi primer alumno
                  </button>
                </div>
              ) : (
                <div className="grid grid-cols-1 md:grid-cols-2 lg:grid-cols-3 gap-4">
                  {filteredStudents.map(student => (
                    <div
                      key={student.id}
                      className="bg-white dark:bg-slate-900 rounded-xl p-5 border border-slate-200/80 dark:border-slate-800 shadow-sm flex flex-col justify-between"
                    >
                      <div>
                        <div className="flex items-start justify-between">
                          <div>
                            <h3 className="font-bold text-base text-slate-900 dark:text-white">
                              {student.name}
                            </h3>
                            <span className={`text-[10px] font-bold px-2 py-0.5 rounded-full inline-block mt-1 ${
                              student.status === 'Activo'
                                ? 'bg-emerald-100 text-emerald-800 dark:bg-emerald-950 dark:text-emerald-300'
                                : 'bg-slate-100 text-slate-600 dark:bg-slate-800 dark:text-slate-400'
                            }`}>
                              {student.status}
                            </span>
                          </div>
                          <div className="text-right">
                            <span className="text-sm font-extrabold text-accent dark:text-accent-light">
                              ${student.hourlyRate}/h
                            </span>
                          </div>
                        </div>

                        <div className="mt-4 space-y-1 text-xs text-slate-500 dark:text-slate-400">
                          {student.email && <p>📧 {student.email}</p>}
                          {student.phone && <p>📱 {student.phone}</p>}
                        </div>

                        {student.notes && (
                          <div className="mt-3 p-2.5 rounded-lg bg-slate-50 dark:bg-slate-800/60 text-xs text-slate-600 dark:text-slate-300 italic">
                            "{student.notes}"
                          </div>
                        )}
                      </div>

                      <div className="mt-5 pt-3 border-t border-slate-100 dark:border-slate-800 flex items-center justify-between">
                        <div>
                          {student.balanceDue > 0 ? (
                            <span className="text-xs font-bold text-rose-500">Saldo: ${student.balanceDue}</span>
                          ) : (
                            <span className="text-xs font-bold text-emerald-500">Sin saldo pendiente</span>
                          )}
                        </div>
                        <div className="flex items-center gap-1.5">
                          <button
                            onClick={() => onOpenModal({ type: 'student', item: student })}
                            className="px-2.5 py-1 rounded-lg text-xs font-semibold bg-slate-100 dark:bg-slate-800 hover:bg-slate-200 dark:hover:bg-slate-700 text-slate-700 dark:text-slate-200 transition"
                          >
                            Editar
                          </button>
                          <button
                            onClick={() => onDeleteStudent(student.id)}
                            className="p-1.5 text-slate-400 hover:text-rose-500 transition"
                          >
                            <Icons.Trash />
                          </button>
                        </div>
                      </div>
                    </div>
                  ))}
                </div>
              )}
            </div>
          )}

          {/* Subpestaña 2: Registro de Reservas */}
          {activeSubTab === 'bookings' && (
            <div className="bg-white dark:bg-slate-900 rounded-xl border border-slate-200/80 dark:border-slate-800 shadow-sm overflow-x-auto">
              {filteredBookings.length === 0 ? (
                <div className="p-12 text-center">
                  <Icons.EmptyBox />
                  <h3 className="text-sm font-semibold text-slate-700 dark:text-slate-300">No hay reservas registradas</h3>
                  <p className="text-xs text-slate-500 mt-1 mb-4">Agenda sesiones individuales de tutoría o clases prácticas.</p>
                  <button
                    onClick={() => onOpenModal({ type: 'booking' })}
                    className="inline-flex items-center gap-1.5 px-4 py-2 rounded-xl bg-accent hover:bg-accent-dark text-white text-xs font-bold transition shadow-sm"
                  >
                    <Icons.Plus /> Registrar primera reserva
                  </button>
                </div>
              ) : (
                <table className="w-full text-left text-xs">
                  <thead className="bg-slate-50 dark:bg-slate-800/60 border-b border-slate-200/80 dark:border-slate-800 text-slate-500 uppercase font-semibold">
                    <tr>
                      <th className="p-3.5">Alumno</th>
                      <th className="p-3.5">Sesión / Clase</th>
                      <th className="p-3.5">Fecha y Hora</th>
                      <th className="p-3.5">Duración</th>
                      <th className="p-3.5">Tarifa</th>
                      <th className="p-3.5">Estado Reserva</th>
                      <th className="p-3.5">Estado Pago</th>
                      <th className="p-3.5 text-right">Acciones</th>
                    </tr>
                  </thead>
                  <tbody className="divide-y divide-slate-100 dark:divide-slate-800">
                    {filteredBookings.map(b => (
                      <tr key={b.id} className="hover:bg-slate-50/70 dark:hover:bg-slate-800/40 transition">
                        <td className="p-3.5 font-bold text-slate-900 dark:text-white">{b.studentName}</td>
                        <td className="p-3.5 text-slate-600 dark:text-slate-300">{b.className}</td>
                        <td className="p-3.5 text-slate-500">{b.date} a las {b.time}</td>
                        <td className="p-3.5 text-slate-500">{b.duration} min</td>
                        <td className="p-3.5 font-bold text-slate-800 dark:text-slate-200">${b.rate}</td>
                        <td className="p-3.5">
                          <span className={`text-[10px] font-bold px-2 py-0.5 rounded-full ${
                            b.status === 'Confirmada' ? 'bg-accent/10 text-accent-dark dark:bg-accent/20 dark:text-accent-light' :
                            b.status === 'Completada' ? 'bg-emerald-100 text-emerald-700 dark:bg-emerald-950 dark:text-emerald-300' :
                            'bg-amber-100 text-amber-700 dark:bg-amber-950 dark:text-amber-300'
                          }`}>
                            {b.status}
                          </span>
                        </td>
                        <td className="p-3.5">
                          <span className={`text-[10px] font-bold px-2 py-0.5 rounded-full ${
                            b.paymentStatus === 'Pagado' ? 'bg-emerald-100 text-emerald-700 dark:bg-emerald-950 dark:text-emerald-300' :
                            b.paymentStatus === 'Vencido' ? 'bg-rose-100 text-rose-700 dark:bg-rose-950 dark:text-rose-300' :
                            'bg-amber-100 text-amber-700 dark:bg-amber-950 dark:text-amber-300'
                          }`}>
                            {b.paymentStatus}
                          </span>
                        </td>
                        <td className="p-3.5 text-right space-x-1.5">
                          <button
                            onClick={() => onOpenModal({ type: 'booking', item: b })}
                            className="text-xs text-accent dark:text-accent-light hover:underline font-semibold"
                          >
                            Editar
                          </button>
                          <button
                            onClick={() => onDeleteBooking(b.id)}
                            className="text-xs text-slate-400 hover:text-rose-500 p-1"
                          >
                            <Icons.Trash />
                          </button>
                        </td>
                      </tr>
                    ))}
                  </tbody>
                </table>
              )}
            </div>
          )}
        </div>
      );
    }

    // ----------------------------------------------------
    // PESTAÑA 5: PAGOS Y FACTURACIÓN
    // ----------------------------------------------------
    function PaymentsView({ payments, students, searchQuery, onOpenModal, onMarkPaid, onDeletePayment, onCleanDuplicates, onExportCsv }) {
      const [filterStatus, setFilterStatus] = useState('Todos');

      const filteredPayments = useMemo(() => {
        return payments.filter(p => {
          if (filterStatus !== 'Todos' && p.status !== filterStatus) return false;
          if (searchQuery) {
            const q = searchQuery.toLowerCase();
            return p.studentName.toLowerCase().includes(q) || p.invoiceNum.toLowerCase().includes(q) || (p.notes && p.notes.toLowerCase().includes(q));
          }
          return true;
        });
      }, [payments, filterStatus, searchQuery]);

      const totalPaid = payments.filter(p => p.status === 'Pagado').reduce((a, b) => a + Number(b.amount), 0);
      const totalPending = payments.filter(p => p.status === 'Pendiente').reduce((a, b) => a + Number(b.amount), 0);
      const totalOverdue = payments.filter(p => p.status === 'Vencido').reduce((a, b) => a + Number(b.amount), 0);

      return (
        <div className="space-y-6">
          <div className="flex flex-col sm:flex-row sm:items-center justify-between gap-4">
            <div>
              <h2 className="text-xl sm:text-2xl font-bold text-slate-900 dark:text-white">
                Pagos y Facturación
              </h2>
              <p className="text-xs sm:text-sm text-slate-500 dark:text-slate-400">
                Control de cobros de matrícula, emisión de recibos y exportación para contabilidad.
              </p>
            </div>
            <div className="flex flex-wrap items-center gap-2">
              <button
                onClick={onCleanDuplicates}
                title="Eliminar facturas que tengan el mismo alumno, monto y concepto"
                className="inline-flex items-center gap-1.5 px-3 py-2 rounded-xl bg-amber-50 dark:bg-amber-950/40 hover:bg-amber-100 dark:hover:bg-amber-900/60 text-xs font-semibold text-amber-800 dark:text-amber-300 border border-amber-200/80 dark:border-amber-800/60 transition"
              >
                <Icons.Refresh /> Limpiar Duplicados
              </button>
              <button
                onClick={() => onExportCsv('pagos')}
                className="inline-flex items-center gap-1.5 px-3 py-2 rounded-xl bg-slate-100 dark:bg-slate-800 hover:bg-slate-200 dark:hover:bg-slate-700 text-xs font-semibold text-slate-700 dark:text-slate-200 transition"
              >
                <Icons.Download /> Exportar CSV
              </button>
              <button
                onClick={() => onOpenModal({ type: 'payment' })}
                className="inline-flex items-center gap-2 px-4 py-2 rounded-xl bg-accent hover:bg-accent-dark text-white text-xs font-bold shadow-md shadow-accent/20 transition"
              >
                <Icons.Plus /> Registrar Pago / Factura
              </button>
            </div>
          </div>

          {/* Tarjetas de Resumen Financiero */}
          <div className="grid grid-cols-1 sm:grid-cols-3 gap-4">
            <div className="bg-emerald-50 dark:bg-emerald-950/40 border border-emerald-200/80 dark:border-emerald-800/60 p-4 rounded-xl">
              <div className="text-xs font-bold text-emerald-800 dark:text-emerald-300">Total Cobrado</div>
              <div className="text-2xl font-extrabold text-emerald-700 dark:text-emerald-400 mt-1">${totalPaid.toLocaleString()}</div>
              <div className="text-[11px] text-emerald-600 dark:text-emerald-500 mt-0.5">Ingresos liquidados</div>
            </div>

            <div className="bg-amber-50 dark:bg-amber-950/40 border border-amber-200/80 dark:border-amber-800/60 p-4 rounded-xl">
              <div className="text-xs font-bold text-amber-800 dark:text-amber-300">Facturas Pendientes</div>
              <div className="text-2xl font-extrabold text-amber-700 dark:text-amber-400 mt-1">${totalPending.toLocaleString()}</div>
              <div className="text-[11px] text-amber-600 dark:text-amber-500 mt-0.5">Pendiente de cobro</div>
            </div>

            <div className="bg-rose-50 dark:bg-rose-950/40 border border-rose-200/80 dark:border-rose-800/60 p-4 rounded-xl">
              <div className="text-xs font-bold text-rose-800 dark:text-rose-300">Facturas Vencidas</div>
              <div className="text-2xl font-extrabold text-rose-700 dark:text-rose-400 mt-1">${totalOverdue.toLocaleString()}</div>
              <div className="text-[11px] text-rose-600 dark:text-rose-500 mt-0.5">Requiere recordatorio de pago</div>
            </div>
          </div>

          {/* Filtro de Estado */}
          <div className="flex items-center gap-2 bg-white dark:bg-slate-900 p-2.5 rounded-xl border border-slate-200/80 dark:border-slate-800 text-xs">
            <span className="text-slate-400 font-semibold px-1">Filtrar Estado:</span>
            {['Todos', 'Pagado', 'Pendiente', 'Vencido'].map(st => (
              <button
                key={st}
                onClick={() => setFilterStatus(st)}
                className={`px-3 py-1 rounded-lg font-semibold transition ${
                  filterStatus === st
                    ? 'bg-accent text-white'
                    : 'text-slate-600 dark:text-slate-300 hover:bg-slate-100 dark:hover:bg-slate-800'
                }`}
              >
                {st}
              </button>
            ))}
          </div>

          {/* Tabla de Facturación */}
          <div className="bg-white dark:bg-slate-900 rounded-xl border border-slate-200/80 dark:border-slate-800 shadow-sm overflow-x-auto">
            {filteredPayments.length === 0 ? (
              <div className="p-12 text-center">
                <Icons.EmptyBox />
                <h3 className="text-sm font-semibold text-slate-700 dark:text-slate-300">No hay pagos ni facturas</h3>
                <p className="text-xs text-slate-500 mt-1 mb-4">Emite tus primeras facturas o anota cobros recibidos por Bizum, transferencia o efectivo.</p>
                <button
                  onClick={() => onOpenModal({ type: 'payment' })}
                  className="inline-flex items-center gap-1.5 px-4 py-2 rounded-xl bg-emerald-600 hover:bg-emerald-700 text-white text-xs font-bold transition shadow-sm"
                >
                  <Icons.Plus /> Registrar primera factura
                </button>
              </div>
            ) : (
              <table className="w-full text-left text-xs">
                <thead className="bg-slate-50 dark:bg-slate-800/60 border-b border-slate-200/80 dark:border-slate-800 text-slate-500 uppercase font-semibold">
                  <tr>
                    <th className="p-3.5">Nº Factura</th>
                    <th className="p-3.5">Alumno</th>
                    <th className="p-3.5">Importe</th>
                    <th className="p-3.5">Fecha Emisión</th>
                    <th className="p-3.5">Fecha Límite</th>
                    <th className="p-3.5">Método</th>
                    <th className="p-3.5">Estado</th>
                    <th className="p-3.5">Concepto</th>
                    <th className="p-3.5 text-right">Acciones</th>
                  </tr>
                </thead>
                <tbody className="divide-y divide-slate-100 dark:divide-slate-800">
                  {filteredPayments.map(p => (
                    <tr key={p.id} className="hover:bg-slate-50/70 dark:hover:bg-slate-800/40 transition">
                      <td className="p-3.5 font-mono font-bold text-slate-900 dark:text-white">{p.invoiceNum}</td>
                      <td className="p-3.5 font-bold text-slate-800 dark:text-slate-200">{p.studentName}</td>
                      <td className="p-3.5 font-extrabold text-slate-900 dark:text-white">${p.amount}</td>
                      <td className="p-3.5 text-slate-500">{p.date}</td>
                      <td className="p-3.5 text-slate-500">{p.dueDate || '—'}</td>
                      <td className="p-3.5 font-medium text-slate-600 dark:text-slate-300">{p.method}</td>
                      <td className="p-3.5">
                        <span className={`text-[10px] font-bold px-2 py-0.5 rounded-full ${
                          p.status === 'Pagado' ? 'bg-emerald-100 text-emerald-700 dark:bg-emerald-950 dark:text-emerald-300' :
                          p.status === 'Vencido' ? 'bg-rose-100 text-rose-700 dark:bg-rose-950 dark:text-rose-300' :
                          'bg-amber-100 text-amber-700 dark:bg-amber-950 dark:text-amber-300'
                        }`}>
                          {p.status}
                        </span>
                      </td>
                      <td className="p-3.5 text-slate-500 max-w-xs truncate">{p.notes || '—'}</td>
                      <td className="p-3.5 text-right space-x-2">
                        {p.status !== 'Pagado' && (
                          <button
                            onClick={() => onMarkPaid(p.id)}
                            className="px-2 py-1 bg-emerald-100 text-emerald-700 dark:bg-emerald-950 dark:text-emerald-300 rounded font-bold hover:bg-emerald-200 transition"
                          >
                            Marcar Pagado
                          </button>
                        )}
                        <button
                          onClick={() => onOpenModal({ type: 'payment', item: p })}
                          className="text-accent dark:text-accent-light hover:underline font-semibold"
                        >
                          Editar
                        </button>
                        <button
                          onClick={() => onDeletePayment(p.id)}
                          className="text-slate-400 hover:text-rose-500"
                        >
                          <Icons.Trash />
                        </button>
                      </td>
                    </tr>
                  ))}
                </tbody>
              </table>
            )}
          </div>
        </div>
      );
    }

    // ----------------------------------------------------
    // PESTAÑA 6: INFORMES Y RENDIMIENTO
    // ----------------------------------------------------
    function ReportsView({ data, kpis, onExportJson, onExportCsv }) {
      const subjectDistribution = useMemo(() => {
        const counts = {};
        data.classes.forEach(c => {
          counts[c.subject] = (counts[c.subject] || 0) + (Number(c.durationMinutes) / 60);
        });
        return Object.entries(counts);
      }, [data.classes]);

      const studentRevenue = useMemo(() => {
        const map = {};
        data.payments.forEach(p => {
          map[p.studentName] = (map[p.studentName] || 0) + Number(p.amount);
        });
        return Object.entries(map).sort((a, b) => b[1] - a[1]);
      }, [data.payments]);

      return (
        <div className="space-y-6">
          <div className="flex flex-col sm:flex-row sm:items-center justify-between gap-4">
            <div>
              <h2 className="text-xl sm:text-2xl font-bold text-slate-900 dark:text-white">
                Informes y Rendimiento Académico
              </h2>
              <p className="text-xs sm:text-sm text-slate-500 dark:text-slate-400">
                Métricas financieras consolidadas, distribución horaria y valor acumulado por alumno.
              </p>
            </div>
            <div className="flex items-center gap-2">
              <button
                onClick={onExportJson}
                className="inline-flex items-center gap-1.5 px-3 py-2 rounded-xl bg-slate-100 dark:bg-slate-800 hover:bg-slate-200 dark:hover:bg-slate-700 text-xs font-semibold text-slate-700 dark:text-slate-200 transition"
              >
                <Icons.Download /> Descargar Respaldo JSON
              </button>
              <button
                onClick={() => onExportCsv('pagos')}
                className="inline-flex items-center gap-1.5 px-3 py-2 rounded-xl bg-accent hover:bg-accent-dark text-white text-xs font-bold transition shadow-md shadow-accent/20"
              >
                <Icons.Download /> Exportar Pagos CSV
              </button>
            </div>
          </div>

          {/* Tarjetas de Métricas de Alto Nivel */}
          <div className="grid grid-cols-2 md:grid-cols-4 gap-4">
            <div className="bg-white dark:bg-slate-900 p-5 rounded-xl border border-slate-200/80 dark:border-slate-800 shadow-sm">
              <div className="text-xs text-slate-400 font-semibold">Total Facturado</div>
              <div className="text-2xl font-black text-slate-900 dark:text-white mt-1.5">
                ${(kpis.totalPaid + kpis.totalPending).toLocaleString()}
              </div>
              <div className="text-[11px] text-emerald-500 mt-1 font-medium">
                ${kpis.totalPaid.toLocaleString()} cobrado
              </div>
            </div>

            <div className="bg-white dark:bg-slate-900 p-5 rounded-xl border border-slate-200/80 dark:border-slate-800 shadow-sm">
              <div className="text-xs text-slate-400 font-semibold">Ingreso Medio por Sesión</div>
              <div className="text-2xl font-black text-slate-900 dark:text-white mt-1.5">
                ${data.bookings.length > 0 ? Math.round(kpis.totalPaid / data.bookings.length) : 0}
              </div>
              <div className="text-[11px] text-slate-400 mt-1">Por sesión reservada</div>
            </div>

            <div className="bg-white dark:bg-slate-900 p-5 rounded-xl border border-slate-200/80 dark:border-slate-800 shadow-sm">
              <div className="text-xs text-slate-400 font-semibold">Horas Docentes Totales</div>
              <div className="text-2xl font-black text-slate-900 dark:text-white mt-1.5">
                {kpis.totalTeachingHours.toFixed(1)} h
              </div>
              <div className="text-[11px] text-accent mt-1">En todas las materias activas</div>
            </div>

            <div className="bg-white dark:bg-slate-900 p-5 rounded-xl border border-slate-200/80 dark:border-slate-800 shadow-sm">
              <div className="text-xs text-slate-400 font-semibold">Rendimiento por Hora</div>
              <div className="text-2xl font-black text-emerald-600 dark:text-emerald-400 mt-1.5">
                ${kpis.totalTeachingHours > 0 ? Math.round(kpis.totalPaid / kpis.totalTeachingHours) : 0}/h
              </div>
              <div className="text-[11px] text-slate-400 mt-1">Tarifa base: ${data.user.hourlyRate}/h</div>
            </div>
          </div>

          {/* Gráficos */}
          <div className="grid grid-cols-1 md:grid-cols-2 gap-6">
            
            {/* Distribución de Horas por Materia */}
            <div className="bg-white dark:bg-slate-900 p-5 rounded-xl border border-slate-200/80 dark:border-slate-800 shadow-sm">
              <h3 className="font-bold text-sm text-slate-900 dark:text-white mb-4">
                Horas Semanales Impartidas por Materia
              </h3>
              {subjectDistribution.length === 0 ? (
                <p className="text-xs text-slate-400 py-8 text-center italic">No hay clases registradas aún.</p>
              ) : (
                <div className="space-y-4">
                  {subjectDistribution.map(([subject, hours]) => {
                    const maxHours = Math.max(...subjectDistribution.map(s => s[1]), 5);
                    const pct = Math.min(100, Math.round((hours / maxHours) * 100));
                    return (
                      <div key={subject}>
                        <div className="flex justify-between text-xs font-semibold mb-1">
                          <span className="text-slate-700 dark:text-slate-300">{subject}</span>
                          <span className="text-accent dark:text-accent-light">{hours.toFixed(1)} h/semana</span>

                        <div className="w-full h-3 bg-slate-100 dark:bg-slate-800 rounded-full overflow-hidden">
                          <div
                            className="h-full bg-accent rounded-full transition-all duration-500"
                            style={{ width: `${pct}%` }}

                        </div>
                      </div>
                    );
                  })}
                </div>
              )}
