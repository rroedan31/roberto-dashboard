                )}
              </div>
            </div>
          )}
        </div>
      );
    }

    // PESTAÑA 2: TAREAS Y PREPARACIÓN
    // ----------------------------------------------------
    function TasksView({ tasks, searchQuery, onOpenModal, onToggleTask, onDeleteTask }) {
      const [filterCategory, setFilterCategory] = useState('Todas');
      const [filterPriority, setFilterPriority] = useState('Todas');
      const [filterStatus, setFilterStatus] = useState('Todas');

      const categories = ['Todas', 'Preparación', 'Calificaciones', 'Administración', 'Seguimiento', 'Currículo', 'Personal'];
      const priorities = ['Todas', 'Urgente', 'Alta', 'Media', 'Baja'];
      const statuses = [
        { id: 'Todas', label: 'Todas' },
        { id: 'pendiente', label: 'Pendientes' },
        { id: 'en_progreso', label: 'En Progreso' },
        { id: 'completada', label: 'Completadas' }
      ];

      const filteredTasks = useMemo(() => {
        return tasks.filter(t => {
          if (filterCategory !== 'Todas' && t.category !== filterCategory) return false;
          if (filterPriority !== 'Todas' && t.priority !== filterPriority) return false;
          if (filterStatus !== 'Todas' && t.status !== filterStatus) return false;
          if (searchQuery) {
            const q = searchQuery.toLowerCase();
            return t.title.toLowerCase().includes(q) || (t.notes && t.notes.toLowerCase().includes(q));
          }
          return true;
        });
      }, [tasks, filterCategory, filterPriority, filterStatus, searchQuery]);

      const completedCount = tasks.filter(t => t.status === 'completada').length;
      const progressPercent = tasks.length > 0 ? Math.round((completedCount / tasks.length) * 100) : 0;

      return (
        <div className="space-y-6">
          {/* Cabecera */}
          <div className="flex flex-col sm:flex-row sm:items-center justify-between gap-4">
            <div>
              <h2 className="text-xl sm:text-2xl font-bold text-slate-900 dark:text-white">
                Gestión de Tareas y Preparación de Clases
              </h2>
              <p className="text-xs sm:text-sm text-slate-500 dark:text-slate-400">
                Organiza la preparación de lecciones, correcciones, notas y tareas administrativas.
              </p>
            </div>
            <button
              onClick={() => onOpenModal({ type: 'task' })}
              className="inline-flex items-center justify-center gap-2 px-4 py-2.5 rounded-xl bg-accent hover:bg-accent-dark text-white text-xs font-bold shadow-md shadow-accent/20 transition"
            >
              <Icons.Plus /> Nueva Tarea
            </button>
          </div>

          {/* Barra de Progreso */}
          {tasks.length > 0 && (
            <div className="bg-white dark:bg-slate-900 p-4 rounded-xl border border-slate-200/80 dark:border-slate-800 shadow-sm flex flex-col sm:flex-row sm:items-center justify-between gap-4">
              <div className="flex-1">
                <div className="flex items-center justify-between text-xs font-semibold mb-1.5">
                  <span>Progreso de Tareas Completadas</span>
                  <span>{completedCount} de {tasks.length} Completadas ({progressPercent}%)</span>
                </div>
                <div className="w-full h-2.5 bg-slate-100 dark:bg-slate-800 rounded-full overflow-hidden">
                  <div
                    className="h-full bg-gradient-to-r from-accent to-emerald-500 transition-all duration-500"
                    style={{ width: `${progressPercent}%` }}
                  ></div>
                </div>
              </div>
            </div>
          )}

          {/* Filtros */}
          <div className="flex flex-wrap items-center gap-3 bg-white dark:bg-slate-900 p-3 rounded-xl border border-slate-200/80 dark:border-slate-800 text-xs">
            <div className="flex items-center gap-1.5">
              <span className="text-slate-400 font-medium">Categoría:</span>
              <select
                value={filterCategory}
                onChange={(e) => setFilterCategory(e.target.value)}
                className="px-2.5 py-1 rounded-lg bg-slate-100 dark:bg-slate-800 border-none font-medium focus:ring-2 focus:ring-accent outline-none"
              >
                {categories.map(c => <option key={c} value={c}>{c}</option>)}
              </select>
            </div>

            <div className="flex items-center gap-1.5">
              <span className="text-slate-400 font-medium">Prioridad:</span>
              <select
                value={filterPriority}
                onChange={(e) => setFilterPriority(e.target.value)}
                className="px-2.5 py-1 rounded-lg bg-slate-100 dark:bg-slate-800 border-none font-medium focus:ring-2 focus:ring-accent outline-none"
              >
                {priorities.map(p => <option key={p} value={p}>{p}</option>)}
              </select>
            </div>

            <div className="flex items-center gap-1.5">
              <span className="text-slate-400 font-medium">Estado:</span>
              <select
                value={filterStatus}
                onChange={(e) => setFilterStatus(e.target.value)}
                className="px-2.5 py-1 rounded-lg bg-slate-100 dark:bg-slate-800 border-none font-medium focus:ring-2 focus:ring-accent outline-none"
              >
                {statuses.map(s => <option key={s.id} value={s.id}>{s.label}</option>)}
              </select>
            </div>
          </div>

          {/* Lista de Tareas */}
          <div className="bg-white dark:bg-slate-900 rounded-xl border border-slate-200/80 dark:border-slate-800 shadow-sm overflow-hidden">
            {filteredTasks.length === 0 ? (
              <div className="p-12 text-center">
                <Icons.EmptyBox />
                <p className="text-sm font-semibold text-slate-700 dark:text-slate-300">No hay tareas pendientes</p>
                <p className="text-xs text-slate-500 mt-1 mb-4">Empieza organizando tu semana y planificando tus próximas lecciones.</p>
                <button
                  onClick={() => onOpenModal({ type: 'task' })}
                  className="inline-flex items-center gap-1.5 px-4 py-2 rounded-xl bg-accent hover:bg-accent-dark text-white text-xs font-bold transition shadow-sm"
                >
                  <Icons.Plus /> Crear mi primera tarea
                </button>
              </div>
            ) : (
              <div className="divide-y divide-slate-100 dark:divide-slate-800">
                {filteredTasks.map(task => {
                  const isCompleted = task.status === 'completada';
                  return (
                    <div
                      key={task.id}
                      className={`p-4 flex items-start justify-between gap-4 transition ${
                        isCompleted ? 'bg-slate-50/50 dark:bg-slate-900/40 opacity-70' : 'hover:bg-slate-50/70 dark:hover:bg-slate-800/40'
                      }`}
                    >
                      <div className="flex items-start gap-3.5 flex-1 min-w-0">
                        <button
                          onClick={() => onToggleTask(task.id)}
                          className={`mt-1 w-5 h-5 rounded-md border flex items-center justify-center transition shrink-0 ${
                            isCompleted
                              ? 'bg-emerald-500 border-emerald-500 text-white'
                              : 'border-slate-300 dark:border-slate-600 hover:border-accent'
                          }`}
                        >
                          {isCompleted && <Icons.Check />}
                        </button>
                        <div className="flex-1 min-w-0">
                          <div className="flex items-center gap-2 flex-wrap">
                            <h4 className={`text-sm font-semibold text-slate-900 dark:text-white ${isCompleted ? 'line-through text-slate-400 dark:text-slate-500' : ''}`}>
                              {task.title}
                            </h4>
                            <span className="text-[10px] font-bold px-2 py-0.5 rounded-full bg-slate-100 dark:bg-slate-800 text-slate-600 dark:text-slate-300">
                              {task.category}
                            </span>
                            <span className={`text-[10px] font-bold px-2 py-0.5 rounded-full ${
                              task.priority === 'Urgente'
                                ? 'bg-rose-100 text-rose-700 dark:bg-rose-950 dark:text-rose-300'
                                : task.priority === 'Alta'
                                ? 'bg-amber-100 text-amber-700 dark:bg-amber-950 dark:text-amber-300'
                                : task.priority === 'Media'
                                ? 'bg-blue-100 text-blue-700 dark:bg-blue-950 dark:text-blue-300'
                                : 'bg-slate-100 text-slate-600 dark:bg-slate-800 dark:text-slate-400'
                            }`}>
                              {task.priority}
                            </span>
                          </div>
                          {task.notes && (
                            <p className="text-xs text-slate-500 dark:text-slate-400 mt-1">
                              {task.notes}
                            </p>
                          )}
                          <div className="flex flex-wrap items-center gap-4 text-[11px] text-slate-400 mt-2">
                            <span className="flex items-center gap-1">
                              <Icons.Calendar /> Fecha: {task.dueDate || 'Sin fecha'}
                            </span>
                            {task.time && (
                              <span className="flex items-center gap-1 font-bold text-accent dark:text-accent-light">
                                <Icons.Clock /> Hora: {task.time}
                              </span>
                            )}
                            <span>Estado: <strong className="capitalize text-slate-600 dark:text-slate-300">{task.status.replace('_', ' ')}</strong></span>
                          </div>
                        </div>
                      </div>

                      <div className="flex items-center gap-2 shrink-0">
                        <button
                          onClick={() => onOpenModal({ type: 'task', item: task })}
                          className="px-2.5 py-1 text-xs font-semibold rounded-lg bg-slate-100 dark:bg-slate-800 hover:bg-slate-200 dark:hover:bg-slate-700 text-slate-700 dark:text-slate-200 transition"
                        >
                          Editar
                        </button>
                        <button
                          onClick={() => onDeleteTask(task.id)}
                          className="p-1.5 text-slate-400 hover:text-rose-600 transition"
                          title="Eliminar tarea"
                        >
                          <Icons.Trash />
                        </button>
                      </div>
                    </div>
                  );
                })}
              </div>
            )}
          </div>
        </div>
      );
    }

    // ----------------------------------------------------
    // PESTAÑA 3: CLASES Y HORARIOS
    // ----------------------------------------------------
    function ClassesView({ classes, students, searchQuery, onOpenModal, onDeleteClass, onClearAllClasses, onRestoreClasses }) {
      const studentMap = useMemo(() => {
        return new Map(students.map(s => [s.id, s.name]));
      }, [students]);

      const filteredClasses = useMemo(() => {
        return classes.filter(c => {
          if (!searchQuery) return true;
          const q = searchQuery.toLowerCase();
          return c.name.toLowerCase().includes(q) || c.subject.toLowerCase().includes(q) || (c.description && c.description.toLowerCase().includes(q));
        });
      }, [classes, searchQuery]);

      return (
        <div className="space-y-6">
          <div className="flex flex-col sm:flex-row sm:items-center justify-between gap-4">
            <div>
              <h2 className="text-xl sm:text-2xl font-bold text-slate-900 dark:text-white">
                Horario de Clases y Oferta Académica
              </h2>
              <p className="text-xs sm:text-sm text-slate-500 dark:text-slate-400">
                Administra talleres en grupo, clases regulares, alumnos inscritos y enlaces de reunión.
              </p>
            </div>
            <div className="flex items-center gap-2">
              <button
                onClick={onRestoreClasses}
                className="inline-flex items-center justify-center gap-2 px-3 py-2.5 rounded-xl bg-amber-50 dark:bg-amber-950/40 hover:bg-amber-100 text-amber-700 dark:text-amber-300 text-xs font-bold border border-amber-200/50 dark:border-amber-900 transition shadow-sm"
                title="Recuperar clases guardadas en versiones o sesiones anteriores del navegador"
              >
                <Icons.Refresh /> Recuperar Clases Anteriores
              </button>
              <button
                onClick={onClearAllClasses}
                className="inline-flex items-center justify-center gap-2 px-3 py-2.5 rounded-xl bg-rose-50 dark:bg-rose-950/40 hover:bg-rose-100 text-rose-600 dark:text-rose-400 text-xs font-bold border border-rose-200/50 dark:border-rose-900 transition shadow-sm"
                title="Eliminar todas las clases agendadas y poner saldos pendientes en cero"
              >
                <Icons.Trash /> Limpiar Clases y Saldos
              </button>
              <button
                onClick={() => onOpenModal({ type: 'class' })}
                className="inline-flex items-center justify-center gap-2 px-4 py-2.5 rounded-xl bg-accent hover:bg-accent-dark text-white text-xs font-bold shadow-md shadow-accent/20 transition"
              >
                <Icons.Plus /> Programar Nueva Clase
              </button>
            </div>
          </div>

          {filteredClasses.length === 0 ? (
            <div className="bg-white dark:bg-slate-900 rounded-xl p-12 text-center border border-slate-200/80 dark:border-slate-800 shadow-sm">
              <Icons.EmptyBox />
              <h3 className="text-sm font-semibold text-slate-700 dark:text-slate-300">No hay clases programadas</h3>
              <p className="text-xs text-slate-500 mt-1 mb-4">Configura tus asignaturas, días y horarios de clase habituales.</p>
              <div className="flex items-center justify-center gap-3">
                <button
                  onClick={() => onOpenModal({ type: 'class' })}
                  className="inline-flex items-center gap-1.5 px-4 py-2 rounded-xl bg-accent hover:bg-accent-dark text-white text-xs font-bold transition shadow-sm"
                >
                  <Icons.Plus /> Añadir mi primera clase
                </button>
                <button
                  onClick={onRestoreClasses}
                  className="inline-flex items-center gap-1.5 px-4 py-2 rounded-xl bg-amber-100 hover:bg-amber-200 text-amber-800 text-xs font-bold transition shadow-sm border border-amber-300/60"
                >
                  <Icons.Refresh /> Restaurar Clases Anteriores
                </button>
              </div>
            </div>
          ) : (
            <div className="grid grid-cols-1 md:grid-cols-2 gap-5">
              {filteredClasses.map(cls => {
                const enrolledCount = (cls.enrolledStudentIds || []).length;
                return (
                  <div
                    key={cls.id}
                    className="bg-white dark:bg-slate-900 rounded-xl p-5 border border-slate-200/80 dark:border-slate-800 shadow-sm flex flex-col justify-between"
                  >
                    <div className="space-y-3">
                      <div className="flex items-start justify-between gap-2">
                        <span className="text-xs font-bold px-2.5 py-0.5 rounded-md bg-accent/10 text-accent-dark dark:bg-accent/20 dark:text-accent-light border border-accent/20 dark:border-accent/30">
                          {cls.subject}
                        </span>
                        <div className="flex items-center gap-1.5">
                          {cls.billingType && cls.billingType !== 'Regular' && (
                            <span className="text-[10px] font-bold px-2 py-0.5 rounded-full bg-purple-100 text-purple-700 dark:bg-purple-950 dark:text-purple-300">
                              {cls.billingType} ($0)
                            </span>
                          )}
                          <span className="text-xs font-semibold px-2 py-0.5 rounded bg-slate-100 dark:bg-slate-800 text-slate-600 dark:text-slate-300">
                            {cls.status}
                          </span>
                          <button
                            onClick={() => onOpenModal({ type: 'class', item: cls })}
                            className="text-xs text-slate-400 hover:text-slate-700 dark:hover:text-slate-200 p-1"
                            title="Editar"
                          >
                            ✎
                          </button>
                          <button
                            onClick={() => onDeleteClass(cls.id)}
                            className="text-xs text-slate-400 hover:text-rose-500 p-1"
                            title="Eliminar"
                          >
                            <Icons.Trash />
                          </button>
                        </div>
                      </div>

                      <div>
                        <h3 className="text-base font-bold text-slate-900 dark:text-white">
                          {cls.name}
                        </h3>
                        <p className="text-xs text-slate-500 dark:text-slate-400 mt-1">
                          {cls.description}
                        </p>
                      </div>

                      <div className="grid grid-cols-2 gap-2 text-xs text-slate-600 dark:text-slate-300 pt-2 border-t border-slate-100 dark:border-slate-800">
                        <div className="flex items-center gap-1.5">
                          <Icons.Calendar />
                          <span>{cls.dayOfWeek}</span>
                        </div>
                        <div className="flex items-center gap-1.5">
                          <Icons.Clock />
                          <span>{cls.time} ({cls.durationMinutes} min)</span>
                        </div>
                      </div>

                      <div className="pt-2">
                        <div className="text-[11px] font-semibold text-slate-400 mb-1.5 flex justify-between">
                          <span>Alumnos Inscritos</span>
                          <span>{enrolledCount} / {cls.capacity} cupos</span>
                        </div>
                        <div className="flex flex-wrap gap-1.5">
                          {enrolledCount === 0 ? (
                            <span className="text-[11px] text-slate-400 italic">Sin alumnos inscritos</span>
                          ) : (
                            (cls.enrolledStudentIds || []).map(sid => (
                              <span key={sid} className="text-[11px] px-2 py-0.5 rounded-full bg-slate-100 dark:bg-slate-800 text-slate-700 dark:text-slate-300 font-medium">
                                {studentMap.get(sid) || sid}
                              </span>
                            ))
                          )}
                        </div>
                      </div>
                    </div>

                    <div className="mt-5 pt-3 border-t border-slate-100 dark:border-slate-800 flex items-center justify-between">
                      <span className="text-xs text-slate-400">Modalidad: Regular</span>
                      {cls.location && (
                        <a
                          href={cls.location}
                          target="_blank"
                          rel="noreferrer"
                          className="inline-flex items-center gap-1 px-3 py-1.5 rounded-lg text-xs font-semibold bg-accent hover:bg-accent-dark text-white transition shadow-sm"
                        >
                          Unirse a Clase <Icons.ExternalLink />
                        </a>
                      )}
                    </div>
                  </div>
                );
              })}
            </div>
          )}
        </div>
      );
    }

    // ----------------------------------------------------
    // PESTAÑA 4: ESTUDIANTES Y RESERVAS
    // ----------------------------------------------------
    function StudentsView({ students = [], bookings = [], classes = [], searchQuery = '', onOpenModal = () => {}, onDeleteStudent = () => {}, onDeleteBooking = () => {}, onExportCsv = () => {}, onResetStudentBalances = () => {} }) {
      const [activeSubTab, setActiveSubTab] = useState('roster');

      const safeStudents = Array.isArray(students) ? students : [];
      const safeBookings = Array.isArray(bookings) ? bookings : [];

      const filteredStudents = useMemo(() => {
        return safeStudents.filter(s => {
          if (!s) return false;
          if (!searchQuery) return true;
          const q = searchQuery.toLowerCase();
          const name = (s.name || '').toLowerCase();
          const email = (s.email || '').toLowerCase();
          const notes = (s.notes || '').toLowerCase();
          return name.includes(q) || email.includes(q) || notes.includes(q);
        });
      }, [safeStudents, searchQuery]);

      const filteredBookings = useMemo(() => {
        return safeBookings.filter(b => {
          if (!b) return false;
          if (!searchQuery) return true;
          const q = searchQuery.toLowerCase();
          const sName = (b.studentName || '').toLowerCase();
          const cName = (b.className || '').toLowerCase();
          return sName.includes(q) || cName.includes(q);
        });
      }, [safeBookings, searchQuery]);

      return (
        <div className="space-y-6">
          <div className="flex flex-col sm:flex-row sm:items-center justify-between gap-4">
            <div>
              <h2 className="text-xl sm:text-2xl font-bold text-slate-900 dark:text-white">
                Estudiantes y Sesiones de Clase
              </h2>
              <p className="text-xs sm:text-sm text-slate-500 dark:text-slate-400">
                Directorio de alumnos, tarifas por hora, registro de sesiones individuales y asistencia.
              </p>
            </div>
            <div className="flex items-center gap-2">
              <button

              </button>

                onClick={() => onExportCsv(activeSubTab === 'roster' ? 'alumnos' : 'reservas')}

          {/* Subpestaña 1: Directorio */}
          {activeSubTab === 'roster' && (
            <div>
              {filteredStudents.length === 0 ? (
                <div className="bg-white dark:bg-slate-900 rounded-xl p-12 text-center border border-slate-200/80 dark:border-slate-800 shadow-sm">
                  <Icons.EmptyBox />
                  <h3 className="text-sm font-semibold text-slate-700 dark:text-slate-300">No hay alumnos registrados</h3>

                  <button
                    onClick={() => onOpenModal({ type: 'student' })}

                <div className="grid grid-cols-1 md:grid-cols-2 lg:grid-cols-3 gap-4">
                  {filteredStudents.map((student, idx) => (
                    <div
                      key={student.id || idx}

                    >
                      <div>
                        <div className="flex items-start justify-between">
                          <div>
                            <h3 className="font-bold text-base text-slate-900 dark:text-white">
                              {student.name || 'Sin nombre'}

                                ? 'bg-emerald-100 text-emerald-800 dark:bg-emerald-950 dark:text-emerald-300'

                        <div className="mt-4 space-y-1 text-xs text-slate-500 dark:text-slate-400">
                          {student.email && <p>📧 {student.email}</p>}

                        {student.notes && (
                          <div className="mt-3 p-2.5 rounded-lg bg-slate-50 dark:bg-slate-800/60 text-xs text-slate-600 dark:text-slate-300 italic">
                            "{student.notes}"
                          </div>

                      </div>

                      <div className="mt-5 pt-3 border-t border-slate-100 dark:border-slate-800 flex items-center justify-between">
                        <div>
                          {Number(student.balanceDue || 0) > 0 ? (
                            <span className="text-xs font-bold text-rose-500">Saldo: ${student.balanceDue}</span>
                          ) : (
                            <span className="text-xs font-bold text-emerald-500">Sin saldo pendiente</span>
                          )}
                        </div>
                        <div className="flex items-center gap-1.5">
                          <button
                            onClick={() => onOpenModal({ type: 'student', item: student })}
                            className="px-2.5 py-1 rounded-lg text-xs font-semibold bg-slate-100 dark:bg-slate-800 hover:bg-slate-200 dark:hover:bg-slate-700 text-slate-700 dark:text-slate-200 transition"
                          >
                            Editar
                          </button>
                          <button
                            onClick={() => onDeleteStudent(student.id)}
                            className="p-1.5 text-slate-400 hover:text-rose-500 transition"
                          >
                            <Icons.Trash />
                          </button>
                        </div>
                      </div>
                    </div>
                  ))}
                </div>
              )}
            </div>
          )}

          {/* Subpestaña 2: Registro de Reservas */}
          {activeSubTab === 'bookings' && (
            <div className="bg-white dark:bg-slate-900 rounded-xl border border-slate-200/80 dark:border-slate-800 shadow-sm overflow-x-auto">
              {filteredBookings.length === 0 ? (
                <div className="p-12 text-center">
                  <Icons.EmptyBox />
                  <h3 className="text-sm font-semibold text-slate-700 dark:text-slate-300">No hay reservas registradas</h3>
                  <p className="text-xs text-slate-500 mt-1 mb-4">Agenda sesiones individuales de tutoría o clases prácticas.</p>
                  <button
                    onClick={() => onOpenModal({ type: 'booking' })}
                    className="inline-flex items-center gap-1.5 px-4 py-2 rounded-xl bg-accent hover:bg-accent-dark text-white text-xs font-bold transition shadow-sm"
                  >
                    <Icons.Plus /> Registrar primera reserva
                  </button>
                </div>
              ) : (
                <table className="w-full text-left text-xs">
                  <thead className="bg-slate-50 dark:bg-slate-800/60 border-b border-slate-200/80 dark:border-slate-800 text-slate-500 uppercase font-semibold">
                    <tr>
                      <th className="p-3.5">Alumno</th>
                      <th className="p-3.5">Sesión / Clase</th>
                      <th className="p-3.5">Fecha y Hora</th>
                      <th className="p-3.5">Duración</th>
                      <th className="p-3.5">Tarifa</th>
                      <th className="p-3.5">Estado Reserva</th>
                      <th className="p-3.5">Estado Pago</th>
                      <th className="p-3.5 text-right">Acciones</th>
                    </tr>
                  </thead>
                  <tbody className="divide-y divide-slate-100 dark:divide-slate-800">
                    {filteredBookings.map((b, idx) => (
                      <tr key={b.id || idx} className="hover:bg-slate-50/70 dark:hover:bg-slate-800/40 transition">
                        <td className="p-3.5 font-bold text-slate-900 dark:text-white">{b.studentName || 'Sin alumno'}</td>
                        <td className="p-3.5 text-slate-600 dark:text-slate-300">{b.className || 'Clase individual'}</td>
                        <td className="p-3.5 text-slate-500">{(b.date || '') + (b.time ? ' a las ' + b.time : '')}</td>
                        <td className="p-3.5 text-slate-500">{b.duration || 60} min</td>
                        <td className="p-3.5 font-bold text-slate-800 dark:text-slate-200">${b.rate || 0}</td>
                        <td className="p-3.5">
                          <span className={`text-[10px] font-bold px-2 py-0.5 rounded-full ${
                            b.status === 'Confirmada' ? 'bg-accent/10 text-accent-dark dark:bg-accent/20 dark:text-accent-light' :
                            b.status === 'Completada' ? 'bg-emerald-100 text-emerald-700 dark:bg-emerald-950 dark:text-emerald-300' :
                            'bg-amber-100 text-amber-700 dark:bg-amber-950 dark:text-amber-300'
                          }`}>
                            {b.status || 'Pendiente'}
                          </span>
                        </td>
                        <td className="p-3.5">
                          <span className={`text-[10px] font-bold px-2 py-0.5 rounded-full ${
                            b.paymentStatus === 'Pagado' ? 'bg-emerald-100 text-emerald-700 dark:bg-emerald-950 dark:text-emerald-300' :
                            b.paymentStatus === 'Vencido' ? 'bg-rose-100 text-rose-700 dark:bg-rose-950 dark:text-rose-300' :
                            'bg-amber-100 text-amber-700 dark:bg-amber-950 dark:text-amber-300'
                          }`}>
                            {b.paymentStatus || 'Pendiente'}
                          </span>
                        </td>
                        <td className="p-3.5 text-right space-x-1.5">
                          <button
                            onClick={() => onOpenModal({ type: 'booking', item: b })}
                            className="text-xs text-accent dark:text-accent-light hover:underline font-semibold"
                          >
                            Editar
                          </button>
                          <button
                            onClick={() => onDeleteBooking(b.id)}
                            className="text-xs text-slate-400 hover:text-rose-500 p-1"
                          >
                            <Icons.Trash />
                          </button>
                        </td>
                      </tr>
                    ))}
                  </tbody>
                </table>
              )}
            </div>
          )}
        </div>
      );
    }

    // ----------------------------------------------------
    // PESTAÑA: CALENDARIO VISUAL DE HORAS (TIMELINE)
    // ----------------------------------------------------
    function CalendarView({ classes = [], students = [], bookings = [], onOpenModal = () => {}, onDeleteClass = () => {} }) {
      const [currentDate, setCurrentDate] = useState(() => {
        const today = new Date();
        return today.toISOString().slice(0, 10);
      });

      const safeClasses = Array.isArray(classes) ? classes : [];
      const safeStudents = Array.isArray(students) ? students : [];
      const safeBookings = Array.isArray(bookings) ? bookings : [];

      const studentMap = useMemo(() => {
        return new Map(safeStudents.map(s => [s.id, s.name]));
      }, [safeStudents]);

      // Horas del timeline (desde las 5:00 AM hasta las 8:00 PM)
      const hours = useMemo(() => {
        const list = [];
        for (let h = 5; h <= 20; h++) {
          const hour12 = h % 12 === 0 ? 12 : h % 12;
          const ampm = h < 12 ? 'AM' : 'PM';
          list.push({
            hour24: h,
            label: `${hour12}:00 ${ampm}`,
            shortLabel: `${hour12} ${ampm}`
          });
        }
        return list;
      }, []);

      // Navegación de fechas
      const handlePrevDay = () => {
        const d = new Date(currentDate + 'T00:00:00');
        d.setDate(d.getDate() - 1);
        setCurrentDate(d.toISOString().slice(0, 10));
      };

      const handleNextDay = () => {
        const d = new Date(currentDate + 'T00:00:00');
        d.setDate(d.getDate() + 1);
        setCurrentDate(d.toISOString().slice(0, 10));
      };

      const handleToday = () => {
        setCurrentDate(new Date().toISOString().slice(0, 10));
      };

      // Formato legible en español
      const formattedDateTitle = useMemo(() => {
        try {
          const parts = currentDate.split('-');
          const d = new Date(Number(parts[0]), Number(parts[1]) - 1, Number(parts[2]));
          return d.toLocaleDateString('es-ES', {
            weekday: 'long',
            day: 'numeric',
            month: 'long',
            year: 'numeric'
          });
        } catch (e) {
          return currentDate;
        }
      }, [currentDate]);

      // Determinar día de la semana correspondiente
      const dayOfWeekName = useMemo(() => {
        try {
          const parts = currentDate.split('-');
          const d = new Date(Number(parts[0]), Number(parts[1]) - 1, Number(parts[2]));
          const days = ['Domingo', 'Lunes', 'Martes', 'Miércoles', 'Jueves', 'Viernes', 'Sábado'];
          return days[d.getDay()];
        } catch (e) {
          return '';
        }
      }, [currentDate]);

      // Filtrar clases y reservas del día seleccionado
      const dayEvents = useMemo(() => {
        const events = [];

        // 1. Clases que coincidan por fecha exacta (o por día semanal recurrente si no tienen fecha fija)
        safeClasses.forEach(cls => {
          let matches = false;
          if (cls.date) {
            if (cls.date === currentDate) matches = true;
          } else if (cls.dayOfWeek) {
            if (cls.dayOfWeek.toLowerCase() === dayOfWeekName.toLowerCase()) matches = true;
          }
          if (matches) {
            // parsear hora y duración
            let startMinutes = 18 * 60; // default 18:00
            if (cls.time) {
              const [h, m] = cls.time.split(':').map(Number);
              if (!isNaN(h)) startMinutes = h * 60 + (m || 0);
            }
            const duration = Number(cls.durationMinutes) || 60;
            const endMinutes = startMinutes + duration;

            let studentNames = [];
            if (Array.isArray(cls.enrolledStudentIds) && cls.enrolledStudentIds.length > 0) {
              studentNames = cls.enrolledStudentIds.map(sid => studentMap.get(sid) || sid);
            }

            const billingType = cls.billingType || 'Regular';
            let paidStatus = null;
            if (billingType !== 'Regular') {
              paidStatus = billingType; // 'Cortesía', 'Gratis', o 'Reposición'
            }

            events.push({
              id: 'cls-' + cls.id,
              rawItem: cls,
              type: 'class',
              title: cls.name || 'Clase',
              subtitle: studentNames.length > 0 ? studentNames.join(', ') : (cls.subject || 'Clase'),
              timeStr: cls.time || '18:00',
              startMinutes,
              duration,
              endMinutes,
              status: cls.status || 'Programada',
              paidStatus,
              billingType,
              location: cls.location || ''
            });
          }
        });

        // 2. Reservas de la pestaña de estudiantes que tengan fecha igual a currentDate
        safeBookings.forEach(b => {
          if (b.date === currentDate) {
            let startMinutes = 18 * 60;
            if (b.time) {
              const [h, m] = b.time.split(':').map(Number);
              if (!isNaN(h)) startMinutes = h * 60 + (m || 0);
            }
            const duration = Number(b.duration) || 60;
            events.push({
              id: 'bk-' + b.id,
              rawItem: b,
              type: 'booking',
              title: b.studentName || 'Estudiante',
              subtitle: b.className || 'Sesión individual',
              timeStr: b.time || '18:00',
              startMinutes,
              duration,
              endMinutes: startMinutes + duration,
              status: b.status || 'Confirmada',
              paidStatus: b.paymentStatus || 'Pendiente',
              location: ''
            });
          }
        });

        // Ordenar por hora de inicio
        events.sort((a, b) => a.startMinutes - b.startMinutes);
        return events;
      }, [safeClasses, safeBookings, currentDate, dayOfWeekName, studentMap]);

      // Formatear rango de hora (ej: 6:00 PM - 7:00 PM)
      const formatTimeRange = (startMin, dur) => {
        const endMin = startMin + dur;
        const formatM = (totalM) => {
          const h24 = Math.floor(totalM / 60);
          const m = totalM % 60;
          const h12 = h24 % 12 === 0 ? 12 : h24 % 12;
          const ampm = h24 < 12 ? 'AM' : 'PM';
          const mm = m < 10 ? '0' + m : m;
          return `${h12}:${mm} ${ampm}`;
        };
        return `${formatM(startMin)} - ${formatM(endMin)}`;
      };

      const timelineStartMin = 5 * 60; // 5:00 AM
      const timelineEndMin = 21 * 60;  // 9:00 PM (end of 8:00 PM hour)
      const totalTimelineMin = timelineEndMin - timelineStartMin;
      const hourColWidth = 180; // px por hora para mayor espacio de lectura

      return (
        <div className="space-y-6">
          {/* BARRA SUPERIOR DE CONTROL ESTILO IMAGEN DE REFERENCIA */}
          <div className="bg-white dark:bg-slate-900 rounded-2xl p-4 sm:p-5 border border-slate-200/80 dark:border-slate-800 shadow-sm flex flex-col md:flex-row md:items-center justify-between gap-4">
            
            {/* Navegación por fechas: Botones Anterior, Hoy, Siguiente y Selector */}
            <div className="flex flex-wrap items-center gap-2.5">
              <div className="inline-flex rounded-xl border border-slate-200 dark:border-slate-700 bg-slate-50 dark:bg-slate-800 p-0.5 shadow-sm">
                <button
                  onClick={handlePrevDay}
                  className="px-2.5 py-1.5 rounded-lg hover:bg-white dark:hover:bg-slate-700 text-slate-600 dark:text-slate-300 font-bold transition flex items-center"
                  title="Día anterior"
                >
                  <Icons.ChevronLeft />
                </button>
                <button
                  onClick={handleToday}
                  className="px-3 py-1.5 rounded-lg hover:bg-white dark:hover:bg-slate-700 text-slate-700 dark:text-slate-200 text-xs font-bold transition border-x border-slate-200 dark:border-slate-700"
                >
                  Hoy
                </button>
                <button
                  onClick={handleNextDay}
                  className="px-2.5 py-1.5 rounded-lg hover:bg-white dark:hover:bg-slate-700 text-slate-600 dark:text-slate-300 font-bold transition flex items-center"
                  title="Día siguiente"
                >
                  <Icons.ChevronRight />
                </button>
              </div>

              {/* Selector de Fecha */}
              <div className="flex items-center gap-2 bg-slate-50 dark:bg-slate-800 px-3 py-1.5 rounded-xl border border-slate-200 dark:border-slate-700">
                <Icons.Calendar />
                <input
                  type="date"
                  value={currentDate}
                  onChange={(e) => e.target.value && setCurrentDate(e.target.value)}
                  className="bg-transparent text-xs sm:text-sm font-bold text-slate-800 dark:text-slate-100 outline-none cursor-pointer"
                />
              </div>

              {/* Título Legible de la fecha */}
              <div className="hidden sm:block pl-2 border-l border-slate-200 dark:border-slate-700">
                <span className="text-sm font-extrabold capitalize text-slate-900 dark:text-white">
                  {formattedDateTitle}
                </span>
              </div>
            </div>

            {/* Badges de estado & Botón de acción */}
            <div className="flex flex-wrap items-center gap-2 sm:gap-3">
              <div className="inline-flex items-center gap-1.5 px-3 py-1.5 rounded-xl bg-emerald-50 dark:bg-emerald-950/50 border border-emerald-200/60 dark:border-emerald-900 text-emerald-700 dark:text-emerald-300 text-xs font-bold">
                <span className="w-2 h-2 rounded-full bg-emerald-500 animate-pulse"></span>
                <span>{dayEvents.length} {dayEvents.length === 1 ? 'Clase agendada' : 'Clases agendadas'}</span>
              </div>

              <button
                onClick={() => onOpenModal({ type: 'class', defaultDate: currentDate })}
                className="inline-flex items-center gap-1.5 px-4 py-2 rounded-xl bg-accent hover:bg-accent-dark text-white text-xs font-bold shadow-md shadow-accent/20 transition"
              >
                <Icons.Plus /> Programar en este día
              </button>
            </div>
          </div>

          {/* VISTA TIMELINE HORIZONTAL (INSPIRADA EN LA IMAGEN DE REFERENCIA) */}
          <div className="bg-white dark:bg-slate-900 rounded-2xl border border-slate-200/80 dark:border-slate-800 shadow-sm overflow-hidden">
            
            {/* Header del Calendario */}
            <div className="p-4 border-b border-slate-100 dark:border-slate-800 flex items-center justify-between">
              <div className="flex items-center gap-2">
                <h3 className="text-sm font-bold text-slate-900 dark:text-white uppercase tracking-wider">
                  Horario Diario de Clases
                </h3>
                <span className="text-xs text-slate-400">
                  (Desliza horizontalmente para ver todo el día)
                </span>
              </div>
              <span className="text-xs font-semibold px-2.5 py-1 rounded-lg bg-slate-100 dark:bg-slate-800 text-slate-600 dark:text-slate-300">
                5:00 AM — 8:00 PM
              </span>
            </div>

            {/* Contenedor scrolleable horizontalmente */}
            <div className="overflow-x-auto scrollbar-thin">
              <div style={{ minWidth: `${hours.length * hourColWidth}px` }} className="relative select-none">
                
                {/* Cabecera de Horas (1:00 PM, 2:00 PM, etc.) */}
                <div className="flex border-b border-slate-200 dark:border-slate-800 bg-slate-50/80 dark:bg-slate-800/50">
                  {hours.map(h => (
                    <div
                      key={h.hour24}
                      style={{ width: `${hourColWidth}px` }}
                      className="shrink-0 py-3 px-2 text-center border-r border-slate-200 dark:border-slate-800 last:border-r-0 flex items-center justify-center gap-1 text-xs font-bold text-slate-600 dark:text-slate-300"
                    >
                      <span>{h.label}</span>
                      <span className="text-[10px] text-slate-400">🕒</span>
                    </div>
                  ))}
                </div>

                {/* FILA 1: PISTA PRINCIPAL DE CLASES (TIMELINE VISUAL) */}
                <div className="relative min-h-[14rem] h-auto bg-slate-50/30 dark:bg-slate-900/40 py-3">
                  {/* Rejilla de fondo (líneas verticales de cada hora) */}
                  <div className="absolute inset-0 flex pointer-events-none">
                    {hours.map(h => (
                      <div
                        key={h.hour24}
                        style={{ width: `${hourColWidth}px` }}
                        className="shrink-0 border-r border-dashed border-slate-200 dark:border-slate-800 last:border-r-0 h-full"
                      ></div>
                    ))}
                  </div>

                  {/* BLOQUES DE CLASES RENDERIZADOS SEGÚN SU HORA */}
                  {dayEvents.length === 0 ? (
                    <div className="absolute inset-0 flex flex-col items-center justify-center text-center p-6 text-slate-400">
                      <Icons.Calendar />
                      <p className="text-xs font-semibold mt-2">No tienes clases agendadas para este día</p>
                      <button
                        onClick={() => onOpenModal({ type: 'class', defaultDate: currentDate })}
                        className="mt-2 text-xs font-bold text-accent hover:underline"
                      >
                        + Haz clic aquí para programar una clase
                      </button>
                    </div>
                  ) : (
                    dayEvents.map(evt => {
                      // Calcular posición en píxeles y ancho en píxeles
                      const minSinceStart = Math.max(0, evt.startMinutes - timelineStartMin);
                      const pxPerMinute = hourColWidth / 60;
                      const leftPx = minSinceStart * pxPerMinute;
                      const widthPx = Math.max(hourColWidth - 8, evt.duration * pxPerMinute);

                      return (
                        <div
                          key={evt.id}
                          style={{
                            left: `${leftPx + 4}px`,
                            width: `${widthPx - 8}px`,
                            top: '8px',
                            bottom: '8px'
                          }}
                          className="absolute z-10 rounded-xl p-3 shadow-md border transition-all duration-200 flex flex-col justify-between overflow-y-auto bg-sky-50 dark:bg-sky-950/90 border-sky-200 dark:border-sky-800 text-sky-950 dark:text-sky-100 hover:shadow-lg hover:border-sky-400"
                        >
                          <div>
                            {/* Cabecera del bloque: Nombre y Badge */}
                            <div className="flex items-start justify-between gap-1.5">
                              <h4 className="font-extrabold text-xs text-sky-900 dark:text-sky-100 leading-snug break-words whitespace-normal" title={evt.title}>
                                {evt.title}
                              </h4>
                              <span className="text-[10px] shrink-0 text-sky-600 dark:text-sky-300 font-bold">
                                🕒
                              </span>
                            </div>

                            {/* Subtítulo / Alumnos con Text Wrapping completo */}
                            <div className="mt-1.5 p-1.5 rounded-lg bg-white/70 dark:bg-slate-900/60 border border-sky-200/50 dark:border-sky-900/40">
                              <p className="text-[10px] font-bold text-slate-500 dark:text-slate-400 uppercase tracking-tight">Estudiantes:</p>
                              <p className="text-xs font-bold text-slate-800 dark:text-slate-100 break-words whitespace-normal leading-tight mt-0.5">
                                {evt.subtitle}
                              </p>
                            </div>

                            {/* Rango de Horario (ej: 6:00 PM - 7:00 PM) */}
                            <div className="mt-2 text-[10px] font-semibold text-slate-600 dark:text-slate-300 flex items-center gap-1">
                              <span>🕒 {formatTimeRange(evt.startMinutes, evt.duration)}</span>
                            </div>
                          </div>

                          {/* Pie de la tarjeta: Estado y Botones rápidos */}
                          <div className="mt-2 pt-1.5 border-t border-sky-200/50 dark:border-sky-800/60 flex flex-wrap items-center justify-between gap-1 text-[10px]">
                            <div className="flex items-center gap-1">
                              {evt.billingType && evt.billingType !== 'Regular' ? (
                                <span className="px-1.5 py-0.2 rounded font-bold bg-purple-100 text-purple-700 dark:bg-purple-950 dark:text-purple-300">
                                  {evt.billingType} ($0)
                                </span>
                              ) : evt.paidStatus === 'Cortesía' || evt.paidStatus === 'Gratis' || evt.paidStatus === 'Reposición' ? (
                                <span className="px-1.5 py-0.2 rounded font-bold bg-purple-100 text-purple-700 dark:bg-purple-950 dark:text-purple-300">
                                  {evt.paidStatus} ($0)
                                </span>
                              ) : evt.paidStatus === 'Pagado' ? (
                                <span className="px-1.5 py-0.2 rounded font-bold bg-emerald-100 text-emerald-700 dark:bg-emerald-950 dark:text-emerald-300">
                                  Pagado
                                </span>
                              ) : (
                                <span className="px-1.5 py-0.2 rounded font-bold bg-rose-100 text-rose-700 dark:bg-rose-950 dark:text-rose-300">
                                  {evt.paidStatus || 'Programada'}
                                </span>
                              )}
                              <span className="text-slate-400">({evt.duration}m)</span>
                            </div>

                            <div className="flex items-center gap-1">
                              <button
                                onClick={() => onOpenModal({ type: evt.type, item: evt.rawItem })}
                                className="px-2 py-0.5 rounded bg-white dark:bg-slate-800 hover:bg-slate-100 dark:hover:bg-slate-700 text-slate-700 dark:text-slate-200 font-bold border border-slate-200 dark:border-slate-700"
                                title="Editar"
                              >
                                Editar
                              </button>
                              {evt.type === 'class' && (
                                <button
                                  onClick={() => onDeleteClass(evt.rawItem.id)}
                                  className="p-1 text-slate-400 hover:text-rose-500 rounded hover:bg-rose-50 dark:hover:bg-rose-950/40"
                                  title="Eliminar clase"
                                >
                                  ✕
                                </button>
                              )}
                            </div>
                          </div>
                        </div>
                      );
                    })
                  )}
                </div>

              </div>
            </div>

            {/* LISTA DETALLADA INFERIOR DEL DÍA (PARA VISTA RÁPIDA O MÓVILES) */}
            <div className="border-t border-slate-100 dark:border-slate-800 p-4 sm:p-5 bg-slate-50/50 dark:bg-slate-850/40">
              <h4 className="text-xs font-bold text-slate-700 dark:text-slate-300 uppercase mb-3 flex items-center gap-2">
                <span>Resumen del Día ({dayEvents.length} {dayEvents.length === 1 ? 'Sesión' : 'Sesiones'})</span>
              </h4>

              {dayEvents.length === 0 ? (
                <p className="text-xs text-slate-400 italic">No hay clases programadas en la lista para esta fecha.</p>
              ) : (
                <div className="grid grid-cols-1 md:grid-cols-2 lg:grid-cols-3 gap-3">
                  {dayEvents.map(evt => (
                    <div
                      key={'card-' + evt.id}
                      className="p-3.5 rounded-xl bg-white dark:bg-slate-850 border border-slate-200/80 dark:border-slate-700/60 shadow-sm flex items-start justify-between gap-3"
                    >
                      <div className="min-w-0">
                        <div className="flex items-center gap-2">
                          <span className="text-xs font-bold text-accent dark:text-accent-light">
                            {evt.timeStr}
                          </span>
                          <span className="text-[10px] px-1.5 py-0.5 rounded font-bold bg-slate-100 dark:bg-slate-800 text-slate-600 dark:text-slate-300">
                            {evt.duration} min
                          </span>
                        </div>
                        <h5 className="font-bold text-sm text-slate-900 dark:text-white mt-1 break-words whitespace-normal">
                          {evt.title}
                        </h5>
                        <p className="text-xs font-semibold text-slate-600 dark:text-slate-300 break-words whitespace-normal mt-0.5">
                          {evt.subtitle}
                        </p>
                        {evt.location && (
                          <a
                            href={evt.location}
                            target="_blank"
                            rel="noreferrer"
                            className="inline-flex items-center gap-1 text-[11px] text-accent hover:underline mt-1.5 font-medium"
                          >
                            Enlace de reunión <Icons.ExternalLink />
                          </a>
                        )}
                      </div>

                      <div className="flex flex-col items-end gap-1.5 shrink-0">
                        <button
                          onClick={() => onOpenModal({ type: evt.type, item: evt.rawItem })}
                          className="px-2 py-1 text-xs font-semibold rounded-lg bg-slate-100 dark:bg-slate-800 hover:bg-slate-200 dark:hover:bg-slate-700 text-slate-700 dark:text-slate-200"
                        >
                          Editar
                        </button>
                        {evt.type === 'class' && (
                          <button
                            onClick={() => onDeleteClass(evt.rawItem.id)}
                            className="text-xs text-slate-400 hover:text-rose-500 p-1"
                            title="Eliminar"
                          >
                            <Icons.Trash />
                          </button>
                        )}
                      </div>
                    </div>
                  ))}
                </div>
              )}
            </div>

          </div>
        </div>
      );
    }

    // ----------------------------------------------------
    // PESTAÑA 5: PAGOS Y FACTURACIÓN
    // ----------------------------------------------------
    function PaymentsView({ payments, students, searchQuery, onOpenModal, onMarkPaid, onDeletePayment, onCleanDuplicates, onExportCsv }) {
      const [filterStatus, setFilterStatus] = useState('Todos');

      const filteredPayments = useMemo(() => {
        return payments.filter(p => {
          if (filterStatus !== 'Todos' && p.status !== filterStatus) return false;
          if (searchQuery) {
            const q = searchQuery.toLowerCase();
            return p.studentName.toLowerCase().includes(q) || p.invoiceNum.toLowerCase().includes(q) || (p.notes && p.notes.toLowerCase().includes(q));
          }
          return true;
        });
      }, [payments, filterStatus, searchQuery]);

      const totalPaid = payments.filter(p => p.status === 'Pagado').reduce((a, b) => a + Number(b.amount), 0);
      const totalPending = payments.filter(p => p.status === 'Pendiente').reduce((a, b) => a + Number(b.amount), 0);
      const totalOverdue = payments.filter(p => p.status === 'Vencido').reduce((a, b) => a + Number(b.amount), 0);

      return (
        <div className="space-y-6">
          <div className="flex flex-col sm:flex-row sm:items-center justify-between gap-4">
            <div>
              <h2 className="text-xl sm:text-2xl font-bold text-slate-900 dark:text-white">
                Pagos y Facturación
              </h2>
              <p className="text-xs sm:text-sm text-slate-500 dark:text-slate-400">
                Control de cobros de matrícula, emisión de recibos y exportación para contabilidad.
              </p>
            </div>
            <div className="flex flex-wrap items-center gap-2">
              <button
                onClick={onCleanDuplicates}
                title="Eliminar facturas que tengan el mismo alumno, monto y concepto"
                className="inline-flex items-center gap-1.5 px-3 py-2 rounded-xl bg-amber-50 dark:bg-amber-950/40 hover:bg-amber-100 dark:hover:bg-amber-900/60 text-xs font-semibold text-amber-800 dark:text-amber-300 border border-amber-200/80 dark:border-amber-800/60 transition"
              >
                <Icons.Refresh /> Limpiar Duplicados
              </button>
              <button
                onClick={() => onExportCsv('pagos')}
                className="inline-flex items-center gap-1.5 px-3 py-2 rounded-xl bg-slate-100 dark:bg-slate-800 hover:bg-slate-200 dark:hover:bg-slate-700 text-xs font-semibold text-slate-700 dark:text-slate-200 transition"
              >
                <Icons.Download /> Exportar CSV
              </button>
              <button
                onClick={() => onOpenModal({ type: 'payment' })}
                className="inline-flex items-center gap-2 px-4 py-2 rounded-xl bg-accent hover:bg-accent-dark text-white text-xs font-bold shadow-md shadow-accent/20 transition"
              >
                <Icons.Plus /> Registrar Pago / Factura
              </button>
            </div>
          </div>

          {/* Tarjetas de Resumen Financiero */}
          <div className="grid grid-cols-1 sm:grid-cols-3 gap-4">
            <div className="bg-emerald-50 dark:bg-emerald-950/40 border border-emerald-200/80 dark:border-emerald-800/60 p-4 rounded-xl">
              <div className="text-xs font-bold text-emerald-800 dark:text-emerald-300">Total Cobrado</div>
              <div className="text-2xl font-extrabold text-emerald-700 dark:text-emerald-400 mt-1">${totalPaid.toLocaleString()}</div>
              <div className="text-[11px] text-emerald-600 dark:text-emerald-500 mt-0.5">Ingresos liquidados</div>
            </div>

            <div className="bg-amber-50 dark:bg-amber-950/40 border border-amber-200/80 dark:border-amber-800/60 p-4 rounded-xl">
              <div className="text-xs font-bold text-amber-800 dark:text-amber-300">Facturas Pendientes</div>
              <div className="text-2xl font-extrabold text-amber-700 dark:text-amber-400 mt-1">${totalPending.toLocaleString()}</div>
              <div className="text-[11px] text-amber-600 dark:text-amber-500 mt-0.5">Pendiente de cobro</div>
            </div>

            <div className="bg-rose-50 dark:bg-rose-950/40 border border-rose-200/80 dark:border-rose-800/60 p-4 rounded-xl">
              <div className="text-xs font-bold text-rose-800 dark:text-rose-300">Facturas Vencidas</div>
              <div className="text-2xl font-extrabold text-rose-700 dark:text-rose-400 mt-1">${totalOverdue.toLocaleString()}</div>
              <div className="text-[11px] text-rose-600 dark:text-rose-500 mt-0.5">Requiere recordatorio de pago</div>
            </div>
          </div>

          {/* Filtro de Estado */}
          <div className="flex items-center gap-2 bg-white dark:bg-slate-900 p-2.5 rounded-xl border border-slate-200/80 dark:border-slate-800 text-xs">
            <span className="text-slate-400 font-semibold px-1">Filtrar Estado:</span>
            {['Todos', 'Pagado', 'Pendiente', 'Vencido'].map(st => (
              <button
                key={st}
                onClick={() => setFilterStatus(st)}
                className={`px-3 py-1 rounded-lg font-semibold transition ${
                  filterStatus === st
                    ? 'bg-accent text-white'
                    : 'text-slate-600 dark:text-slate-300 hover:bg-slate-100 dark:hover:bg-slate-800'
                }`}
              >
                {st}
              </button>
            ))}
          </div>

          {/* Tabla de Facturación */}
          <div className="bg-white dark:bg-slate-900 rounded-xl border border-slate-200/80 dark:border-slate-800 shadow-sm overflow-x-auto">
            {filteredPayments.length === 0 ? (
              <div className="p-12 text-center">
                <Icons.EmptyBox />
                <h3 className="text-sm font-semibold text-slate-700 dark:text-slate-300">No hay pagos ni facturas</h3>
                <p className="text-xs text-slate-500 mt-1 mb-4">Emite tus primeras facturas o anota cobros recibidos por Bizum, transferencia o efectivo.</p>
                <button
                  onClick={() => onOpenModal({ type: 'payment' })}
                  className="inline-flex items-center gap-1.5 px-4 py-2 rounded-xl bg-emerald-600 hover:bg-emerald-700 text-white text-xs font-bold transition shadow-sm"
                >
                  <Icons.Plus /> Registrar primera factura
                </button>
              </div>
            ) : (
              <table className="w-full text-left text-xs">
                <thead className="bg-slate-50 dark:bg-slate-800/60 border-b border-slate-200/80 dark:border-slate-800 text-slate-500 uppercase font-semibold">
                  <tr>
                    <th className="p-3.5">Nº Factura</th>
                    <th className="p-3.5">Alumno</th>
                    <th className="p-3.5">Importe</th>
                    <th className="p-3.5">Fecha Emisión</th>
                    <th className="p-3.5">Fecha Límite</th>
                    <th className="p-3.5">Método</th>
                    <th className="p-3.5">Estado</th>
                    <th className="p-3.5">Concepto</th>
                    <th className="p-3.5 text-right">Acciones</th>
                  </tr>
                </thead>
                <tbody className="divide-y divide-slate-100 dark:divide-slate-800">
                  {filteredPayments.map(p => (
                    <tr key={p.id} className="hover:bg-slate-50/70 dark:hover:bg-slate-800/40 transition">
                      <td className="p-3.5 font-mono font-bold text-slate-900 dark:text-white">{p.invoiceNum}</td>
                      <td className="p-3.5 font-bold text-slate-800 dark:text-slate-200">{p.studentName}</td>
                      <td className="p-3.5 font-extrabold text-slate-900 dark:text-white">${p.amount}</td>
                      <td className="p-3.5 text-slate-500">{p.date}</td>
                      <td className="p-3.5 text-slate-500">{p.dueDate || '—'}</td>
                      <td className="p-3.5 font-medium text-slate-600 dark:text-slate-300">{p.method}</td>
                      <td className="p-3.5">
                        <span className={`text-[10px] font-bold px-2 py-0.5 rounded-full ${
                          p.status === 'Pagado' ? 'bg-emerald-100 text-emerald-700 dark:bg-emerald-950 dark:text-emerald-300' :
                          p.status === 'Vencido' ? 'bg-rose-100 text-rose-700 dark:bg-rose-950 dark:text-rose-300' :
                          'bg-amber-100 text-amber-700 dark:bg-amber-950 dark:text-amber-300'
                        }`}>
                          {p.status}
                        </span>
                      </td>
                      <td className="p-3.5 text-slate-500 max-w-xs truncate">{p.notes || '—'}</td>
                      <td className="p-3.5 text-right space-x-2">
                        {p.status !== 'Pagado' && (
                          <button
                            onClick={() => onMarkPaid(p.id)}
                            className="px-2 py-1 bg-emerald-100 text-emerald-700 dark:bg-emerald-950 dark:text-emerald-300 rounded font-bold hover:bg-emerald-200 transition"
                          >
                            Marcar Pagado
                          </button>
                        )}
                        <button
                          onClick={() => onOpenModal({ type: 'payment', item: p })}
                          className="text-accent dark:text-accent-light hover:underline font-semibold"
                        >
                          Editar
                        </button>
                        <button
                          onClick={() => onDeletePayment(p.id)}
                          className="text-slate-400 hover:text-rose-500"
                        >
                          <Icons.Trash />
                        </button>
                      </td>
                    </tr>
                  ))}
                </tbody>
              </table>
            )}
          </div>
        </div>
      );
    }

    // ----------------------------------------------------
    // PESTAÑA 6: INFORMES Y RENDIMIENTO
    // ----------------------------------------------------
    function ReportsView({ data, kpis, onExportJson, onExportCsv }) {
      const subjectDistribution = useMemo(() => {
        const counts = {};
        data.classes.forEach(c => {
          counts[c.subject] = (counts[c.subject] || 0) + (Number(c.durationMinutes) / 60);
        });
        return Object.entries(counts);
      }, [data.classes]);

      const studentRevenue = useMemo(() => {
        const map = {};
        data.payments.forEach(p => {
          map[p.studentName] = (map[p.studentName] || 0) + Number(p.amount);
        });
        return Object.entries(map).sort((a, b) => b[1] - a[1]);
      }, [data.payments]);

      return (
        <div className="space-y-6">
          <div className="flex flex-col sm:flex-row sm:items-center justify-between gap-4">
            <div>
              <h2 className="text-xl sm:text-2xl font-bold text-slate-900 dark:text-white">
                Informes y Rendimiento Académico
              </h2>
              <p className="text-xs sm:text-sm text-slate-500 dark:text-slate-400">
                Métricas financieras consolidadas, distribución horaria y valor acumulado por alumno.
              </p>
            </div>
            <div className="flex items-center gap-2">
              <button
                onClick={onExportJson}
                className="inline-flex items-center gap-1.5 px-3 py-2 rounded-xl bg-slate-100 dark:bg-slate-800 hover:bg-slate-200 dark:hover:bg-slate-700 text-xs font-semibold text-slate-700 dark:text-slate-200 transition"
              >
                <Icons.Download /> Descargar Respaldo JSON
              </button>
              <button
                onClick={() => onExportCsv('pagos')}
                className="inline-flex items-center gap-1.5 px-3 py-2 rounded-xl bg-accent hover:bg-accent-dark text-white text-xs font-bold transition shadow-md shadow-accent/20"
              >
                <Icons.Download /> Exportar Pagos CSV
              </button>
            </div>
          </div>

          {/* Tarjetas de Métricas de Alto Nivel */}
          <div className="grid grid-cols-2 md:grid-cols-4 gap-4">
            <div className="bg-white dark:bg-slate-900 p-5 rounded-xl border border-slate-200/80 dark:border-slate-800 shadow-sm">
              <div className="text-xs text-slate-400 font-semibold">Total Facturado</div>
              <div className="text-2xl font-black text-slate-900 dark:text-white mt-1.5">
                ${(kpis.totalPaid + kpis.totalPending).toLocaleString()}
              </div>
              <div className="text-[11px] text-emerald-500 mt-1 font-medium">
                ${kpis.totalPaid.toLocaleString()} cobrado
              </div>
            </div>

            <div className="bg-white dark:bg-slate-900 p-5 rounded-xl border border-slate-200/80 dark:border-slate-800 shadow-sm">
              <div className="text-xs text-slate-400 font-semibold">Ingreso Medio por Sesión</div>
              <div className="text-2xl font-black text-slate-900 dark:text-white mt-1.5">
                ${data.bookings.length > 0 ? Math.round(kpis.totalPaid / data.bookings.length) : 0}
              </div>
              <div className="text-[11px] text-slate-400 mt-1">Por sesión reservada</div>
            </div>

            <div className="bg-white dark:bg-slate-900 p-5 rounded-xl border border-slate-200/80 dark:border-slate-800 shadow-sm">
              <div className="text-xs text-slate-400 font-semibold">Horas Docentes Totales</div>
              <div className="text-2xl font-black text-slate-900 dark:text-white mt-1.5">
                {kpis.totalTeachingHours.toFixed(1)} h
              </div>
              <div className="text-[11px] text-accent mt-1">En todas las materias activas</div>
            </div>

            <div className="bg-white dark:bg-slate-900 p-5 rounded-xl border border-slate-200/80 dark:border-slate-800 shadow-sm">
              <div className="text-xs text-slate-400 font-semibold">Rendimiento por Hora</div>
              <div className="text-2xl font-black text-emerald-600 dark:text-emerald-400 mt-1.5">
                ${kpis.totalTeachingHours > 0 ? Math.round(kpis.totalPaid / kpis.totalTeachingHours) : 0}/h
              </div>
              <div className="text-[11px] text-slate-400 mt-1">Tarifa base: ${data.user.hourlyRate}/h</div>
            </div>
          </div>

          {/* Gráficos */}
          <div className="grid grid-cols-1 md:grid-cols-2 gap-6">
            
            {/* Distribución de Horas por Materia */}
            <div className="bg-white dark:bg-slate-900 p-5 rounded-xl border border-slate-200/80 dark:border-slate-800 shadow-sm">
              <h3 className="font-bold text-sm text-slate-900 dark:text-white mb-4">
                Horas Semanales Impartidas por Materia
              </h3>
              {subjectDistribution.length === 0 ? (
                <p className="text-xs text-slate-400 py-8 text-center italic">No hay clases registradas aún.</p>
              ) : (
                <div className="space-y-4">
                  {subjectDistribution.map(([subject, hours]) => {
                    const maxHours = Math.max(...subjectDistribution.map(s => s[1]), 5);
                    const pct = Math.min(100, Math.round((hours / maxHours) * 100));
                    return (
                      <div key={subject}>
                        <div className="flex justify-between text-xs font-semibold mb-1">
                          <span className="text-slate-700 dark:text-slate-300">{subject}</span>
                          <span className="text-accent dark:text-accent-light">{hours.toFixed(1)} h/semana</span>
                        </div>
                        <div className="w-full h-3 bg-slate-100 dark:bg-slate-800 rounded-full overflow-hidden">
                          <div
                            className="h-full bg-accent rounded-full transition-all duration-500"
                            style={{ width: `${pct}%` }}
                          ></div>
                        </div>
                      </div>
                    );
                  })}
                </div>
              )}
            </div>

            {/* Ranking de Alumnos */}
            <div className="bg-white dark:bg-slate-900 p-5 rounded-xl border border-slate-200/80 dark:border-slate-800 shadow-sm">
              <h3 className="font-bold text-sm text-slate-900 dark:text-white mb-4">
                Ranking de Alumnos por Facturación Histórica
              </h3>
              {studentRevenue.length === 0 ? (
                <p className="text-xs text-slate-400 py-8 text-center italic">No hay pagos registrados aún.</p>
              ) : (
                <div className="space-y-3">
                  {studentRevenue.map(([name, amount], idx) => (
                    <div key={name} className="flex items-center justify-between p-2.5 rounded-lg bg-slate-50 dark:bg-slate-800/40 text-xs">
                      <div className="flex items-center gap-2.5">
                        <span className="w-5 h-5 rounded-full bg-accent/10 dark:bg-accent/20 text-accent-dark dark:text-accent-light font-bold flex items-center justify-center text-[10px]">
                          #{idx + 1}
                        </span>
                        <span className="font-bold text-slate-800 dark:text-slate-200">{name}</span>
                      </div>
                      <span className="font-extrabold text-slate-900 dark:text-white">
                        ${amount.toLocaleString()}
                      </span>
                    </div>
                  ))}
                </div>
              )}
            </div>

          </div>

          {/* Información de Privacidad y Almacenamiento */}
          <div className="bg-slate-100 dark:bg-slate-900/60 p-5 rounded-xl border border-slate-200 dark:border-slate-800 text-xs text-slate-600 dark:text-slate-400 space-y-2">
            <h4 className="font-bold text-slate-900 dark:text-white text-sm flex items-center gap-2">
              🛡️ Privacidad y Almacenamiento Local Seguro
            </h4>
            <p>
              Esta aplicación funciona íntegramente en tu equipo local, sin rastreo externo ni bases de datos en la nube. Todas las operaciones y datos se sincronizan directamente en el <code className="bg-slate-200 dark:bg-slate-800 px-1 py-0.5 rounded">localStorage</code> de tu navegador bajo la clave <code className="bg-slate-200 dark:bg-slate-800 px-1 py-0.5 rounded">roberto_dashboard_v3_clean</code>.
            </p>
            <p>
              Utiliza el botón <strong>Descargar Respaldo JSON</strong> para guardar una copia de tus registros o <strong>Exportar CSV</strong> para importar pagos directamente en hojas de cálculo o programas de contabilidad.
            </p>
          </div>
        </div>
      );

    function RestoreDiagnosticsView({ scan, currentClassesCount, onRestore, onClose }) {
      const { reports = [], mergedClasses = [], mergedBookings = [] } = scan || {};
      const sortedReports = [...reports].sort((a, b) => b.classCount - a.classCount);

      return (
        <div className="space-y-4 text-xs">
          <div className="p-3.5 rounded-xl bg-blue-50 dark:bg-blue-950/40 border border-blue-200 dark:border-blue-900 text-blue-800 dark:text-blue-300 space-y-1">
            <div className="font-bold flex items-center gap-2">
              <Icons.Refresh /> Clases encontradas en el historial del navegador
            </div>
            <p className="text-[11px] leading-relaxed">
              El explorador analizó todas las versiones y copias guardadas en este navegador. Se encontraron un total de <strong>{mergedClasses.length} clases únicas</strong> registradas por ti.
            </p>
          </div>

          <div className="border border-slate-200 dark:border-slate-800 rounded-xl overflow-hidden divide-y divide-slate-100 dark:divide-slate-800 max-h-56 overflow-y-auto">
            {sortedReports.map((r, i) => (
              <div key={r.key} className="p-3 flex items-center justify-between bg-white dark:bg-slate-900 hover:bg-slate-50 dark:hover:bg-slate-800/50 transition">
                <div>
                  <div className="font-mono text-[11px] font-bold text-slate-800 dark:text-slate-200">{r.key}</div>
                  <div className="text-[10px] text-slate-400">
                    {r.classCount} clases • {r.bookingCount} reservas
                  </div>
                </div>
                {r.classCount > 0 && (
                  <button
                    onClick={() => onRestore(r.data.classes || [], r.data.bookings || [])}
                    className="px-2.5 py-1 text-[11px] font-bold rounded-lg bg-slate-100 hover:bg-slate-200 dark:bg-slate-800 dark:hover:bg-slate-700 text-slate-700 dark:text-slate-300 transition"
                  >
                    Restaurar solo esta ({r.classCount})
                  </button>
                )}
              </div>
            ))}
          </div>

          <div className="pt-2 flex flex-col sm:flex-row gap-2.5 justify-end">
            <button
              type="button"
              onClick={onClose}
              className="px-4 py-2.5 rounded-xl bg-slate-100 dark:bg-slate-800 text-slate-700 dark:text-slate-300 font-semibold"
            >
              Cerrar
            </button>
            <button
              type="button"
              onClick={() => onRestore(mergedClasses, mergedBookings)}
              className="px-5 py-2.5 rounded-xl bg-accent hover:bg-accent-dark text-white font-extrabold shadow-md shadow-accent/20 transition flex items-center justify-center gap-2"
            >
              <Icons.Check /> Restaurar y Fusionar Todas ({mergedClasses.length} clases)
            </button>
          </div>
        </div>
      );
    }

    function ModalDialog({ modal, data, onClose, onSaveTask, onSaveClass, onSaveStudent, onSaveBooking, onSavePayment, onApplyRestoredClasses }) {
      const { type, item } = modal;

      useEffect(() => {
        const handleKeyDown = (e) => {
          if (e.key === 'Escape') onClose();
        };
        window.addEventListener('keydown', handleKeyDown);
        return () => window.removeEventListener('keydown', handleKeyDown);
      }, [onClose]);

      const titles = {
        task: item ? 'Editar Tarea' : 'Nueva Tarea',
        class: item ? 'Editar Clase' : 'Programar Nueva Clase',
        student: item ? 'Editar Alumno' : 'Nuevo Alumno',
        booking: item ? 'Editar Reserva' : 'Nueva Reserva de Clase',
        payment: item ? 'Editar Pago / Factura' : 'Registrar Pago / Factura',
        restore_diagnostics: 'Recuperar Clases desde el Historial del Navegador'
      };

      return (
        <div className="fixed inset-0 z-50 flex items-center justify-center p-4 bg-primary/60 backdrop-blur-sm">
          <div className="bg-white dark:bg-slate-900 w-full max-w-lg rounded-2xl p-6 shadow-2xl border border-slate-200 dark:border-slate-800 overflow-y-auto max-h-[90vh]">
            
            <div className="flex items-center justify-between pb-4 border-b border-slate-100 dark:border-slate-800">
              <h3 className="font-bold text-lg text-slate-900 dark:text-white">
                {titles[type] || 'Formulario'}
              </h3>
              <button onClick={onClose} className="text-slate-400 hover:text-slate-600 dark:hover:text-slate-200 text-lg">✕</button>
            </div>

            <div className="py-4">
              <ErrorBoundary>
                {type === 'task' && (
                  <TaskForm item={item} onSave={onSaveTask} onCancel={onClose} />
                )}
                {type === 'class' && (
                  <ClassForm item={item} defaultDate={modal?.defaultDate} students={data?.students || []} onSave={onSaveClass} onCancel={onClose} />
                )}
                {type === 'student' && (
                  <StudentForm item={item} onSave={onSaveStudent} onCancel={onClose} />
                )}
                {type === 'booking' && (
                  <BookingForm item={item} students={data?.students || []} classes={data?.classes || []} onSave={onSaveBooking} onCancel={onClose} />
                )}
                {type === 'payment' && (
                  <PaymentForm item={item} students={data?.students || []} onSave={onSavePayment} onCancel={onClose} />
                )}
                {type === 'restore_diagnostics' && (
                  <RestoreDiagnosticsView
                    scan={modal.scan}
                    currentClassesCount={(data?.classes || []).length}
                    onRestore={onApplyRestoredClasses}
                    onClose={onClose}
                  />
                )}
              </ErrorBoundary>
            </div>

          </div>
        </div>
      );
    }
