            {/* Ranking de Alumnos */}
            <div className="bg-white dark:bg-slate-900 p-5 rounded-xl border border-slate-200/80 dark:border-slate-800 shadow-sm">
              <h3 className="font-bold text-sm text-slate-900 dark:text-white mb-4">
                Ranking de Alumnos por Facturación Histórica
              </h3>
              {studentRevenue.length === 0 ? (
                <p className="text-xs text-slate-400 py-8 text-center italic">No hay pagos registrados aún.</p>
              ) : (
                <div className="space-y-3">
                  {studentRevenue.map(([name, amount], idx) => (
                    <div key={name} className="flex items-center justify-between p-2.5 rounded-lg bg-slate-50 dark:bg-slate-800/40 text-xs">
                      <div className="flex items-center gap-2.5">
                        <span className="w-5 h-5 rounded-full bg-accent/10 dark:bg-accent/20 text-accent-dark dark:text-accent-light font-bold flex items-center justify-center text-[10px]">
                          #{idx + 1}
                        </span>
                        <span className="font-bold text-slate-800 dark:text-slate-200">{name}</span>
                      </div>
                      <span className="font-extrabold text-slate-900 dark:text-white">
                        ${amount.toLocaleString()}
                      </span>
                    </div>
                  ))}
                </div>
              )}
            </div>

          </div>

          {/* Información de Privacidad y Almacenamiento */}
          <div className="bg-slate-100 dark:bg-slate-900/60 p-5 rounded-xl border border-slate-200 dark:border-slate-800 text-xs text-slate-600 dark:text-slate-400 space-y-2">
            <h4 className="font-bold text-slate-900 dark:text-white text-sm flex items-center gap-2">
              🛡️ Privacidad y Almacenamiento Local Seguro
            </h4>
            <p>
              Esta aplicación funciona íntegramente en tu equipo local, sin rastreo externo ni bases de datos en la nube. Todas las operaciones y datos se sincronizan directamente en el <code className="bg-slate-200 dark:bg-slate-800 px-1 py-0.5 rounded">localStorage</code> de tu navegador bajo la clave <code className="bg-slate-200 dark:bg-slate-800 px-1 py-0.5 rounded">roberto_dashboard_v3_clean</code>.
            </p>
            <p>
              Utiliza el botón <strong>Descargar Respaldo JSON</strong> para guardar una copia de tus registros o <strong>Exportar CSV</strong> para importar pagos directamente en hojas de cálculo o programas de contabilidad.
            </p>
          </div>
        </div>
      );
    }

    // ----------------------------------------------------
    // COMPONENTE MODAL UNIFICADO
    // ----------------------------------------------------
    function ModalDialog({ modal, data, onClose, onSaveTask, onSaveClass, onSaveStudent, onSaveBooking, onSavePayment }) {
      const { type, item } = modal;

      useEffect(() => {
        const handleKeyDown = (e) => {
          if (e.key === 'Escape') onClose();
        };
        window.addEventListener('keydown', handleKeyDown);
        return () => window.removeEventListener('keydown', handleKeyDown);
      }, [onClose]);

      const titles = {
        task: item ? 'Editar Tarea' : 'Nueva Tarea',
        class: item ? 'Editar Clase' : 'Programar Nueva Clase',
        student: item ? 'Editar Alumno' : 'Nuevo Alumno',
        booking: item ? 'Editar Reserva' : 'Nueva Reserva de Clase',
        payment: item ? 'Editar Pago / Factura' : 'Registrar Pago / Factura'
      };

      return (
        <div className="fixed inset-0 z-50 flex items-center justify-center p-4 bg-primary/60 backdrop-blur-sm">
          <div className="bg-white dark:bg-slate-900 w-full max-w-lg rounded-2xl p-6 shadow-2xl border border-slate-200 dark:border-slate-800 overflow-y-auto max-h-[90vh]">
            
            <div className="flex items-center justify-between pb-4 border-b border-slate-100 dark:border-slate-800">
              <h3 className="font-bold text-lg text-slate-900 dark:text-white">
                {titles[type] || 'Formulario'}
              </h3>
              <button onClick={onClose} className="text-slate-400 hover:text-slate-600 dark:hover:text-slate-200 text-lg">✕</button>
            </div>

            <div className="py-4">
              {type === 'task' && (
                <TaskForm item={item} onSave={onSaveTask} onCancel={onClose} />
              )}
              {type === 'class' && (
                <ClassForm item={item} defaultDate={modal.defaultDate} students={data.students} onSave={onSaveClass} onCancel={onClose} />
              )}
              {type === 'student' && (
                <StudentForm item={item} onSave={onSaveStudent} onCancel={onClose} />
              )}
              {type === 'booking' && (
                <BookingForm item={item} students={data.students} classes={data.classes} onSave={onSaveBooking} onCancel={onClose} />
              )}
              {type === 'payment' && (
                <PaymentForm item={item} students={data.students} onSave={onSavePayment} onCancel={onClose} />
              )}
            </div>

          </div>
        </div>
      );
    }

    // ----------------------------------------------------
    // FORMULARIOS EN ESPAÑOL
    // ----------------------------------------------------

    function TaskForm({ item, onSave, onCancel }) {
      const [title, setTitle] = useState(item ? item.title : '');
      const [category, setCategory] = useState(item ? item.category : 'Preparación');
      const [priority, setPriority] = useState(item ? item.priority : 'Media');
      const [status, setStatus] = useState(item ? item.status : 'pendiente');
      const [dueDate, setDueDate] = useState(item ? item.dueDate : new Date().toISOString().slice(0, 10));
      const [time, setTime] = useState(item?.time || '');
      const [notes, setNotes] = useState(item ? item.notes : '');

      const handleSubmit = (e) => {
        e.preventDefault();
        if (!title.trim()) return alert("Por favor, introduce el título de la tarea");
        onSave({ id: item?.id, title, category, priority, status, dueDate, time, notes });
      };

      return (
        <form onSubmit={handleSubmit} className="space-y-4 text-xs">
          <div>
            <label className="font-semibold block mb-1">Título de la Tarea *</label>
            <input
              type="text"
              value={title}
              onChange={(e) => setTitle(e.target.value)}
              placeholder="p. ej., Preparar ejercicios de gramática"
              className="w-full px-3 py-2 rounded-lg bg-slate-50 dark:bg-slate-800 border border-slate-200 dark:border-slate-700 outline-none focus:ring-2 focus:ring-accent"
              required
            />
          </div>

          <div className="grid grid-cols-2 gap-3">
            <div>
              <label className="font-semibold block mb-1">Categoría</label>
              <select
                value={category}
                onChange={(e) => setCategory(e.target.value)}
                className="w-full px-3 py-2 rounded-lg bg-slate-50 dark:bg-slate-800 border border-slate-200 dark:border-slate-700 outline-none"
              >
                {['Preparación', 'Calificaciones', 'Administración', 'Seguimiento', 'Currículo', 'Personal'].map(c => <option key={c} value={c}>{c}</option>)}
              </select>
            </div>
            <div>
              <label className="font-semibold block mb-1">Prioridad</label>
              <select
                value={priority}
                onChange={(e) => setPriority(e.target.value)}
                className="w-full px-3 py-2 rounded-lg bg-slate-50 dark:bg-slate-800 border border-slate-200 dark:border-slate-700 outline-none"
              >
                {['Urgente', 'Alta', 'Media', 'Baja'].map(p => <option key={p} value={p}>{p}</option>)}
              </select>
            </div>
          </div>

          <div className="grid grid-cols-3 gap-3">
            <div>
              <label className="font-semibold block mb-1">Fecha Límite</label>
              <input
                type="date"
                value={dueDate}
                onChange={(e) => setDueDate(e.target.value)}
                className="w-full px-3 py-2 rounded-lg bg-slate-50 dark:bg-slate-800 border border-slate-200 dark:border-slate-700 outline-none"
              />
            </div>
            <div>
              <label className="font-semibold block mb-1">Hora (Opcional)</label>
              <input
                type="time"
                value={time}
                onChange={(e) => setTime(e.target.value)}
                className="w-full px-3 py-2 rounded-lg bg-slate-50 dark:bg-slate-800 border border-slate-200 dark:border-slate-700 outline-none"
              />
            </div>
            <div>
              <label className="font-semibold block mb-1">Estado</label>
              <select
                value={status}
                onChange={(e) => setStatus(e.target.value)}
                className="w-full px-3 py-2 rounded-lg bg-slate-50 dark:bg-slate-800 border border-slate-200 dark:border-slate-700 outline-none"
              >
                <option value="pendiente">Pendiente</option>
                <option value="en_progreso">En Progreso</option>
                <option value="completada">Completada</option>
              </select>
            </div>
          </div>

          <div>
            <label className="font-semibold block mb-1">Notas y Detalles</label>
            <textarea
              rows="3"
              value={notes}
              onChange={(e) => setNotes(e.target.value)}
              placeholder="Puntos clave, enlaces a materiales o recordatorios..."
              className="w-full px-3 py-2 rounded-lg bg-slate-50 dark:bg-slate-800 border border-slate-200 dark:border-slate-700 outline-none"
            ></textarea>
          </div>

          <div className="flex justify-end gap-2 pt-2">
            <button type="button" onClick={onCancel} className="px-4 py-2 rounded-lg bg-slate-100 dark:bg-slate-800 font-semibold">Cancelar</button>
            <button type="submit" className="px-4 py-2 rounded-lg bg-accent hover:bg-accent-dark text-white font-bold">Guardar Tarea</button>
          </div>
        </form>
      );
    }

    function ClassForm({ item, defaultDate, students, onSave, onCancel }) {
      const [name, setName] = useState(item ? item.name : '');
      const [subject, setSubject] = useState(item ? item.subject : '');
      const [dayOfWeek, setDayOfWeek] = useState(item ? item.dayOfWeek : 'Lunes');
      const [date, setDate] = useState(item?.date || defaultDate || new Date().toISOString().slice(0, 10));
      const [time, setTime] = useState(item ? item.time : '10:00');
      const [durationMinutes, setDurationMinutes] = useState(item ? item.durationMinutes : 60);
      const [location, setLocation] = useState(item ? item.location : '');
      const [capacity, setCapacity] = useState(item ? item.capacity : 1);
      const [description, setDescription] = useState(item ? item.description : '');
      const [enrolledStudentIds, setEnrolledStudentIds] = useState(item ? item.enrolledStudentIds || [] : []);
      const [autoInvoice, setAutoInvoice] = useState(!item); // Solo true por defecto si es nueva

      const toggleStudent = (id) => {
        setEnrolledStudentIds(prev => prev.includes(id) ? prev.filter(x => x !== id) : [...prev, id]);
      };

      const handleSubmit = (e) => {
        e.preventDefault();
        if (!name.trim()) return alert("El nombre de la clase es obligatorio");
        onSave({
          id: item?.id,
          name,
          subject: subject || 'General',
          dayOfWeek,
          date,
          time,
          durationMinutes: Number(durationMinutes),
          location,
          capacity: Number(capacity),
          description,
          enrolledStudentIds,
          status: item?.status || 'Programada',
          autoInvoice
        });
      };

      return (
        <form onSubmit={handleSubmit} className="space-y-4 text-xs">
          <div>
            <label className="font-semibold block mb-1">Nombre de la Clase *</label>
            <input
              type="text"
              value={name}
              onChange={(e) => setName(e.target.value)}
              placeholder="p. ej., Francés Conversacional B1"
              className="w-full px-3 py-2 rounded-lg bg-slate-50 dark:bg-slate-800 border border-slate-200 dark:border-slate-700 outline-none"
              required
            />
          </div>

          <div className="grid grid-cols-3 gap-3">
            <div>
              <label className="font-semibold block mb-1">Materia / Asignatura</label>
              <input
                type="text"
                value={subject}
                onChange={(e) => setSubject(e.target.value)}
                placeholder="p. ej., Idiomas"
                className="w-full px-3 py-2 rounded-lg bg-slate-50 dark:bg-slate-800 border border-slate-200 dark:border-slate-700 outline-none"
              />
            </div>
            <div>
              <label className="font-semibold block mb-1">Fecha</label>
              <input
                type="date"
                value={date}
                onChange={(e) => {
                  setDate(e.target.value);
                  const d = new Date(e.target.value);
                  const days = ['Domingo', 'Lunes', 'Martes', 'Miércoles', 'Jueves', 'Viernes', 'Sábado'];
                  setDayOfWeek(days[d.getUTCDay()]);
                }}
                className="w-full px-3 py-2 rounded-lg bg-slate-50 dark:bg-slate-800 border border-slate-200 dark:border-slate-700 outline-none"
              />
            </div>
            <div>
              <label className="font-semibold block mb-1">Día de la Semana</label>
              <select
                value={dayOfWeek}
                onChange={(e) => setDayOfWeek(e.target.value)}
                className="w-full px-3 py-2 rounded-lg bg-slate-50 dark:bg-slate-800 border border-slate-200 dark:border-slate-700 outline-none"
              >
                {['Lunes', 'Martes', 'Miércoles', 'Jueves', 'Viernes', 'Sábado', 'Domingo'].map(d => <option key={d} value={d}>{d}</option>)}
              </select>
            </div>
          </div>

          <div className="grid grid-cols-3 gap-3">
            <div>
              <label className="font-semibold block mb-1">Hora de inicio</label>
              <input
                type="time"
                value={time}
                onChange={(e) => setTime(e.target.value)}
                className="w-full px-3 py-2 rounded-lg bg-slate-50 dark:bg-slate-800 border border-slate-200 dark:border-slate-700 outline-none"
              />
            </div>
            <div>
              <label className="font-semibold block mb-1">Duración (min)</label>
              <input
                type="number"
                value={durationMinutes}
                onChange={(e) => setDurationMinutes(e.target.value)}
                className="w-full px-3 py-2 rounded-lg bg-slate-50 dark:bg-slate-800 border border-slate-200 dark:border-slate-700 outline-none"
              />
            </div>
            <div>
              <label className="font-semibold block mb-1">Cupo Máximo</label>
              <input
                type="number"
                value={capacity}
                onChange={(e) => setCapacity(e.target.value)}
                className="w-full px-3 py-2 rounded-lg bg-slate-50 dark:bg-slate-800 border border-slate-200 dark:border-slate-700 outline-none"
              />
            </div>
          </div>

          <div>
            <label className="font-semibold block mb-1">Enlace de Videollamada (Zoom / Meet opcional)</label>
            <input
              type="text"
              value={location}
              onChange={(e) => setLocation(e.target.value)}
              placeholder="https://zoom.us/..."
              className="w-full px-3 py-2 rounded-lg bg-slate-50 dark:bg-slate-800 border border-slate-200 dark:border-slate-700 outline-none"
            />
          </div>

          <div>
            <label className="font-semibold block mb-1">Inscribir Alumnos</label>
            {students.length === 0 ? (
              <p className="text-[11px] text-slate-400 p-2 bg-slate-50 dark:bg-slate-800/40 rounded-lg italic">
                Aún no has registrado alumnos. Podrás inscribirlos más adelante.
              </p>
            ) : (
              <div className="flex flex-wrap gap-2 max-h-28 overflow-y-auto p-2 bg-slate-50 dark:bg-slate-800/60 rounded-lg border border-slate-200 dark:border-slate-700">
                {students.map(s => {
                  const checked = enrolledStudentIds.includes(s.id);
                  return (
                    <button
                      key={s.id}
                      type="button"
                      onClick={() => toggleStudent(s.id)}
                      className={`px-2 py-1 rounded-md text-[11px] font-semibold transition ${
                        checked
                          ? 'bg-accent text-white'
                          : 'bg-slate-200 dark:bg-slate-700 text-slate-700 dark:text-slate-300'
                      }`}
                    >
                      {checked ? '✓ ' : '+ '}{s.name}
                    </button>
                  );
                })}
              </div>
            )}
          </div>

          <div>
            <label className="font-semibold block mb-1">Descripción y Contenidos</label>
            <textarea
              rows="2"
              value={description}
              onChange={(e) => setDescription(e.target.value)}
              placeholder="Objetivos de la clase, materiales necesarios..."
              className="w-full px-3 py-2 rounded-lg bg-slate-50 dark:bg-slate-800 border border-slate-200 dark:border-slate-700 outline-none"
            ></textarea>
          </div>

          {!item && (
            <div className="flex items-center gap-2 p-3 bg-emerald-50 dark:bg-emerald-950/30 rounded-lg border border-emerald-100 dark:border-emerald-900/50">
              <input 
                type="checkbox" 
                id="autoInvoiceCheck"
                checked={autoInvoice} 
                onChange={(e) => setAutoInvoice(e.target.checked)} 
                className="w-4 h-4 accent-emerald-600"
              />
              <label htmlFor="autoInvoiceCheck" className="text-xs font-semibold text-emerald-800 dark:text-emerald-300 cursor-pointer">
                Generar facturas pendientes automáticamente para los alumnos inscritos al crear esta clase
              </label>
            </div>
          )}

          <div className="flex justify-end gap-2 pt-2">
            <button type="button" onClick={onCancel} className="px-4 py-2 rounded-lg bg-slate-100 dark:bg-slate-800 font-semibold">Cancelar</button>
            <button type="submit" className="px-4 py-2 rounded-lg bg-accent hover:bg-accent-dark text-white font-bold">Guardar Clase</button>
          </div>
        </form>
      );
    }

    function StudentForm({ item, onSave, onCancel }) {
      const [name, setName] = useState(item ? item.name : '');
      const [email, setEmail] = useState(item ? item.email : '');
      const [phone, setPhone] = useState(item ? item.phone : '');
      const [hourlyRate, setHourlyRate] = useState(item ? item.hourlyRate : 1500);
      const [status, setStatus] = useState(item ? item.status : 'Activo');
      const [balanceDue, setBalanceDue] = useState(item ? item.balanceDue : 0);
      const [notes, setNotes] = useState(item ? item.notes : '');

      const handleSubmit = (e) => {
        e.preventDefault();
        if (!name.trim()) return alert("El nombre del alumno es obligatorio");
        onSave({
          id: item?.id,
          name,
          email,
          phone,
          hourlyRate: Number(hourlyRate),
          status,
          balanceDue: Number(balanceDue),
          notes
        });
      };

      return (
        <form onSubmit={handleSubmit} className="space-y-4 text-xs">
          <div>
            <label className="font-semibold block mb-1">Nombre Completo del Alumno *</label>
            <input
              type="text"
              value={name}
              onChange={(e) => setName(e.target.value)}
              placeholder="p. ej., Carlos Mendoza"
              className="w-full px-3 py-2 rounded-lg bg-slate-50 dark:bg-slate-800 border border-slate-200 dark:border-slate-700 outline-none"
              required
            />
          </div>

          <div className="grid grid-cols-2 gap-3">
            <div>
              <label className="font-semibold block mb-1">Correo Electrónico</label>
              <input
                type="email"
                value={email}
                onChange={(e) => setEmail(e.target.value)}
                placeholder="alumno@ejemplo.com"
                className="w-full px-3 py-2 rounded-lg bg-slate-50 dark:bg-slate-800 border border-slate-200 dark:border-slate-700 outline-none"
              />
            </div>
            <div>
              <label className="font-semibold block mb-1">Teléfono de Contacto</label>
              <input
                type="text"
                value={phone}
                onChange={(e) => setPhone(e.target.value)}
                placeholder="+34 600 000 000"
                className="w-full px-3 py-2 rounded-lg bg-slate-50 dark:bg-slate-800 border border-slate-200 dark:border-slate-700 outline-none"
              />
            </div>
          </div>

          <div className="grid grid-cols-3 gap-3">
            <div>
              <label className="font-semibold block mb-1">Tarifa por Hora ($)</label>
              <input
                type="number"
                value={hourlyRate}
                onChange={(e) => setHourlyRate(e.target.value)}
                className="w-full px-3 py-2 rounded-lg bg-slate-50 dark:bg-slate-800 border border-slate-200 dark:border-slate-700 outline-none"
              />
            </div>
            <div>
              <label className="font-semibold block mb-1">Estado</label>
              <select
                value={status}
                onChange={(e) => setStatus(e.target.value)}
                className="w-full px-3 py-2 rounded-lg bg-slate-50 dark:bg-slate-800 border border-slate-200 dark:border-slate-700 outline-none"
              >
                <option value="Activo">Activo</option>
                <option value="Inactivo">Inactivo</option>
              </select>
            </div>
            <div>
              <label className="font-semibold block mb-1">Saldo Pendiente ($)</label>
              <input
                type="number"
                value={balanceDue}
                onChange={(e) => setBalanceDue(e.target.value)}
                className="w-full px-3 py-2 rounded-lg bg-slate-50 dark:bg-slate-800 border border-slate-200 dark:border-slate-700 outline-none"
              />
            </div>
          </div>

          <div>
            <label className="font-semibold block mb-1">Notas Pedagógicas y Observaciones</label>
            <textarea
              rows="3"
              value={notes}
              onChange={(e) => setNotes(e.target.value)}
              placeholder="Puntos fuertes, áreas de mejora, preferencias de horario..."
              className="w-full px-3 py-2 rounded-lg bg-slate-50 dark:bg-slate-800 border border-slate-200 dark:border-slate-700 outline-none"
            ></textarea>
          </div>

          <div className="flex justify-end gap-2 pt-2">
            <button type="button" onClick={onCancel} className="px-4 py-2 rounded-lg bg-slate-100 dark:bg-slate-800 font-semibold">Cancelar</button>
            <button type="submit" className="px-4 py-2 rounded-lg bg-accent hover:bg-accent-dark text-white font-bold">Guardar Alumno</button>
          </div>
        </form>
      );
    }

    function BookingForm({ item, students, classes, onSave, onCancel }) {
      const [studentId, setStudentId] = useState(item ? item.studentId : (students[0]?.id || ''));
      const [studentName, setStudentName] = useState(item ? item.studentName : (students[0]?.name || ''));
      const [classId, setClassId] = useState(item ? item.classId : (classes[0]?.id || 'custom'));
      const [className, setClassName] = useState(item ? item.className : (classes[0]?.name || 'Sesión Privada 1 a 1'));
      const [date, setDate] = useState(item ? item.date : new Date().toISOString().slice(0, 10));
      const [time, setTime] = useState(item ? item.time : '10:00');
      const [duration, setDuration] = useState(item ? item.duration : 60);
      const [rate, setRate] = useState(item ? item.rate : (students[0]?.hourlyRate || 1500));
      const [status, setStatus] = useState(item ? item.status : 'Confirmada');
      const [paymentStatus, setPaymentStatus] = useState(item ? item.paymentStatus : 'Pendiente');

      const handleStudentSelect = (e) => {
        const sid = e.target.value;
        setStudentId(sid);
        const s = students.find(x => x.id === sid);
        if (s) {
          setStudentName(s.name);
          setRate(s.hourlyRate);
        }
      };

      const handleClassChange = (e) => {
        const cid = e.target.value;
        setClassId(cid);
        const sel = classes.find(c => c.id === cid);
        if (sel) {
          setClassName(sel.name);
          setDuration(sel.durationMinutes);
        } else {
          setClassName('Sesión Privada 1 a 1');
        }
      };

      const handleSubmit = (e) => {
        e.preventDefault();
        const finalName = studentName.trim() || (students.find(s => s.id === studentId)?.name) || 'Alumno';
        onSave({
          id: item?.id,
          studentId: studentId || ('s-' + Date.now()),
          studentName: finalName,
          classId,
          className,
          date,
          time,
          duration: Number(duration),
          rate: Number(rate),
          status,
          paymentStatus
        });
      };

      return (
        <form onSubmit={handleSubmit} className="space-y-4 text-xs">
          <div className="grid grid-cols-2 gap-3">
            <div>
              <label className="font-semibold block mb-1">Alumno</label>
              {students.length > 0 ? (
                <select
                  value={studentId}
                  onChange={handleStudentSelect}
                  className="w-full px-3 py-2 rounded-lg bg-slate-50 dark:bg-slate-800 border border-slate-200 dark:border-slate-700 outline-none"
                >
                  {students.map(s => <option key={s.id} value={s.id}>{s.name}</option>)}
                </select>
              ) : (
                <input
                  type="text"
                  value={studentName}
                  onChange={(e) => setStudentName(e.target.value)}
                  placeholder="Escribe el nombre del alumno"
                  className="w-full px-3 py-2 rounded-lg bg-slate-50 dark:bg-slate-800 border border-slate-200 dark:border-slate-700 outline-none"
                  required
                />
              )}
            </div>
            <div>
              <label className="font-semibold block mb-1">Clase o Sesión Vinculada</label>
              <select
                value={classId}
                onChange={handleClassChange}
                className="w-full px-3 py-2 rounded-lg bg-slate-50 dark:bg-slate-800 border border-slate-200 dark:border-slate-700 outline-none"
              >
                <option value="custom">Sesión Privada 1 a 1</option>
                {classes.map(c => <option key={c.id} value={c.id}>{c.name}</option>)}
              </select>
            </div>
          </div>

          <div className="grid grid-cols-3 gap-3">
            <div>
              <label className="font-semibold block mb-1">Fecha</label>
              <input
                type="date"
                value={date}
                onChange={(e) => setDate(e.target.value)}
                className="w-full px-3 py-2 rounded-lg bg-slate-50 dark:bg-slate-800 border border-slate-200 dark:border-slate-700 outline-none"
              />
            </div>
            <div>
              <label className="font-semibold block mb-1">Hora de Inicio</label>
              <input
                type="time"
                value={time}
                onChange={(e) => setTime(e.target.value)}
                className="w-full px-3 py-2 rounded-lg bg-slate-50 dark:bg-slate-800 border border-slate-200 dark:border-slate-700 outline-none"
              />
            </div>
            <div>
              <label className="font-semibold block mb-1">Duración (min)</label>
              <input
                type="number"
                value={duration}
                onChange={(e) => setDuration(e.target.value)}
                className="w-full px-3 py-2 rounded-lg bg-slate-50 dark:bg-slate-800 border border-slate-200 dark:border-slate-700 outline-none"
              />
            </div>
          </div>

          <div className="grid grid-cols-3 gap-3">
            <div>
              <label className="font-semibold block mb-1">Precio de Sesión ($)</label>
              <input
                type="number"
                value={rate}
                onChange={(e) => setRate(e.target.value)}
                className="w-full px-3 py-2 rounded-lg bg-slate-50 dark:bg-slate-800 border border-slate-200 dark:border-slate-700 outline-none"
              />
            </div>
            <div>
              <label className="font-semibold block mb-1">Estado de la Reserva</label>
              <select
                value={status}
                onChange={(e) => setStatus(e.target.value)}
                className="w-full px-3 py-2 rounded-lg bg-slate-50 dark:bg-slate-800 border border-slate-200 dark:border-slate-700 outline-none"
              >
                <option value="Confirmada">Confirmada</option>
                <option value="Pendiente">Pendiente</option>
                <option value="Completada">Completada</option>
                <option value="Reprogramada">Reprogramada</option>
              </select>
            </div>
            <div>
              <label className="font-semibold block mb-1">Estado del Cobro</label>
              <select
                value={paymentStatus}
                onChange={(e) => setPaymentStatus(e.target.value)}
                className="w-full px-3 py-2 rounded-lg bg-slate-50 dark:bg-slate-800 border border-slate-200 dark:border-slate-700 outline-none"
              >
                <option value="Pendiente">Pendiente</option>
                <option value="Pagado">Pagado</option>
                <option value="Vencido">Vencido</option>
              </select>
            </div>
          </div>

          <div className="flex justify-end gap-2 pt-2">
            <button type="button" onClick={onCancel} className="px-4 py-2 rounded-lg bg-slate-100 dark:bg-slate-800 font-semibold">Cancelar</button>
            <button type="submit" className="px-4 py-2 rounded-lg bg-accent hover:bg-accent-dark text-white font-bold">Guardar Reserva</button>
          </div>
        </form>
      );
    }

    function PaymentForm({ item, students, onSave, onCancel }) {
      const [studentId, setStudentId] = useState(item ? item.studentId : (students[0]?.id || ''));
      const [studentName, setStudentName] = useState(item ? item.studentName : (students[0]?.name || ''));
      const [amount, setAmount] = useState(item ? item.amount : 75);
      const [date, setDate] = useState(item ? item.date : new Date().toISOString().slice(0, 10));
      const [dueDate, setDueDate] = useState(item ? item.dueDate : new Date(Date.now() + 5*86400000).toISOString().slice(0, 10));
      const [method, setMethod] = useState(item ? item.method : 'Bizum');
      const [status, setStatus] = useState(item ? item.status : 'Pendiente');
      const [notes, setNotes] = useState(item ? item.notes : '');

      const handleStudentSelect = (e) => {
        const sid = e.target.value;
        setStudentId(sid);
        const s = students.find(x => x.id === sid);
        if (s) setStudentName(s.name);
      };

      const handleSubmit = (e) => {
        e.preventDefault();
        const finalName = studentName.trim() || (students.find(s => s.id === studentId)?.name) || 'Alumno';
        onSave({
          id: item?.id,
          invoiceNum: item?.invoiceNum,
          studentId: studentId || ('s-' + Date.now()),
          studentName: finalName,
          amount: Number(amount),
          date,
          dueDate,
          method,
          status,
          notes
        });
      };

      return (
        <form onSubmit={handleSubmit} className="space-y-4 text-xs">
          <div className="grid grid-cols-2 gap-3">
            <div>
              <label className="font-semibold block mb-1">Alumno *</label>
              {students.length > 0 ? (
                <select
                  value={studentId}
                  onChange={handleStudentSelect}
                  className="w-full px-3 py-2 rounded-lg bg-slate-50 dark:bg-slate-800 border border-slate-200 dark:border-slate-700 outline-none"
                >
                  {students.map(s => <option key={s.id} value={s.id}>{s.name}</option>)}
                </select>
              ) : (
                <input
                  type="text"
                  value={studentName}
                  onChange={(e) => setStudentName(e.target.value)}
                  placeholder="Nombre del alumno"
                  className="w-full px-3 py-2 rounded-lg bg-slate-50 dark:bg-slate-800 border border-slate-200 dark:border-slate-700 outline-none"
                  required
                />
              )}
            </div>
            <div>
              <label className="font-semibold block mb-1">Importe ($) *</label>
              <input
                type="number"
                value={amount}
                onChange={(e) => setAmount(e.target.value)}
                className="w-full px-3 py-2 rounded-lg bg-slate-50 dark:bg-slate-800 border border-slate-200 dark:border-slate-700 outline-none"
                required
              />
            </div>
          </div>

          <div className="grid grid-cols-2 gap-3">
            <div>
              <label className="font-semibold block mb-1">Fecha de Emisión</label>
              <input
                type="date"
                value={date}
                onChange={(e) => setDate(e.target.value)}
                className="w-full px-3 py-2 rounded-lg bg-slate-50 dark:bg-slate-800 border border-slate-200 dark:border-slate-700 outline-none"
              />
            </div>
            <div>
              <label className="font-semibold block mb-1">Fecha Límite de Pago</label>
              <input
                type="date"
                value={dueDate}
                onChange={(e) => setDueDate(e.target.value)}
                className="w-full px-3 py-2 rounded-lg bg-slate-50 dark:bg-slate-800 border border-slate-200 dark:border-slate-700 outline-none"
              />
            </div>
          </div>

          <div className="grid grid-cols-2 gap-3">
            <div>
              <label className="font-semibold block mb-1">Método de Pago</label>
              <select
                value={method}
                onChange={(e) => setMethod(e.target.value)}
                className="w-full px-3 py-2 rounded-lg bg-slate-50 dark:bg-slate-800 border border-slate-200 dark:border-slate-700 outline-none"
              >
                {['Bizum', 'Transferencia', 'Tarjeta / Stripe', 'Efectivo', 'PayPal'].map(m => <option key={m} value={m}>{m}</option>)}
              </select>
            </div>
            <div>
              <label className="font-semibold block mb-1">Estado de la Factura</label>
              <select
                value={status}
                onChange={(e) => setStatus(e.target.value)}
                className="w-full px-3 py-2 rounded-lg bg-slate-50 dark:bg-slate-800 border border-slate-200 dark:border-slate-700 outline-none"
              >
                <option value="Pendiente">Pendiente</option>
                <option value="Pagado">Pagado</option>
                <option value="Vencido">Vencido</option>
              </select>
            </div>
          </div>

          <div>
            <label className="font-semibold block mb-1">Concepto / Notas</label>
            <input
              type="text"
              value={notes}
              onChange={(e) => setNotes(e.target.value)}
              placeholder="p. ej., Clases particulares del mes"
              className="w-full px-3 py-2 rounded-lg bg-slate-50 dark:bg-slate-800 border border-slate-200 dark:border-slate-700 outline-none"
            />
          </div>

          <div className="flex justify-end gap-2 pt-2">
            <button type="button" onClick={onCancel} className="px-4 py-2 rounded-lg bg-slate-100 dark:bg-slate-800 font-semibold">Cancelar</button>
            <button type="submit" className="px-4 py-2 rounded-lg bg-accent hover:bg-accent-dark text-white font-bold">Guardar Factura</button>
          </div>
        </form>
      );
    }

    // Renderizar la aplicación React
    const root = ReactDOM.createRoot(document.getElementById('root'));
    root.render(<App />);
  </script>
</body>
</html>
