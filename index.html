          headers = ['ID', 'Alumno', 'Clase/Materia', 'Fecha', 'Hora', 'Duración (min)', 'Tarifa ($)', 'Estado Reserva', 'Estado Pago'];
          rows = data.bookings.map(b => [b.id, b.studentName, b.className, b.date, b.time, b.duration, b.rate, b.status, b.paymentStatus]);
        } else if (type === 'alumnos') {
          headers = ['ID', 'Nombre', 'Correo', 'Teléfono', 'Tarifa Hora ($)', 'Estado', 'Saldo Pendiente ($)', 'Notas'];
          rows = data.students.map(s => [s.id, s.name, s.email, s.phone, s.hourlyRate, s.status, s.balanceDue, `"${(s.notes||'').replace(/"/g, '""')}"`]);
        }

        const csvContent = 'data:text/csv;charset=utf-8,' + [headers.join(','), ...rows.map(e => e.join(','))].join('\n');
        const encodedUri = encodeURI(csvContent);
        const link = document.createElement('a');
        link.setAttribute('href', encodedUri);
        link.setAttribute('download', filename);
        document.body.appendChild(link);
        link.click();
        link.remove();
        showToast(`¡${type.toUpperCase()} exportado en CSV!`);
      };

      const handleJsonImport = (e) => {
        const fileReader = new FileReader();
        const file = e.target.files[0];
        if (!file) return;

        fileReader.onload = (event) => {
          try {
            const parsed = JSON.parse(event.target.result);
            if (parsed.tasks && parsed.classes && parsed.students && parsed.payments) {
              setData(parsed);
              showToast("¡Panel restaurado con éxito desde la copia!");
            } else {
              showToast("Estructura de archivo no válida.", "error");
            }
          } catch (err) {
            showToast("Error al procesar el archivo JSON.", "error");
          }
        };
        fileReader.readAsText(file);
        e.target.value = '';
      };

      const resetToBlank = () => {
        if (confirm("¿Estás seguro de que deseas vaciar todas las entradas del panel? Se borrarán tareas, clases, alumnos y pagos.")) {
          setData(INITIAL_DATA);
          showToast("Panel vaciado completamente. ¡Listo para tus datos!", "info");
        }
      };

      // --------------------------------------------------
      // MÉTRICAS Y KPIS CALCULADOS (SEGUROS CON LISTAS VACÍAS)
      // --------------------------------------------------
      const kpis = useMemo(() => {
        const totalPaid = data.payments
          .filter(p => p.status === 'Pagado')
          .reduce((sum, p) => sum + Number(p.amount), 0);

        const totalPending = data.payments
          .filter(p => p.status === 'Pendiente' || p.status === 'Vencido')
          .reduce((sum, p) => sum + Number(p.amount), 0);

        const overdueCount = data.payments.filter(p => p.status === 'Vencido').length;

        const activeStudentsCount = data.students.filter(s => s.status === 'Activo').length;

        const totalTeachingHours = data.classes.reduce((sum, c) => sum + (Number(c.durationMinutes) / 60), 0);

        const openTasksCount = data.tasks.filter(t => t.status !== 'completada').length;
        const urgentTasksCount = data.tasks.filter(t => t.priority === 'Urgente' && t.status !== 'completada').length;

        return {
          totalPaid,
          totalPending,
          overdueCount,
          activeStudentsCount,
          totalTeachingHours,
          openTasksCount,
          urgentTasksCount
        };
      }, [data]);

      return (
        <div className="min-h-screen flex flex-col">
          {/* AVISO TOAST */}
          {toast && (
            <div className="fixed bottom-5 right-5 z-50 flex items-center gap-3 px-4 py-3 rounded-xl shadow-2xl text-sm font-medium bg-primary text-white dark:bg-accent dark:text-white border border-primary-light animate-bounce">
              <span className="w-2 h-2 rounded-full bg-emerald-400"></span>
              {toast.message}
            </div>
          )}

          {/* CABECERA PRINCIPAL CON SOPORTE PARA IPHONE (DYNAMIC ISLAND / NOTCH) */}
          <header className="sticky top-0 z-30 bg-white/95 dark:bg-primary/95 backdrop-blur-md border-b border-slate-200 dark:border-slate-800 safe-top-padding transition-all">
            <div className="max-w-7xl mx-auto px-4 sm:px-6 lg:px-8">
              <div className="flex items-center justify-between min-h-[4rem] py-1">
                
                {/* Marca & Perfil Roberto */}
                <div className="flex items-center gap-3">
                  <div className="w-10 h-10 rounded-xl bg-gradient-to-tr from-accent to-accent-light text-white flex items-center justify-center font-bold text-lg shadow-md shadow-accent/20">
                    R
                  </div>
                  <div>
                    <h1 className="font-bold text-slate-900 dark:text-white leading-tight flex items-center gap-2">
                      Panel de Roberto
                      <button
                        onClick={reloadFromCloud}
                        title="Toca para recargar las clases y datos actualizados desde la nube"
                        className="text-xs px-2.5 py-1 rounded-full font-medium bg-emerald-50 hover:bg-emerald-100 text-emerald-700 dark:bg-emerald-950 dark:hover:bg-emerald-900 dark:text-emerald-300 border border-emerald-200/50 dark:border-emerald-800/50 transition-all flex items-center gap-1 active:scale-95 cursor-pointer shadow-sm"
                      >
                        {syncStatus === 'synced' ? '🟢 Sincronizado (Tocar p/ actualizar)' : syncStatus === 'syncing' ? '🟡 Sincronizando...' : '⚪ Modo Local (Tocar p/ conectar)'}
                      </button>
                    </h1>
                    <p className="text-xs text-slate-500 dark:text-slate-400">Estudio Académico y Clases Privadas</p>
                  </div>
                </div>

                {/* Barra de Búsqueda Rápida */}
                <div className="hidden md:flex items-center relative w-72">
                  <span className="absolute left-3 text-slate-400"><Icons.Search /></span>
                  <input
                    type="text"
                    value={searchQuery}
                    onChange={(e) => setSearchQuery(e.target.value)}
                    placeholder="Buscar tareas, clases, alumnos..."
                    className="w-full pl-9 pr-4 py-1.5 text-xs rounded-lg bg-slate-100 dark:bg-slate-800 border-none focus:ring-2 focus:ring-accent outline-none placeholder:text-slate-400"
                  />
                  {searchQuery && (
                    <button onClick={() => setSearchQuery('')} className="absolute right-2.5 text-xs text-slate-400 hover:text-slate-600">✕</button>
                  )}
                </div>

                {/* Utilidades / Respaldo, Limpieza y Modo Oscuro */}
                <div className="flex items-center gap-2">
                  <div className="flex items-center gap-1 bg-slate-100 dark:bg-slate-800 p-1 rounded-lg">
                    <button
                      onClick={reloadFromCloud}
                      title="Descargar/Recargar las últimas clases desde la Nube"
                      className="p-1.5 text-slate-600 dark:text-slate-300 hover:text-emerald-600 dark:hover:text-emerald-400 rounded-md transition-colors"
                    >
                      <Icons.Refresh />
                    </button>
                    <button
                      onClick={async () => {
                        if (!supabaseClient) return alert("Supabase no configurado");
                        showToast("Subiendo datos a la nube...", "info");
                        try {
                          const { error } = await supabaseClient
                            .from('dashboard_state')
                            .upsert({ id: 'roberto_main', data: data, updated_at: new Date().toISOString() });
                          if (!error) {
                            setSyncStatus('synced');
                            showToast("¡Datos subidos a la nube con éxito!");
                          } else {
                            alert("Error al sincronizar con Supabase: " + (error.message || JSON.stringify(error)));
                          }
                        } catch(e) {
                          alert("Error de conexión: " + e.message);
                        }
                      }}
                      title="Subir cambios locales a la Nube manualmente"
                      className="p-1.5 text-slate-600 dark:text-slate-300 hover:text-sky-600 dark:hover:text-sky-400 rounded-md transition-colors text-xs font-semibold px-2"
                    >
                      Subir ☁️
                    </button>
                    <button
                      onClick={exportJsonBackup}
                      title="Descargar copia de seguridad JSON"
                      className="p-1.5 text-slate-600 dark:text-slate-300 hover:text-accent dark:hover:text-accent-light rounded-md transition-colors"
                    >
                      <Icons.Download />
                    </button>
                    <label
                      title="Restaurar copia JSON"
                      className="p-1.5 text-slate-600 dark:text-slate-300 hover:text-accent dark:hover:text-accent-light rounded-md transition-colors cursor-pointer"
                    >
                      <Icons.Upload />
                      <input type="file" accept=".json" onChange={handleJsonImport} className="hidden" />
                    </label>
                    <button
                      onClick={resetToBlank}
                      title="Vaciar todo y dejar en blanco"
                      className="p-1.5 text-slate-600 dark:text-slate-300 hover:text-rose-600 rounded-md transition-colors"
                    >
                      <Icons.Trash />
                    </button>
                  </div>

                  <button
                    onClick={() => setIsDark(!isDark)}
                    title={isDark ? "Cambiar a Modo Claro" : "Cambiar a Modo Oscuro"}
                    className="p-2 rounded-lg bg-slate-100 dark:bg-slate-800 text-slate-600 dark:text-slate-300 hover:bg-slate-200 dark:hover:bg-slate-700 transition"
                  >
                    {isDark ? <Icons.Sun /> : <Icons.Moon />}
                  </button>
                </div>

              </div>

              {/* Pestañas de Navegación */}
              <div className="flex space-x-1 sm:space-x-4 overflow-x-auto scrollbar-thin py-1 -mb-px border-t border-slate-100 dark:border-slate-800/80">
                {[
                  { id: 'overview', label: 'Vista General', icon: Icons.Dashboard },
                  { id: 'calendario', label: 'Calendario', icon: Icons.Calendar },
                  { id: 'tasks', label: 'Tareas y Prep', icon: Icons.Tasks, badge: kpis.openTasksCount > 0 ? kpis.openTasksCount : null },
                  { id: 'classes', label: 'Clases y Horarios', icon: Icons.Classes, badge: data.classes.length > 0 ? data.classes.length : null },
                  { id: 'students', label: 'Estudiantes y Reservas', icon: Icons.Students, badge: data.students.length > 0 ? data.students.length : null },
                  { id: 'payments', label: 'Pagos y Facturación', icon: Icons.Payments, badge: kpis.overdueCount ? `${kpis.overdueCount} Vencido` : null, badgeColor: 'bg-rose-500 text-white' },
                  { id: 'finanzas', label: 'Finanzas Personales', icon: Icons.Payments },
                  { id: 'reports', label: 'Informes y Métricas', icon: Icons.Reports }
                ].map(tab => {
                  const Icon = tab.icon;
                  const isActive = currentTab === tab.id;
                  return (
                    <button
                      key={tab.id}
                      onClick={() => setCurrentTab(tab.id)}
                      className={`flex items-center gap-2 py-2.5 px-3 border-b-2 text-xs sm:text-sm font-semibold whitespace-nowrap transition-all duration-150 ${
                        isActive
                          ? 'border-accent text-accent dark:text-accent-light dark:border-accent-light'
                          : 'border-transparent text-slate-500 hover:text-slate-800 dark:text-slate-400 dark:hover:text-slate-200'
                      }`}
                    >
                      <Icon />
                      <span>{tab.label}</span>
                      {tab.badge !== undefined && tab.badge !== null && (
                        <span className={`text-[10px] px-1.5 py-0.2 rounded-full font-bold ${
                          tab.badgeColor || (isActive ? 'bg-accent/10 text-accent dark:bg-accent/20 dark:text-accent-light' : 'bg-slate-200 dark:bg-slate-800 text-slate-600 dark:text-slate-400')
                        }`}>
                          {tab.badge}
                        </span>
                      )}
                    </button>
                  );
                })}
              </div>
            </div>
          </header>

          {/* VISTAS PRINCIPALES */}
          <main className="flex-1 max-w-7xl w-full mx-auto px-4 sm:px-6 lg:px-8 py-6">
            <ErrorBoundary>
              {currentTab === 'overview' && (
                <OverviewView
                  data={data}
                  kpis={kpis}
                  searchQuery={searchQuery}
                  onOpenModal={setModal}
                  onToggleTask={toggleTaskStatus}
                  onMarkPaid={markPaymentPaid}
                  onUpdateClassStatus={updateClassStatus}
                  onSwitchTab={setCurrentTab}
                />
              )}

              {currentTab === 'calendario' && (
                <CalendarView
                  classes={data.classes || []}
                  students={data.students || []}
                  bookings={data.bookings || []}
                  onOpenModal={setModal}
                  onDeleteClass={deleteClass}
                />
              )}

              {currentTab === 'tasks' && (
                <TasksView
                  tasks={data.tasks || []}
                  searchQuery={searchQuery}
                  onOpenModal={setModal}
                  onToggleTask={toggleTaskStatus}
                  onDeleteTask={deleteTask}
                />
              )}

              {currentTab === 'classes' && (
                <ClassesView
                  onClearAllClasses={clearAllClasses}
                  onRestoreClasses={restoreClassesFromHistory}
                  classes={data.classes || []}
                  students={data.students || []}
                  searchQuery={searchQuery}
                  onOpenModal={setModal}
                  onDeleteClass={deleteClass}
                />
              )}

              {currentTab === 'students' && (
                <StudentsView
                  onResetStudentBalances={resetStudentBalances}
                  students={data.students || []}
                  bookings={data.bookings || []}
                  classes={data.classes || []}
                  searchQuery={searchQuery}
                  onOpenModal={setModal}
                  onDeleteStudent={deleteStudent}
                  onDeleteBooking={deleteBooking}
                  onExportCsv={exportCsv}
                />
              )}

              {currentTab === 'payments' && (
                <PaymentsView
                  payments={data.payments || []}
                  students={data.students || []}
                  searchQuery={searchQuery}
                  onOpenModal={setModal}
                  onMarkPaid={markPaymentPaid}
                  onDeletePayment={deletePayment}
                  onCleanDuplicates={cleanDuplicatePayments}
                  onExportCsv={exportCsv}
                />
              )}

              {currentTab === 'finanzas' && (
                <FinanzasView
                  finanzas={data.finanzas || {}}
                  kpis={kpis}
                  onUpdate={(fin) => setData(d => ({ ...d, finanzas: fin }))}
                />
              )}

              {currentTab === 'reports' && (
                <ReportsView
                  data={data}
                  kpis={kpis}
                  onExportJson={exportJsonBackup}
                  onExportCsv={exportCsv}
                />
              )}
            </ErrorBoundary>
          </main>

          {/* PIE DE PÁGINA */}
          <footer className="border-t border-slate-200 dark:border-slate-800 py-4 text-center text-xs text-slate-400">
            Espacio Académico de Roberto • Almacenamiento Local Privado sin Servidores • Todos los datos permanecen 100% en tu dispositivo
          </footer>

          {/* DIÁLOGO MODAL GLOBAL */}
          {modal && (
            <ModalDialog
              modal={modal}
              data={data}
              onClose={() => setModal(null)}
              onSaveTask={saveTask}
              onSaveClass={saveClass}
              onSaveStudent={saveStudent}
              onSaveBooking={saveBooking}
              onSavePayment={savePayment}
              onApplyRestoredClasses={applyRestoredClasses}
            />
          )}
        </div>
      );
    }

    // ----------------------------------------------------
    // PESTAÑA 1: VISTA GENERAL
    // ----------------------------------------------------
    function OverviewView({ data, kpis, onOpenModal, onToggleTask, onMarkPaid, onUpdateClassStatus, onSwitchTab }) {
      const fechaHoy = new Date().toLocaleDateString('es-ES', { weekday: 'long', day: 'numeric', month: 'long', year: 'numeric' });

      // Estado para la fecha seleccionada en el visor de clases diarias
      const [selectedDate, setSelectedDate] = useState(() => {
        // Formato YYYY-MM-DD
        const now = new Date();
        const y = now.getFullYear();
        const m = String(now.getMonth() + 1).padStart(2, '0');
        const d = String(now.getDate()).padStart(2, '0');
        return `${y}-${m}-${d}`;
      });

      // Navegación de días (+1 / -1)
      const changeDay = (days) => {
        const [y, m, d] = selectedDate.split('-').map(Number);
        const dt = new Date(y, m - 1, d);
        dt.setDate(dt.getDate() + days);
        const ny = dt.getFullYear();
        const nm = String(dt.getMonth() + 1).padStart(2, '0');
        const nd = String(dt.getDate()).padStart(2, '0');
        setSelectedDate(`${ny}-${nm}-${nd}`);
      };

      // Formato solicitado: "Miercoles 2 Septiembre 2026"
      const formattedDateTitle = useMemo(() => {
        const [y, m, d] = selectedDate.split('-').map(Number);
        const dt = new Date(y, m - 1, d);
        const days = ['Domingo', 'Lunes', 'Martes', 'Miércoles', 'Jueves', 'Viernes', 'Sábado'];
        const months = ['Enero', 'Febrero', 'Marzo', 'Abril', 'Mayo', 'Junio', 'Julio', 'Agosto', 'Septiembre', 'Octubre', 'Noviembre', 'Diciembre'];
        return `${days[dt.getDay()]} ${dt.getDate()} ${months[dt.getMonth()]} ${dt.getFullYear()}`;
      }, [selectedDate]);

      // Filtrar clases del día seleccionado
      const dayClasses = useMemo(() => {
        const [y, m, d] = selectedDate.split('-').map(Number);
        const dt = new Date(y, m - 1, d);
        const days = ['Domingo', 'Lunes', 'Martes', 'Miércoles', 'Jueves', 'Viernes', 'Sábado'];
        const targetDayName = days[dt.getDay()].toLowerCase();

        return data.classes.filter(cls => {
          if (cls.date) {
            return cls.date === selectedDate;
          }
          if (cls.dayOfWeek) {
            return cls.dayOfWeek.toLowerCase() === targetDayName;
          }
          return false;
        });
      }, [data.classes, selectedDate]);

      const priorityWeight = {
        'Urgente': 4,
        'Alta': 3,
        'Media': 2,
        'Baja': 1
      };

      const pendingTasks = useMemo(() => {
        return [...data.tasks]
          .filter(t => t.status !== 'completada')
          .sort((a, b) => {
            const weightA = priorityWeight[a.priority] || 0;
            const weightB = priorityWeight[b.priority] || 0;
            // Ordenar de mayor a menor prioridad
            if (weightB !== weightA) {
              return weightB - weightA;
            }
            // Si tienen la misma prioridad, ordenar por fecha límite (más próxima primero)
            if (a.dueDate && b.dueDate) {
              return a.dueDate.localeCompare(b.dueDate);
            }
            return a.dueDate ? -1 : 1;
          })
          .slice(0, 10);
      }, [data.tasks]);

      return (
        <div className="space-y-6">
          {/* Banner de Bienvenida con mini-tarjetas financieras */}
          <div className="banner-gradient rounded-2xl p-6 text-white shadow-xl overflow-hidden">
            <div className="flex flex-col gap-4">
              <div className="flex flex-col md:flex-row md:items-start justify-between gap-4">
                <div>
                  <div className="flex items-center gap-2 text-blue-200 text-xs font-semibold uppercase tracking-wider mb-1">
                    <Icons.Calendar />
                    <span className="capitalize">{fechaHoy}</span>
                  </div>
                  <h2 className="text-2xl sm:text-3xl font-extrabold tracking-tight">
                    ¡Hola de nuevo, {data.user.name}! 👋
                  </h2>
                  <p className="text-sm text-blue-100 mt-1 max-w-xl">
                    {data.classes.length === 0 && data.tasks.length === 0
                      ? <span>Tu panel está listo. Agrega tus primeras clases o tareas.</span>
                      : <span>Tienes <b>{kpis.openTasksCount}</b> tareas activas y <b>{data.classes.length}</b> clases programadas en total.</span>
                    }
                  </p>
                </div>
                {/* Mini-tarjetas financieras */}
                <div className="flex flex-wrap gap-3 shrink-0">
                  <div className="bg-white/10 backdrop-blur border border-white/15 rounded-xl px-4 py-3 min-w-[130px]">
                    <div className="text-[10px] text-emerald-200 font-semibold uppercase tracking-wide mb-1">Ingresos Cobrados</div>
                    <div className="text-xl font-extrabold text-white">${kpis.totalPaid.toLocaleString()}</div>
                    <div className="text-[10px] text-emerald-300 mt-0.5">✓ Clases liquidadas</div>
                  </div>
                  <div className="bg-white/10 backdrop-blur border border-white/15 rounded-xl px-4 py-3 min-w-[130px]">
                    <div className="text-[10px] text-amber-200 font-semibold uppercase tracking-wide mb-1">Cobros Pendientes</div>
                    <div className="text-xl font-extrabold text-amber-300">${kpis.totalPending.toLocaleString()}</div>
                    <div className="text-[10px] text-amber-200 mt-0.5">
                      {kpis.overdueCount > 0
                        ? <span className="text-rose-300 font-semibold">{kpis.overdueCount} vencida(s)</span>
                        : 'Sin vencidas'}
                    </div>
                  </div>
                </div>
              </div>
              {/* Botones de Acción Rápida */}
              <div className="flex flex-wrap gap-2">
                <button onClick={() => onOpenModal({ type: 'task' })} className="inline-flex items-center gap-1.5 px-3 py-2 bg-white/10 hover:bg-white/20 rounded-xl text-xs font-semibold text-white transition border border-white/10"><Icons.Plus /> Tarea</button>
                <button onClick={() => onOpenModal({ type: 'class' })} className="inline-flex items-center gap-1.5 px-3 py-2 bg-white/10 hover:bg-white/20 rounded-xl text-xs font-semibold text-white transition border border-white/10"><Icons.Plus /> Clase</button>
                <button onClick={() => onOpenModal({ type: 'student' })} className="inline-flex items-center gap-1.5 px-3 py-2 bg-white/10 hover:bg-white/20 rounded-xl text-xs font-semibold text-white transition border border-white/10"><Icons.Plus /> Alumno</button>
                <button onClick={() => onOpenModal({ type: 'payment' })} className="inline-flex items-center gap-1.5 px-3.5 py-2 bg-emerald-500 hover:bg-emerald-600 rounded-xl text-xs font-semibold text-white transition shadow-lg shadow-emerald-500/30"><Icons.Plus /> Factura</button>
              </div>
            </div>
          </div>

          {/* Cuadrícula: Tareas (izquierda, ancha) | Clases del Día (derecha, estrecha) */}
          <div className="grid grid-cols-1 lg:grid-cols-3 gap-6">

            {/* Tareas Pendientes — ocupa 2/3 */}
            <div className="lg:col-span-2 bg-white dark:bg-slate-900 rounded-xl p-5 border border-slate-200/80 dark:border-slate-800 shadow-sm">
              <div className="flex items-center justify-between mb-4">
                <div className="flex items-center gap-2">
                  <span className="p-1.5 rounded-lg bg-rose-50 dark:bg-rose-950 text-rose-600 dark:text-rose-400"><Icons.Tasks /></span>
                  <h3 className="font-bold text-slate-900 dark:text-white text-base">Tareas Pendientes</h3>
                </div>
                <button onClick={() => onSwitchTab('tasks')} className="text-xs text-accent dark:text-accent-light hover:underline font-semibold">Ver Tablero →</button>
              </div>
              {pendingTasks.length === 0 ? (
                <div className="p-6 text-center border border-dashed border-slate-200 dark:border-slate-800 rounded-xl">
                  <p className="text-xs font-medium text-slate-500 mb-2">¡Todo al día! No hay tareas pendientes.</p>
                  <button onClick={() => onOpenModal({ type: 'task' })} className="inline-flex items-center gap-1 px-3 py-1.5 rounded-lg text-xs font-semibold bg-accent text-white hover:bg-accent-dark transition"><Icons.Plus /> Nueva tarea</button>
                </div>
              ) : (
                <div className="space-y-2.5">
                  {pendingTasks.map(task => (
                    <div key={task.id} className="flex items-start gap-3 p-3 rounded-lg border border-slate-100 dark:border-slate-800 hover:bg-slate-50 dark:hover:bg-slate-800/60 transition">
                      <button onClick={() => onToggleTask(task.id)} className={`mt-0.5 w-4 h-4 rounded border flex items-center justify-center transition ${task.status === 'completada' ? 'bg-emerald-500 border-emerald-500 text-white' : 'border-slate-300 dark:border-slate-600 hover:border-accent'}`}>
                        {task.status === 'completada' && <Icons.Check />}
                      </button>
                      <div className="flex-1 min-w-0">
                        <div className="flex items-center gap-2 flex-wrap">
                          <span className="text-xs font-semibold text-slate-900 dark:text-white">{task.title}</span>
                          <span className={`text-[10px] px-1.5 py-0.5 rounded font-semibold ${task.priority === 'Urgente' ? 'bg-rose-100 text-rose-700 dark:bg-rose-950 dark:text-rose-300' : task.priority === 'Alta' ? 'bg-amber-100 text-amber-700 dark:bg-amber-950 dark:text-amber-300' : 'bg-slate-100 text-slate-700 dark:bg-slate-800 dark:text-slate-300'}`}>{task.priority}</span>
                          {task.dueDate && <span className="text-[10px] text-slate-400">Fecha: {task.dueDate}</span>}
                          {task.time && <span className="text-[10px] font-bold text-accent dark:text-accent-light">Hora: {task.time}</span>}
                        </div>
                        {task.notes && <p className="text-xs text-slate-500 dark:text-slate-400 mt-0.5 line-clamp-1">{task.notes}</p>}
                      </div>
                    </div>
                  ))}
                </div>
              )}
            </div>

            {/* Clases Agendadas del Día — Selector de fecha con flechas */}
            <div className="lg:col-span-1 bg-white dark:bg-slate-900 rounded-xl p-5 border border-slate-200/80 dark:border-slate-800 shadow-sm flex flex-col justify-between">
              <div>
                {/* Cabecera del cuadro con selector de fecha */}
                <div className="flex items-center justify-between pb-3 border-b border-slate-100 dark:border-slate-800 mb-3">
                  <div className="flex items-center gap-2">
                    <span className="p-1.5 rounded-lg bg-accent/10 dark:bg-accent/20 text-accent dark:text-accent-light">
                      <Icons.Classes />
                    </span>
                    <div>
                      <h3 className="font-bold text-slate-900 dark:text-white text-xs uppercase tracking-wider">Clases del Día</h3>
                    </div>
                  </div>
                  
                  {/* Flechas para cambiar de día */}
                  <div className="flex items-center gap-1">
                    <button
                      onClick={() => changeDay(-1)}
                      title="Día anterior"
                      className="p-1.5 rounded-lg bg-slate-100 hover:bg-slate-200 dark:bg-slate-800 dark:hover:bg-slate-700 text-slate-600 dark:text-slate-300 transition"
                    >
                      <Icons.ChevronLeft />
                    </button>
                    <button
                      onClick={() => {
                        const now = new Date();
                        const y = now.getFullYear();
                        const m = String(now.getMonth() + 1).padStart(2, '0');
                        const d = String(now.getDate()).padStart(2, '0');
                        setSelectedDate(`${y}-${m}-${d}`);
                      }}
                      title="Ir a Hoy"
                      className="px-2 py-1 text-[10px] font-bold rounded-lg bg-slate-100 hover:bg-slate-200 dark:bg-slate-800 dark:hover:bg-slate-700 text-slate-600 dark:text-slate-300 transition"
                    >
                      Hoy
                    </button>
                    <button
                      onClick={() => changeDay(1)}
                      title="Día siguiente"
                      className="p-1.5 rounded-lg bg-slate-100 hover:bg-slate-200 dark:bg-slate-800 dark:hover:bg-slate-700 text-slate-600 dark:text-slate-300 transition"
                    >
                      <Icons.ChevronRight />
                    </button>
                  </div>
                </div>

                {/* Fecha formateada destacada: Miercoles 2 Septiembre 2026 */}
                <div className="mb-3 text-center sm:text-left bg-slate-50 dark:bg-slate-800/60 p-2.5 rounded-xl border border-slate-100 dark:border-slate-800">
                  <div className="text-[11px] text-slate-400 font-medium">Agenda para:</div>
                  <div className="text-sm font-extrabold text-accent dark:text-accent-light">
                    {formattedDateTitle}
                  </div>
                </div>

                {/* Lista de clases del día */}
                {dayClasses.length === 0 ? (
                  <div className="p-5 text-center border border-dashed border-slate-200 dark:border-slate-800 rounded-xl my-2">
                    <p className="text-xs font-medium text-slate-500 mb-2">No tienes clases agendadas para este día.</p>
                    <button
                      onClick={() => onOpenModal({ type: 'class', defaultDate: selectedDate })}
                      className="inline-flex items-center gap-1 px-3 py-1.5 rounded-lg text-xs font-semibold bg-accent text-white hover:bg-accent-dark transition"
                    >
                      <Icons.Plus /> Agendar clase
                    </button>
                  </div>
                ) : (
                  <div className="space-y-3">
                    {dayClasses.map(cls => {
                      const currentStatus = cls.status || 'Programada';
                      return (
                        <div
                          key={cls.id}
                          className="p-3.5 rounded-xl border border-slate-100 dark:border-slate-800 bg-slate-50/50 dark:bg-slate-800/40 space-y-2.5 transition"
                        >
                          <div>
                            <div className="flex items-center justify-between gap-1.5 mb-1 flex-wrap">
                              <span className="text-[10px] font-bold px-1.5 py-0.5 rounded bg-accent/15 text-accent-dark dark:bg-accent/25 dark:text-accent-light">
                                {cls.subject || 'Tutoría'}
                              </span>
                              <span className={`text-[10px] font-bold px-2 py-0.5 rounded-full ${
                                currentStatus === 'Pagada'
                                  ? 'bg-emerald-100 text-emerald-700 dark:bg-emerald-950 dark:text-emerald-300'
                                  : currentStatus === 'Suspendida'
                                  ? 'bg-rose-100 text-rose-700 dark:bg-rose-950 dark:text-rose-300'
                                  : 'bg-amber-100 text-amber-700 dark:bg-amber-950 dark:text-amber-300'
                              }`}>
                                {currentStatus}
                              </span>
                            </div>
                            <h4 className="text-xs font-bold text-slate-900 dark:text-white leading-tight">
                              {cls.name}
                            </h4>
                            <p className="text-[11px] text-slate-500 mt-0.5 flex items-center gap-1">
                              <Icons.Clock /> {cls.time}
                            </p>
                          </div>

                          {/* Botones de Acciones Rápidas */}
                          <div className="pt-2 border-t border-slate-200/60 dark:border-slate-700/60 flex items-center justify-between gap-1">
                            <span className="text-[10px] font-semibold text-slate-400">Estado:</span>
                            <div className="flex items-center gap-1">
                              <button
                                onClick={() => onUpdateClassStatus(cls.id, 'Pagada')}
                                title="Marcar como pagada"
                                className={`px-2 py-1 text-[10px] font-bold rounded-md transition ${
                                  currentStatus === 'Pagada'
                                    ? 'bg-emerald-600 text-white shadow-sm'
                                    : 'bg-emerald-50 hover:bg-emerald-100 text-emerald-700 dark:bg-emerald-950/60 dark:text-emerald-300'
                                }`}
                              >
                                Pagada
                              </button>
                              <button
                                onClick={() => onUpdateClassStatus(cls.id, 'Pendiente')}
                                title="Marcar como pendiente de pago"
                                className={`px-2 py-1 text-[10px] font-bold rounded-md transition ${
                                  currentStatus === 'Pendiente'
                                    ? 'bg-amber-600 text-white shadow-sm'
                                    : 'bg-amber-50 hover:bg-amber-100 text-amber-700 dark:bg-amber-950/60 dark:text-amber-300'
                                }`}
                              >
                                Pendiente
                              </button>
                              <button
                                onClick={() => onUpdateClassStatus(cls.id, 'Suspendida')}
                                title="Marcar como suspendida"
                                className={`px-2 py-1 text-[10px] font-bold rounded-md transition ${
                                  currentStatus === 'Suspendida'
                                    ? 'bg-rose-600 text-white shadow-sm'
                                    : 'bg-rose-50 hover:bg-rose-100 text-rose-700 dark:bg-rose-950/60 dark:text-rose-300'
                                }`}
                              >
                                Suspendida
                              </button>
                            </div>
                          </div>
                        </div>
                      );
                    })}
                  </div>
                )}
              </div>

              {/* Pie del cuadro */}
              <div className="mt-4 pt-3 border-t border-slate-100 dark:border-slate-800 flex items-center justify-between">
                <span className="text-[11px] text-slate-400">Total: {dayClasses.length} clase(s)</span>
                <button
                  onClick={() => onSwitchTab('classes')}
                  className="text-xs text-accent dark:text-accent-light hover:underline font-semibold"
                >
                  Ver Horario Completo →
                </button>
              </div>
            </div>

          </div>
        </div>
      );
    }

    // ----------------------------------------------------
    // ----------------------------------------------------
    // PESTAÑA: FINANZAS PERSONALES
    // ----------------------------------------------------
    function FinanzasView({ finanzas, kpis, onUpdate }) {
      const [tab, setTab] = useState('resumen');
      const [form, setForm] = useState({ concepto: '', monto: '', fecha: new Date().toISOString().slice(0,10), notas: '' });
      const [deudaForm, setDeudaForm] = useState({ acreedor: '', monto: '', vence: '', notas: '', pagada: false });
      const [editCapital, setEditCapital] = useState(false);
      const [capitalVal, setCapitalVal] = useState(finanzas.capitalActual || 0);
      const [disponibleVal, setDisponibleVal] = useState(finanzas.dineroDisponible || 0);

      const totalOtrosIngresos = useMemo(() =>
        (finanzas.otrosIngresos || []).reduce((s, i) => s + Number(i.monto), 0), [finanzas.otrosIngresos]);
      const totalDeudas = useMemo(() =>
        (finanzas.deudas || []).filter(d => !d.pagada).reduce((s, d) => s + Number(d.monto), 0), [finanzas.deudas]);
      const totalIngresos = kpis.totalPaid + totalOtrosIngresos;

      function saveCapital() {
        onUpdate({ ...finanzas, capitalActual: Number(capitalVal), dineroDisponible: Number(disponibleVal) });
        setEditCapital(false);
      }

      function addIngreso(e) {
        e.preventDefault();
        if (!form.concepto || !form.monto) return;
        const nuevo = { id: Date.now(), ...form, monto: Number(form.monto) };
        onUpdate({ ...finanzas, otrosIngresos: [...(finanzas.otrosIngresos || []), nuevo] });
        setForm({ concepto: '', monto: '', fecha: new Date().toISOString().slice(0,10), notas: '' });
      }

      function removeIngreso(id) {
        onUpdate({ ...finanzas, otrosIngresos: finanzas.otrosIngresos.filter(i => i.id !== id) });
      }

      function addDeuda(e) {
        e.preventDefault();
        if (!deudaForm.acreedor || !deudaForm.monto) return;
        const nueva = { id: Date.now(), ...deudaForm, monto: Number(deudaForm.monto) };
        onUpdate({ ...finanzas, deudas: [...(finanzas.deudas || []), nueva] });
        setDeudaForm({ acreedor: '', monto: '', vence: '', notas: '', pagada: false });
      }

      function toggleDeudaPagada(id) {
        onUpdate({ ...finanzas, deudas: finanzas.deudas.map(d => d.id === id ? { ...d, pagada: !d.pagada } : d) });
      }

      function removeDeuda(id) {
        onUpdate({ ...finanzas, deudas: finanzas.deudas.filter(d => d.id !== id) });
      }

      const tabs = [
        { id: 'resumen', label: 'Resumen' },
        { id: 'ingresos', label: 'Otros Ingresos' },
        { id: 'deudas', label: 'Deudas' },
      ];

      return (
        <div className="space-y-6">
          {/* Título */}
          <div className="flex items-center justify-between">
            <div>
              <h2 className="text-xl font-extrabold text-slate-900 dark:text-white">Finanzas Personales</h2>
              <p className="text-xs text-slate-500 mt-0.5">Control de capital, deudas e ingresos adicionales</p>
            </div>
          </div>

          {/* Tarjetas de resumen */}
          <div className="grid grid-cols-2 lg:grid-cols-4 gap-4">
            <div className="bg-white dark:bg-slate-900 p-4 rounded-xl border border-slate-200/80 dark:border-slate-800 shadow-sm">
              <div className="text-xs text-slate-500 font-medium mb-1">Capital Actual</div>
              <div className="text-xl font-extrabold text-slate-900 dark:text-white">${(finanzas.capitalActual || 0).toLocaleString()}</div>
              <div className="text-[10px] text-slate-400 mt-0.5">Patrimonio total</div>
            </div>
            <div className="bg-white dark:bg-slate-900 p-4 rounded-xl border border-slate-200/80 dark:border-slate-800 shadow-sm">
              <div className="text-xs text-slate-500 font-medium mb-1">Dinero Disponible</div>
              <div className="text-xl font-extrabold text-emerald-600 dark:text-emerald-400">${(finanzas.dineroDisponible || 0).toLocaleString()}</div>
              <div className="text-[10px] text-slate-400 mt-0.5">Liquidez actual</div>
            </div>
            <div className="bg-white dark:bg-slate-900 p-4 rounded-xl border border-slate-200/80 dark:border-slate-800 shadow-sm">
              <div className="text-xs text-slate-500 font-medium mb-1">Ingresos Totales</div>
              <div className="text-xl font-extrabold text-accent dark:text-accent-light">${totalIngresos.toLocaleString()}</div>
              <div className="text-[10px] text-slate-400 mt-0.5">Clases + otros</div>
            </div>
            <div className="bg-white dark:bg-slate-900 p-4 rounded-xl border border-slate-200/80 dark:border-slate-800 shadow-sm">
              <div className="text-xs text-slate-500 font-medium mb-1">Deudas Pendientes</div>
              <div className="text-xl font-extrabold text-rose-600 dark:text-rose-400">${totalDeudas.toLocaleString()}</div>
              <div className="text-[10px] text-slate-400 mt-0.5">{(finanzas.deudas || []).filter(d => !d.pagada).length} deuda(s) activa(s)</div>
            </div>
          </div>

          {/* Sub-tabs */}
          <div className="border-b border-slate-200 dark:border-slate-800">
            <div className="flex gap-4">
              {tabs.map(t => (
                <button key={t.id} onClick={() => setTab(t.id)}
                  className={`py-2 px-1 text-sm font-semibold border-b-2 transition ${tab === t.id ? 'border-accent text-accent dark:text-accent-light dark:border-accent-light' : 'border-transparent text-slate-500 hover:text-slate-800 dark:hover:text-slate-200'}`}>
                  {t.label}
                </button>
              ))}
            </div>
          </div>

          {/* RESUMEN */}
          {tab === 'resumen' && (
            <div className="grid grid-cols-1 lg:grid-cols-2 gap-6">
              {/* Editar capital y disponible */}
              <div className="bg-white dark:bg-slate-900 p-5 rounded-xl border border-slate-200/80 dark:border-slate-800 shadow-sm">
                <div className="flex items-center justify-between mb-4">
                  <h3 className="font-bold text-slate-900 dark:text-white text-base">Mi Capital y Liquidez</h3>
                  {!editCapital && (
                    <button onClick={() => { setCapitalVal(finanzas.capitalActual || 0); setDisponibleVal(finanzas.dineroDisponible || 0); setEditCapital(true); }}
                      className="text-xs text-accent dark:text-accent-light hover:underline font-semibold">Editar</button>
                  )}
                </div>
                {editCapital ? (
                  <div className="space-y-3">
                    <div>
                      <label className="text-xs font-medium text-slate-600 dark:text-slate-300">Capital Actual (patrimonio total)</label>
                      <input type="number" value={capitalVal} onChange={e => setCapitalVal(e.target.value)}
                        className="mt-1 w-full px-3 py-2 rounded-lg bg-slate-100 dark:bg-slate-800 border-none text-sm focus:ring-2 focus:ring-accent outline-none" />
                    </div>
                    <div>
                      <label className="text-xs font-medium text-slate-600 dark:text-slate-300">Dinero Disponible (liquidez)</label>
                      <input type="number" value={disponibleVal} onChange={e => setDisponibleVal(e.target.value)}
                        className="mt-1 w-full px-3 py-2 rounded-lg bg-slate-100 dark:bg-slate-800 border-none text-sm focus:ring-2 focus:ring-accent outline-none" />
                    </div>
                    <div className="flex gap-2 pt-1">
                      <button onClick={saveCapital} className="px-4 py-2 rounded-lg bg-accent hover:bg-accent-dark text-white text-xs font-bold transition">Guardar</button>
                      <button onClick={() => setEditCapital(false)} className="px-4 py-2 rounded-lg bg-slate-100 dark:bg-slate-800 text-slate-700 dark:text-slate-200 text-xs font-bold transition">Cancelar</button>
                    </div>
                  </div>
                ) : (
                  <div className="space-y-4">
                    <div className="flex justify-between items-center p-3 rounded-lg bg-slate-50 dark:bg-slate-800/50">
                      <span className="text-sm text-slate-600 dark:text-slate-300">Capital (Patrimonio)</span>
                      <span className="font-extrabold text-slate-900 dark:text-white">${(finanzas.capitalActual || 0).toLocaleString()}</span>
                    </div>
                    <div className="flex justify-between items-center p-3 rounded-lg bg-slate-50 dark:bg-slate-800/50">
                      <span className="text-sm text-slate-600 dark:text-slate-300">Disponible (Liquidez)</span>
                      <span className="font-extrabold text-emerald-600 dark:text-emerald-400">${(finanzas.dineroDisponible || 0).toLocaleString()}</span>
                    </div>
                    <div className="flex justify-between items-center p-3 rounded-lg bg-rose-50 dark:bg-rose-950/50">
                      <span className="text-sm text-slate-600 dark:text-slate-300">Deudas Activas</span>
                      <span className="font-extrabold text-rose-600 dark:text-rose-400">-${totalDeudas.toLocaleString()}</span>
                    </div>
                    <div className="flex justify-between items-center p-3 rounded-lg bg-emerald-50 dark:bg-emerald-950/50 border-t border-emerald-200 dark:border-emerald-900">
                      <span className="text-sm font-bold text-slate-700 dark:text-slate-200">Balance Neto</span>
                      <span className={`font-extrabold text-lg ${(finanzas.dineroDisponible||0) - totalDeudas >= 0 ? 'text-emerald-600 dark:text-emerald-400' : 'text-rose-600 dark:text-rose-400'}`}>
                        ${((finanzas.dineroDisponible || 0) - totalDeudas).toLocaleString()}
                      </span>
                    </div>
                  </div>
                )}
              </div>

              {/* Desglose de ingresos */}
              <div className="bg-white dark:bg-slate-900 p-5 rounded-xl border border-slate-200/80 dark:border-slate-800 shadow-sm">
                <h3 className="font-bold text-slate-900 dark:text-white text-base mb-4">Desglose de Ingresos</h3>
                <div className="space-y-3">
                  <div className="flex justify-between items-center p-3 rounded-lg bg-slate-50 dark:bg-slate-800/50">
                    <span className="text-sm text-slate-600 dark:text-slate-300">Clases cobradas</span>
                    <span className="font-bold text-accent dark:text-accent-light">${kpis.totalPaid.toLocaleString()}</span>
                  </div>
                  <div className="flex justify-between items-center p-3 rounded-lg bg-slate-50 dark:bg-slate-800/50">
                    <span className="text-sm text-slate-600 dark:text-slate-300">Clases pendientes</span>
                    <span className="font-bold text-amber-600 dark:text-amber-400">${kpis.totalPending.toLocaleString()}</span>
                  </div>
                  <div className="flex justify-between items-center p-3 rounded-lg bg-slate-50 dark:bg-slate-800/50">
                    <span className="text-sm text-slate-600 dark:text-slate-300">Otros ingresos</span>
                    <span className="font-bold text-emerald-600 dark:text-emerald-400">${totalOtrosIngresos.toLocaleString()}</span>
                  </div>
                  <div className="flex justify-between items-center p-3 rounded-lg bg-accent/10 dark:bg-accent/20 border border-accent/20">
                    <span className="text-sm font-bold text-slate-700 dark:text-slate-200">Total Ingresos</span>
                    <span className="font-extrabold text-accent dark:text-accent-light text-lg">${totalIngresos.toLocaleString()}</span>
                  </div>
                </div>
              </div>
            </div>
          )}

          {/* OTROS INGRESOS */}
          {tab === 'ingresos' && (
            <div className="grid grid-cols-1 lg:grid-cols-5 gap-6">
              {/* Formulario */}
              <div className="lg:col-span-2 bg-white dark:bg-slate-900 p-5 rounded-xl border border-slate-200/80 dark:border-slate-800 shadow-sm">
                <h3 className="font-bold text-slate-900 dark:text-white text-base mb-4">Registrar Ingreso</h3>
                <form onSubmit={addIngreso} className="space-y-3">
                  <div>
                    <label className="text-xs font-medium text-slate-600 dark:text-slate-300">Concepto</label>
                    <input value={form.concepto} onChange={e => setForm({...form, concepto: e.target.value})} placeholder="ej. Consultoría, Freelance…"
                      className="mt-1 w-full px-3 py-2 rounded-lg bg-slate-100 dark:bg-slate-800 border-none text-sm focus:ring-2 focus:ring-accent outline-none" />
                  </div>
                  <div>
                    <label className="text-xs font-medium text-slate-600 dark:text-slate-300">Monto</label>
                    <input type="number" value={form.monto} onChange={e => setForm({...form, monto: e.target.value})} placeholder="0"
                      className="mt-1 w-full px-3 py-2 rounded-lg bg-slate-100 dark:bg-slate-800 border-none text-sm focus:ring-2 focus:ring-accent outline-none" />
                  </div>
                  <div>
                    <label className="text-xs font-medium text-slate-600 dark:text-slate-300">Fecha</label>
                    <input type="date" value={form.fecha} onChange={e => setForm({...form, fecha: e.target.value})}
                      className="mt-1 w-full px-3 py-2 rounded-lg bg-slate-100 dark:bg-slate-800 border-none text-sm focus:ring-2 focus:ring-accent outline-none" />
                  </div>
                  <div>
                    <label className="text-xs font-medium text-slate-600 dark:text-slate-300">Notas (opcional)</label>
                    <input value={form.notas} onChange={e => setForm({...form, notas: e.target.value})} placeholder="Detalle adicional…"
                      className="mt-1 w-full px-3 py-2 rounded-lg bg-slate-100 dark:bg-slate-800 border-none text-sm focus:ring-2 focus:ring-accent outline-none" />
                  </div>
                  <button type="submit" className="w-full py-2 rounded-lg bg-accent hover:bg-accent-dark text-white text-xs font-bold transition">+ Agregar Ingreso</button>
                </form>
              </div>
              {/* Lista */}
              <div className="lg:col-span-3 bg-white dark:bg-slate-900 p-5 rounded-xl border border-slate-200/80 dark:border-slate-800 shadow-sm">
                <div className="flex items-center justify-between mb-4">
                  <h3 className="font-bold text-slate-900 dark:text-white text-base">Otros Ingresos</h3>
                  <span className="text-xs font-bold text-emerald-600 dark:text-emerald-400">Total: ${totalOtrosIngresos.toLocaleString()}</span>
                </div>
                {(finanzas.otrosIngresos || []).length === 0 ? (
                  <div className="p-8 text-center border border-dashed border-slate-200 dark:border-slate-800 rounded-xl">
                    <p className="text-xs text-slate-500">Aún no has registrado otros ingresos.</p>
                  </div>
                ) : (
                  <div className="space-y-2">
                    {[...(finanzas.otrosIngresos || [])].reverse().map(ing => (
                      <div key={ing.id} className="flex items-center justify-between p-3 rounded-lg border border-slate-100 dark:border-slate-800 bg-slate-50/50 dark:bg-slate-800/40">
                        <div>
                          <div className="text-sm font-semibold text-slate-900 dark:text-white">{ing.concepto}</div>
                          <div className="text-[11px] text-slate-400">{ing.fecha}{ing.notas ? ` • ${ing.notas}` : ''}</div>
                        </div>
                        <div className="flex items-center gap-3">
                          <span className="font-extrabold text-emerald-600 dark:text-emerald-400">${Number(ing.monto).toLocaleString()}</span>
                          <button onClick={() => removeIngreso(ing.id)} className="text-slate-400 hover:text-rose-500 transition text-xs">✕</button>
                        </div>
                      </div>
                    ))}
                  </div>
                )}
              </div>
            </div>
          )}

          {/* DEUDAS */}
          {tab === 'deudas' && (
            <div className="grid grid-cols-1 lg:grid-cols-5 gap-6">
              {/* Formulario */}
              <div className="lg:col-span-2 bg-white dark:bg-slate-900 p-5 rounded-xl border border-slate-200/80 dark:border-slate-800 shadow-sm">
                <h3 className="font-bold text-slate-900 dark:text-white text-base mb-4">Registrar Deuda</h3>
                <form onSubmit={addDeuda} className="space-y-3">
                  <div>
                    <label className="text-xs font-medium text-slate-600 dark:text-slate-300">Acreedor / Concepto</label>
                    <input value={deudaForm.acreedor} onChange={e => setDeudaForm({...deudaForm, acreedor: e.target.value})} placeholder="ej. Banco, Tarjeta, Persona…"
                      className="mt-1 w-full px-3 py-2 rounded-lg bg-slate-100 dark:bg-slate-800 border-none text-sm focus:ring-2 focus:ring-accent outline-none" />
                  </div>
                  <div>
                    <label className="text-xs font-medium text-slate-600 dark:text-slate-300">Monto</label>
                    <input type="number" value={deudaForm.monto} onChange={e => setDeudaForm({...deudaForm, monto: e.target.value})} placeholder="0"
                      className="mt-1 w-full px-3 py-2 rounded-lg bg-slate-100 dark:bg-slate-800 border-none text-sm focus:ring-2 focus:ring-accent outline-none" />
                  </div>
                  <div>
                    <label className="text-xs font-medium text-slate-600 dark:text-slate-300">Fecha de Vencimiento</label>
                    <input type="date" value={deudaForm.vence} onChange={e => setDeudaForm({...deudaForm, vence: e.target.value})}
                      className="mt-1 w-full px-3 py-2 rounded-lg bg-slate-100 dark:bg-slate-800 border-none text-sm focus:ring-2 focus:ring-accent outline-none" />
                  </div>
                  <div>
                    <label className="text-xs font-medium text-slate-600 dark:text-slate-300">Notas</label>
                    <input value={deudaForm.notas} onChange={e => setDeudaForm({...deudaForm, notas: e.target.value})} placeholder="Cuotas, interés, etc."
                      className="mt-1 w-full px-3 py-2 rounded-lg bg-slate-100 dark:bg-slate-800 border-none text-sm focus:ring-2 focus:ring-accent outline-none" />
                  </div>
                  <button type="submit" className="w-full py-2 rounded-lg bg-rose-600 hover:bg-rose-700 text-white text-xs font-bold transition">+ Agregar Deuda</button>
                </form>
              </div>
              {/* Lista */}
              <div className="lg:col-span-3 bg-white dark:bg-slate-900 p-5 rounded-xl border border-slate-200/80 dark:border-slate-800 shadow-sm">
                <div className="flex items-center justify-between mb-4">
                  <h3 className="font-bold text-slate-900 dark:text-white text-base">Deudas Registradas</h3>
                  <span className="text-xs font-bold text-rose-600 dark:text-rose-400">Pendiente: ${totalDeudas.toLocaleString()}</span>
                </div>
                {(finanzas.deudas || []).length === 0 ? (
                  <div className="p-8 text-center border border-dashed border-slate-200 dark:border-slate-800 rounded-xl">
                    <p className="text-xs text-slate-500">No tienes deudas registradas. ¡Excelente!</p>
                  </div>
                ) : (
                  <div className="space-y-2">
                    {(finanzas.deudas || []).map(d => (
                      <div key={d.id} className={`flex items-center justify-between p-3 rounded-lg border ${d.pagada ? 'border-slate-100 dark:border-slate-800 opacity-50' : 'border-rose-200 dark:border-rose-900 bg-rose-50/50 dark:bg-rose-950/30'}`}>
                        <div className="flex items-center gap-3">
                          <input type="checkbox" checked={d.pagada} onChange={() => toggleDeudaPagada(d.id)} className="accent-emerald-500 w-4 h-4 cursor-pointer" />
                          <div>
                            <div className={`text-sm font-semibold ${d.pagada ? 'line-through text-slate-400' : 'text-slate-900 dark:text-white'}`}>{d.acreedor}</div>
                            <div className="text-[11px] text-slate-400">{d.vence ? `Vence: ${d.vence}` : 'Sin fecha'}{d.notas ? ` • ${d.notas}` : ''}</div>
                          </div>
                        </div>
                        <div className="flex items-center gap-3">
                          <span className={`font-extrabold ${d.pagada ? 'text-slate-400 line-through' : 'text-rose-600 dark:text-rose-400'}`}>${Number(d.monto).toLocaleString()}</span>

                      </div>
