    // ----------------------------------------------------
    // COMPONENTE ERROR BOUNDARY (PROTECCIÓN GLOBAL CONTRA PANTALLAS EN BLANCO)
    // ----------------------------------------------------
    class ErrorBoundary extends React.Component {
      constructor(props) {
        super(props);
        this.state = { hasError: false, error: null, errorInfo: null };
      }
      static getDerivedStateFromError(error) {
        return { hasError: true, error };
      }
      componentDidCatch(error, errorInfo) {
        console.error("ErrorBoundary caught error:", error, errorInfo);
        this.setState({ errorInfo });
      }
      render() {
        if (this.state.hasError) {
          return (
            <div className="min-h-screen flex items-center justify-center p-6 bg-slate-50 dark:bg-slate-900">
              <div className="max-w-lg w-full bg-white dark:bg-slate-800 p-6 rounded-2xl shadow-xl border border-rose-200 dark:border-rose-900/50 space-y-4">
                <div className="flex items-center gap-3 text-rose-600 dark:text-rose-400">
                  <span className="text-2xl">⚠️</span>
                  <h3 className="text-base font-bold">Ocurrió un error al cargar la vista</h3>
                </div>
                <p className="text-xs text-slate-600 dark:text-slate-300">
                  Se ha producido una excepción al renderizar:
                </p>
                <div className="p-3 bg-rose-50 dark:bg-rose-950/40 text-rose-700 dark:text-rose-300 rounded-lg text-xs font-mono break-all max-h-40 overflow-y-auto">
                  {String(this.state.error && (this.state.error.stack || this.state.error.message || this.state.error))}
                </div>
                <div className="flex gap-2 pt-2">
                  <button
                    onClick={() => {
                      this.setState({ hasError: false, error: null });
                      window.location.reload();
                    }}
                    className="flex-1 py-2 px-4 rounded-xl bg-accent text-white text-xs font-bold shadow hover:bg-accent-dark transition"
                  >
                    Recargar Página
                  </button>
                  <button
                    onClick={() => {
                      try {
                        localStorage.removeItem('roberto_dashboard_v14_zero_balances');
                      } catch(e) {}
                      window.location.reload();
                    }}
                    className="py-2 px-3 rounded-xl bg-slate-100 dark:bg-slate-700 text-slate-700 dark:text-slate-300 text-xs font-semibold hover:bg-slate-200 transition"
                    title="Restablece la memoria local corrupta"
                  >
                    Limpiar Caché Local
                  </button>
                </div>
              </div>
            </div>
          );
        }
        return this.props.children;
      }
    }

    // ----------------------------------------------------

    // ----------------------------------------------------
    // Función auxiliar para eliminar facturas duplicadas
    function deduplicatePaymentsList(paymentsList) {
      if (!Array.isArray(paymentsList)) return [];
      const seen = new Set();
      const clean = [];
      for (const p of paymentsList) {
        // Clave única basada en alumno, monto, fecha y concepto
        const key = `${p.studentId || p.studentName}|${p.amount}|${p.date}|${(p.notes || '').trim()}`;
        if (!seen.has(key)) {
          seen.add(key);
          clean.push(p);
        }
      }
      return clean;
    }

    // Funciones auxiliares para deduplicar y fusionar clases y reservas
    function mergeClassesLists(...lists) {
      const map = new Map();
      for (const list of lists) {
        if (Array.isArray(list)) {
          for (const c of list) {
            if (!c) continue;
            // Clave única basada en ID o en Nombre + Fecha + Hora
            const compositeKey = (c.id && !c.id.startsWith('c-')) 
              ? c.id 
              : `${(c.name || '').trim().toLowerCase()}|${c.date || ''}|${c.time || ''}`;
            if (!map.has(compositeKey)) {
              map.set(compositeKey, c);
            } else {
              // Si ya existe, conservar el objeto que tenga más propiedades/detalles
              const existing = map.get(compositeKey);
              map.set(compositeKey, { ...existing, ...c });
            }
          }
        }
      }
      return Array.from(map.values());
    }

    function mergeBookingsLists(...lists) {
      const map = new Map();
      for (const list of lists) {
        if (Array.isArray(list)) {
          for (const b of list) {
            if (!b) continue;
            const compositeKey = b.id || `${b.studentId || b.studentName}|${b.date}|${b.time}`;
            if (!map.has(compositeKey)) {
              map.set(compositeKey, b);
            } else {
              const existing = map.get(compositeKey);
              map.set(compositeKey, { ...existing, ...b });
            }
          }
        }
      }
      return Array.from(map.values());
    }

        'roberto_dashboard_v6_schedule',
        'roberto_dashboard_v6',
        'roberto_dashboard_v5_rates',
        'roberto_dashboard_v4_students',
        'roberto_dashboard_v3_clean',
        'roberto_dashboard_v2_es',
        'roberto_dashboard_v2_data',
        'roberto_dashboard_v1'
      ];

      const keySet = new Set(allHistoricalKeys);
      try {
        for (let i = 0; i < localStorage.length; i++) {
          const k = localStorage.key(i);
          if (k && (k.startsWith('roberto_dashboard') || k.includes('roberto'))) {
            keySet.add(k);
          }
        }
      } catch(e) {}

      const reports = [];
      let mergedClasses = [];
      let mergedBookings = [];
      let foundTasks = [];
      let foundPayments = [];
      let foundFinanzas = null;
      let foundStudents = [];

      for (const key of keySet) {
        try {
          const val = localStorage.getItem(key);
          if (val) {
            const parsed = JSON.parse(val);
            const classCount = Array.isArray(parsed.classes) ? parsed.classes.length : 0;
            const bookingCount = Array.isArray(parsed.bookings) ? parsed.bookings.length : 0;
            reports.push({ key, classCount, bookingCount, data: parsed });

            if (Array.isArray(parsed.classes) && parsed.classes.length > 0) {
              mergedClasses = mergeClassesLists(mergedClasses, parsed.classes);
            }
            if (Array.isArray(parsed.bookings) && parsed.bookings.length > 0) {
              mergedBookings = mergeBookingsLists(mergedBookings, parsed.bookings);
            }
            if (foundTasks.length === 0 && Array.isArray(parsed.tasks) && parsed.tasks.length > 0) {
              foundTasks = parsed.tasks;
            }
            if (foundPayments.length === 0 && Array.isArray(parsed.payments) && parsed.payments.length > 0) {
              foundPayments = parsed.payments;
            }
            if (!foundFinanzas && parsed.finanzas) {
              foundFinanzas = parsed.finanzas;
            }
            if (foundStudents.length === 0 && Array.isArray(parsed.students) && parsed.students.length > 0) {
              foundStudents = parsed.students;
            }
          }
        } catch (e) {}
      }

      return {
        reports,
        mergedClasses,
        mergedBookings,
        foundTasks,
        foundPayments,
        foundFinanzas,
        foundStudents
      };
    }

    function App() {
      const [data, setData] = useState(() => {
        try {
          const scan = scanAllLocalStorageData();
          let baseData = null;
          const saved = localStorage.getItem(STORAGE_KEY);
          if (saved) {
            try {
              baseData = JSON.parse(saved);
            } catch (e) {}
          }

          // Combinar las clases de baseData con TODAS las clases encontradas en cualquier clave previa
          const allCandidateClasses = mergeClassesLists(
            (baseData && Array.isArray(baseData.classes)) ? baseData.classes : [],
            scan.mergedClasses,
            INITIAL_DATA.classes
          );

          const allCandidateBookings = mergeBookingsLists(
            (baseData && Array.isArray(baseData.bookings)) ? baseData.bookings : [],
            scan.mergedBookings,
            INITIAL_DATA.bookings
          );

          const result = {
            ...(baseData || INITIAL_DATA),
            tasks: (baseData && Array.isArray(baseData.tasks) && baseData.tasks.length > 0) 
              ? baseData.tasks 
              : ((scan.foundTasks && scan.foundTasks.length > 0) ? scan.foundTasks : INITIAL_DATA.tasks),
            classes: allCandidateClasses.length > 0 ? allCandidateClasses : INITIAL_DATA.classes,
            bookings: allCandidateBookings.length > 0 ? allCandidateBookings : INITIAL_DATA.bookings,
            payments: deduplicatePaymentsList((baseData && baseData.payments) || scan.foundPayments || INITIAL_DATA.payments || []),
            students: (baseData && Array.isArray(baseData.students) && baseData.students.length > 0)
              ? baseData.students
              : ((scan.foundStudents && scan.foundStudents.length > 0) ? scan.foundStudents : INITIAL_DATA.students),
            finanzas: (baseData && baseData.finanzas) || scan.foundFinanzas || INITIAL_DATA.finanzas
          };

          return result;
        } catch (e) {
          console.error("Error al leer el estado guardado", e);
        }
        return INITIAL_DATA;
      });

      const [currentTab, setCurrentTab] = useState('overview');
      const [isDark, setIsDark] = useState(() => localStorage.getItem('roberto_theme') === 'dark');
      const [toast, setToast] = useState(null);
      const [searchQuery, setSearchQuery] = useState('');
      const [modal, setModal] = useState(null);

      const [syncStatus, setSyncStatus] = useState('offline'); // 'synced', 'syncing', 'offline'
      const isRemoteUpdateRef = useRef(false);
      const isInitialCloudLoadComplete = useRef(false);

      // Función explícita para descargar desde Supabase
      const reloadFromCloud = async () => {
        if (!supabaseClient) return;
        try {
          setSyncStatus('syncing');
          const { data: records, error } = await supabaseClient
            .from('dashboard_state')
            .select('data')
            .eq('id', 'roberto_main')
            .single();

          if (records && records.data) {
            isRemoteUpdateRef.current = true;
            isInitialCloudLoadComplete.current = true;
            setData(prev => {
              const cloudData = records.data;
              const mergedClasses = mergeClassesLists(prev.classes || [], cloudData.classes || []);
              const mergedBookings = mergeBookingsLists(prev.bookings || [], cloudData.bookings || []);
              return {
                ...prev,
                ...cloudData,
                classes: mergedClasses.length > 0 ? mergedClasses : INITIAL_DATA.classes,
                bookings: mergedBookings.length > 0 ? mergedBookings : INITIAL_DATA.bookings
              };
            });
            setSyncStatus('synced');
            showToast("¡Datos actualizados desde la nube!");
          } else if (error) {
            console.error("Supabase fetch error:", error);
            setSyncStatus('offline');
          }
        } catch (err) {
          console.warn("Supabase reload error:", err);
          setSyncStatus('offline');
        }
      };

      // Cargar datos iniciales desde Supabase y escuchar cambios en tiempo real
      useEffect(() => {
        if (!supabaseClient) return;

        let channel = null;

        async function fetchFromSupabase() {
          try {
            setSyncStatus('syncing');
            const { data: records, error } = await supabaseClient
              .from('dashboard_state')
              .select('data')
              .eq('id', 'roberto_main')
              .single();

            if (records && records.data) {
              isRemoteUpdateRef.current = true;
              isInitialCloudLoadComplete.current = true;
              setData(prev => {
                const cloudData = records.data;
                const mergedClasses = mergeClassesLists(prev.classes || [], cloudData.classes || []);
                const mergedBookings = mergeBookingsLists(prev.bookings || [], cloudData.bookings || []);
                return {
                  ...prev,
                  ...cloudData,
                  classes: mergedClasses.length > 0 ? mergedClasses : INITIAL_DATA.classes,
                  bookings: mergedBookings.length > 0 ? mergedBookings : INITIAL_DATA.bookings
                };
              });
              setSyncStatus('synced');
            } else if (error && error.code === 'PGRST116') {
              // Si no existe el registro en la base de datos, recién ahora permitimos crear el inicial
              isInitialCloudLoadComplete.current = true;
              const { error: upErr } = await supabaseClient
                .from('dashboard_state')
                .upsert({ id: 'roberto_main', data: data, updated_at: new Date().toISOString() });
              if (!upErr) {
                setSyncStatus('synced');
              } else {
                setSyncStatus('offline');
              }
            } else {
              isInitialCloudLoadComplete.current = true;
              if (error) console.error("Supabase error:", error);
              setSyncStatus('offline');
            }
          } catch (err) {
            isInitialCloudLoadComplete.current = true;
            console.warn("Supabase fetch notice:", err);
            setSyncStatus('offline');
          }
        }

        fetchFromSupabase();

        // Suscripción en Tiempo Real (Realtime)
        try {
          channel = supabaseClient
            .channel('dashboard_realtime')
            .on(
              'postgres_changes',
              { event: '*', schema: 'public', table: 'dashboard_state', filter: 'id=eq.roberto_main' },
              (payload) => {
                if (payload.new && payload.new.data) {
                  isRemoteUpdateRef.current = true;
                  setData(prev => {
                    const newData = payload.new.data;
                    const mergedClasses = mergeClassesLists(prev.classes || [], newData.classes || []);
                    const mergedBookings = mergeBookingsLists(prev.bookings || [], newData.bookings || []);
                    return {
                      ...prev,
                      ...newData,
                      classes: mergedClasses.length > 0 ? mergedClasses : INITIAL_DATA.classes,
                      bookings: mergedBookings.length > 0 ? mergedBookings : INITIAL_DATA.bookings
                    };
                  });
                  setSyncStatus('synced');
                  showToast("¡Actualizado en tiempo real!", "info");
                }
              }
            )
            .subscribe();
        } catch (err) {
          console.warn("Realtime subscription error:", err);
        }

        return () => {
          if (channel) {
            supabaseClient.removeChannel(channel);
          }
        };
      }, []);

      // Guardar en localStorage y sincronizar hacia Supabase (SOLO si ya se cargó la nube primero)
      useEffect(() => {
        try {
          localStorage.setItem(STORAGE_KEY, JSON.stringify(data));
        } catch (e) {
          console.error("Error de almacenamiento local", e);
        }

        // Si la actualización vino de la nube, no la reenviamos
        if (isRemoteUpdateRef.current) {
          isRemoteUpdateRef.current = false;
          return;
        }

        // Evitar que el estado inicial local sobrescriba la nube antes de que termine el primer fetch
        if (!isInitialCloudLoadComplete.current) {
          return;
        }

        if (supabaseClient) {
          const timeoutId = setTimeout(async () => {
            try {
              setSyncStatus('syncing');
              const { error } = await supabaseClient
                .from('dashboard_state')
                .upsert({
                  id: 'roberto_main',
                  data: data,
                  updated_at: new Date().toISOString()
                });
              if (!error) {
                setSyncStatus('synced');
              } else {
                setSyncStatus('offline');
              }
            } catch (err) {
              setSyncStatus('offline');
            }
          }, 600);
          return () => clearTimeout(timeoutId);
        }
      }, [data]);

      // Alternar tema
      useEffect(() => {
        if (isDark) {
          document.documentElement.classList.add('dark');
          localStorage.setItem('roberto_theme', 'dark');
        } else {
          document.documentElement.classList.remove('dark');
          localStorage.setItem('roberto_theme', 'light');
        }
      }, [isDark]);

      const showToast = (message, type = 'success') => {
        setToast({ message, type });
        setTimeout(() => setToast(null), 3500);
      };

      // --------------------------------------------------
      // ACCIONES CRUD
      // --------------------------------------------------

      // Tareas
      const toggleTaskStatus = (id) => {
        setData(prev => ({
          ...prev,
          tasks: prev.tasks.map(t => {
            if (t.id === id) {
              const nextStatus = t.status === 'completada' ? 'pendiente' : 'completada';
              return { ...t, status: nextStatus };
            }
            return t;
          })
        }));
        showToast("Estado de tarea actualizado");
      };

      const saveTask = (task) => {
        setData(prev => {
          const exists = prev.tasks.some(t => t.id === task.id);
          const tasks = exists
            ? prev.tasks.map(t => t.id === task.id ? task : t)
            : [{ ...task, id: 't-' + Date.now() }, ...prev.tasks];
          return { ...prev, tasks };
        });
        setModal(null);
        showToast(task.id ? "Tarea guardada" : "Nueva tarea creada");
      };

      const deleteTask = (id) => {
        if (confirm("¿Deseas eliminar esta tarea?")) {
          setData(prev => ({ ...prev, tasks: prev.tasks.filter(t => t.id !== id) }));
          showToast("Tarea eliminada", "info");

      };

      // Clases
      const saveClass = (cls) => {
        setData(prev => {
          const exists = prev.classes.some(c => c.id === cls.id);
          const classId = exists ? cls.id : 'c-' + Date.now();
          const autoInvoice = cls.autoInvoice;
          const isNonBillable = cls.billingType && cls.billingType !== 'Regular';
          
          // Remove autoInvoice from class object
          const classData = { ...cls };
          delete classData.autoInvoice;
          if (!exists) classData.id = classId;

          const classes = exists
            ? prev.classes.map(c => c.id === classId ? classData : c)
            : [classData, ...prev.classes];

          let newPayments = [];
          if (!exists && !isNonBillable && autoInvoice && classData.enrolledStudentIds && classData.enrolledStudentIds.length > 0) {
            classData.enrolledStudentIds.forEach((studentId, idx) => {
              const student = prev.students.find(s => s.id === studentId);
              if (student) {
                newPayments.push({
                  id: 'inv-' + Date.now() + '-' + idx,
                  invoiceNum: 'FAC-' + new Date().getFullYear() + '-' + Math.floor(Math.random() * 10000),
                  studentId: student.id,
                  studentName: student.name,
                  amount: student.hourlyRate * (classData.durationMinutes / 60),
                  date: classData.date || new Date().toISOString().slice(0, 10),
                  dueDate: classData.date || new Date().toISOString().slice(0, 10),
                  method: 'Transferencia',
                  status: 'Pendiente',
                  notes: `Clase: ${classData.name} (${classData.time})`
                });
              }
            });
          }

          // Si la clase es no facturable (cortesía/gratis/reposición), eliminar CUALQUIER factura (incluso si estaba como Pagada o Pendiente) para que no sume a cobros ni a saldo pendiente
          let currentPayments = prev.payments;
          if (isNonBillable) {
            currentPayments = currentPayments.filter(p => {
              const matchesNote = p.notes && (p.notes.includes(classData.name) || p.notes.includes(cls.id));
              return !matchesNote;
            });
          }

          const payments = [...newPayments, ...currentPayments];

          return { ...prev, classes, payments };
        });
        setModal(null);
        showToast("Clase guardada correctamente");
      };

      const clearAllClasses = () => {
        if (confirm("¿Estás seguro de que deseas limpiar todas las clases agendadas y poner en cero todos los saldos pendientes de los alumnos?")) {

          }));

      // Pagos

            : [newPayment, ...prev.payments];
          return { ...prev, payments };

        }));

          if (newStatus === 'Pagada') {
            // Find existing invoice for this class or create one marked Pagado
            const hasInv = updatedPayments.some(p => p.notes && p.notes.includes(cls?.name));
            if (hasInv) {
              updatedPayments = updatedPayments.map(p => (p.notes && p.notes.includes(cls?.name)) ? { ...p, status: 'Pagado' } : p);

                    studentName: s.name,
                    amount: s.hourlyRate * ((cls.durationMinutes || 60) / 60),

                    status: 'Pagado',
                    notes: `Clase: ${cls.name} (${cls.time})`
                  });
                }
              });
            }
          } else if (newStatus === 'Pendiente') {
            // Ensure status is Pendiente
            const hasInv = updatedPayments.some(p => p.notes && p.notes.includes(cls?.name));
            if (hasInv) {
              updatedPayments = updatedPayments.map(p => (p.notes && p.notes.includes(cls?.name)) ? { ...p, status: 'Pendiente' } : p);
            } else if (cls && cls.enrolledStudentIds && cls.enrolledStudentIds.length > 0) {
              cls.enrolledStudentIds.forEach((sId, idx) => {
                const s = prev.students.find(st => st.id === sId);
                if (s) {
                  // Check if this student already has an invoice for this class
                  const alreadyExists = updatedPayments.some(p => p.studentId === s.id && p.notes && p.notes.includes(cls.name));
                  if (!alreadyExists) {
                    updatedPayments.unshift({
                      id: 'inv-' + Date.now() + '-' + idx,
                      invoiceNum: 'FAC-' + new Date().getFullYear() + '-' + Math.floor(1000 + Math.random() * 9000),
                      studentId: s.id,
                      studentName: s.name,
                      amount: s.hourlyRate * ((cls.durationMinutes || 60) / 60),
                      date: cls.date || new Date().toISOString().slice(0, 10),
                      dueDate: cls.date || new Date().toISOString().slice(0, 10),

                      status: 'Pendiente',
                      notes: `Clase: ${cls.name} (${cls.time})`

        setData(prev => {

      // --------------------------------------------------
      // COPIA DE SEGURIDAD, RESTAURACIÓN Y LIMPIEZA
      // --------------------------------------------------
      const exportJsonBackup = () => {
        const jsonString = `data:text/json;charset=utf-8,${encodeURIComponent(JSON.stringify(data, null, 2))}`;

      const exportCsv = (type) => {

        if (type === 'pagos') {
          headers = ['Nº Factura', 'Alumno', 'Importe ($)', 'Fecha Emisión', 'Fecha Límite', 'Método', 'Estado', 'Notas'];
